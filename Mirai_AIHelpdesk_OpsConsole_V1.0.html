<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIヘルプデスク 運用統合</title>
<style>
:root{--bg:#f2f4f8;--panel:#fff;--panel2:#f7f9fc;--ink:#18212c;--mute:#5d6977;--line:#dde3ea;--accent:#1d5fc4;--accent-soft:#e6eefb;--ai:#6941c6;--ai-soft:#f1ecfc;--ok:#18794e;--ok-soft:#e3f4ea;--warn:#a1640c;--warn-soft:#fbf0dc;--bad:#c2292e;--bad-soft:#fbe5e5;--chip:#eef1f5;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);--shadow-h:0 10px 28px rgba(16,24,40,.13);--blob1:rgba(29,95,196,.08);--blob2:rgba(105,65,198,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131a;--panel:#161d26;--panel2:#1b2430;--ink:#e5ebf2;--mute:#93a0af;--line:#2a3441;--accent:#5c9bff;--accent-soft:#1c2c45;--ai:#a88bf0;--ai-soft:#262040;--ok:#4cc38a;--ok-soft:#173326;--warn:#e0a43c;--warn-soft:#352a15;--bad:#f07178;--bad-soft:#3a1d20;--chip:#222b37;--shadow:none;--shadow-h:0 10px 28px rgba(0,0,0,.45);--blob1:rgba(92,155,255,.07);--blob2:rgba(168,139,240,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131a;--panel:#161d26;--panel2:#1b2430;--ink:#e5ebf2;--mute:#93a0af;--line:#2a3441;--accent:#5c9bff;--accent-soft:#1c2c45;--ai:#a88bf0;--ai-soft:#262040;--ok:#4cc38a;--ok-soft:#173326;--warn:#e0a43c;--warn-soft:#352a15;--bad:#f07178;--bad-soft:#3a1d20;--chip:#222b37;--shadow:none;--shadow-h:0 10px 28px rgba(0,0,0,.45);--blob1:rgba(92,155,255,.07);--blob2:rgba(168,139,240,.07);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 8% -10%,var(--blob1),transparent 60%),radial-gradient(800px 520px at 100% 0,var(--blob2),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:14px/1.6 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif}
h1{font-size:20px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}h3{font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.mt0{margin-top:0}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-4px}
.ico.sm{width:14px;height:14px;vertical-align:-2px}.ico.lg{width:22px;height:22px}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:58px}
.brand{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.brand small{display:block;color:var(--mute);font-size:11px;line-height:1.3}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--ai),#0ea5e9,var(--accent));background-size:300% 300%;animation:grad 7s ease infinite;color:#fff;display:grid;place-items:center;position:relative;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--ai) 35%,transparent)}
.logo svg{width:22px;height:22px;animation:bob 3s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:2px solid var(--ai);opacity:0;animation:ping 2.8s ease-out infinite}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--ok-soft);color:var(--ok);font-weight:700;--pc:color-mix(in srgb,var(--ok) 55%,transparent);transition:background .3s,color .3s}
.live.busy{background:var(--ai-soft);color:var(--ai);--pc:color-mix(in srgb,var(--ai) 55%,transparent)}
.live .ld{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pr 1.6s infinite}
.topctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.topctl select{width:auto;padding:5px 8px}
.clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:3px 8px;border-radius:8px;background:var(--chip);color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.actorbox{display:inline-flex}
/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);padding:12px 8px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:11px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px;font-size:13px;transition:background .2s,color .2s}
nav a .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--mute);transition:transform .25s,background .25s,color .25s,box-shadow .25s;flex:none}
nav a .ni svg{width:16px;height:16px}
nav a .lb{flex:1;min-width:0;line-height:1.35}
nav a:hover{background:var(--chip)}nav a:hover .ni{transform:scale(1.1) rotate(-6deg)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav a.on .ni{background:linear-gradient(135deg,var(--accent),var(--ai));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
nav a.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent);animation:growY .3s}
nav .cnt{font-size:11px;min-width:22px;padding:0 6px;border-radius:10px;background:var(--chip);color:var(--mute);text-align:center;font-weight:700}
nav .cnt.hot{background:var(--bad);color:#fff;animation:beat 1.6s infinite}
nav .sep{height:1px;background:var(--line);margin:8px 6px}
nav .navnote{font-size:11px;color:var(--mute);padding:10px;line-height:1.55;display:flex;gap:6px}
main{padding:20px 22px 48px;min-width:0}
.ph{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.ph .sub{margin:0}
.pic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.sub{color:var(--mute);margin:0 0 16px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.card.hov:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}.g-side{grid-template-columns:minmax(250px,330px) minmax(0,1fr)}
/* ---------- controls ---------- */
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;font-size:13px;line-height:1.4;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,filter .2s,background .2s}
.btn .ico{width:16px;height:16px;vertical-align:0}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 28%,transparent);filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--chip);box-shadow:none}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.ai{background:linear-gradient(135deg,var(--ai),var(--accent));border-color:transparent}
.btn.sm{padding:4px 10px;font-size:12px}.btn.sm .ico{width:14px;height:14px}
.btn.ready{animation:readyGlow 1.6s infinite}
.btn.ok:hover{box-shadow:0 5px 14px color-mix(in srgb,var(--ok) 32%,transparent)}
.btn.bad:hover{box-shadow:0 5px 14px color-mix(in srgb,var(--bad) 32%,transparent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:3px}
.lbl{font-size:12px;color:var(--mute);margin-bottom:4px;display:flex;gap:5px;align-items:center}
.fld{margin-bottom:12px;flex:1 1 170px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label.f{flex:1 1 150px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;padding:6px 6px;border-radius:8px;color:var(--mute);cursor:pointer;display:inline-flex;gap:5px;align-items:center;justify-content:center;transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.seg button .ico{width:14px;height:14px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on .ico{color:var(--accent);animation:popIn .35s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:2px 0 12px}
.tile{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink);text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;position:relative;overflow:hidden;line-height:1.35}
.tile:hover{border-color:var(--cc);transform:translateY(-2px)}
.tile.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 9%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 18%,transparent);font-weight:700}
.tile.on .cico{animation:popIn .4s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--mute);white-space:nowrap;font-weight:700;line-height:1.7}
.badge .ico{width:12px;height:12px;vertical-align:0}
.b-ai{background:var(--ai-soft);color:var(--ai)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent)}
.p1{background:var(--bad);color:#fff;animation:p1g 1.8s infinite}.p2{background:var(--warn-soft);color:var(--warn)}.p3{background:var(--accent-soft);color:var(--accent)}
.blink{animation:blink 1.2s infinite}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.dot.live{--pc:color-mix(in srgb,currentColor 55%,transparent);animation:pr 1.6s infinite}
.dot.live{padding:0;color:inherit;gap:0;display:inline-block;border-radius:50%}
td.mono{white-space:nowrap}
.sc-ok{background:var(--ok-soft);color:var(--ok)}.sc-warn{background:var(--warn-soft);color:var(--warn)}.sc-mute{background:var(--chip);color:var(--mute)}
.hit{background:var(--ai-soft);color:var(--ai)}
.cico{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent);flex:none}
.cico svg{width:15px;height:15px}
.catl{display:inline-flex;align-items:center;gap:7px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:hsl(var(--h,210),55%,48%);flex:none;line-height:1}
.av.ai{background:linear-gradient(135deg,var(--accent),var(--ai))}
.av.ai svg{width:14px;height:14px}
.avn{display:inline-flex;align-items:center;gap:6px}
.aic{width:28px;height:28px;border-radius:9px;display:inline-grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent);flex:none}
.aic svg{width:15px;height:15px}
/* ---------- tables ---------- */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--panel2);white-space:nowrap}
tr.click{cursor:pointer}tr.click td{transition:background .15s}tr.click:hover td{background:var(--panel2)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hint{font-size:12px;color:var(--mute)}
/* ---------- flow bar ---------- */
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px}
.fs{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px 3px 3px;border-radius:14px;background:var(--chip);color:var(--mute);position:relative;overflow:hidden;cursor:pointer;transition:transform .2s}
.fs:hover{transform:translateY(-1px)}
.fs .fi{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--panel)}
.fs .fi svg{width:12px;height:12px}
.fs.on{background:var(--accent);color:#fff;font-weight:700}.fs.on.a{background:var(--ai)}.fs.on.h{background:var(--warn)}.fs.on.s{background:var(--ok)}
.fs.on .fi{background:rgba(255,255,255,.25)}
.fs.on::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 2.6s infinite}
.fa{color:var(--mute);font-size:11px}
/* ---------- pipeline ---------- */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:8px}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 12px 10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;--tc:var(--accent)}
.stage.c-a{--tc:var(--ai)}.stage.c-h{--tc:var(--warn)}.stage.c-s{--tc:var(--ok)}
.stage::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:4px;border-radius:14px 14px 0 0;background:var(--tc)}
.stage:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:var(--tc)}
.st-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.st-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);position:relative}
.stage.alive .st-ic::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:2px solid var(--tc);animation:ping 1.8s ease-out infinite}
.stage:hover .st-ic svg{animation:wiggle .5s}
.stage .no{font-size:10px;font-weight:800;color:var(--mute);letter-spacing:.04em}
.stage .l{font-size:12.5px;font-weight:700;line-height:1.35;min-height:2.7em}
.stage .n{font-size:28px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stage .s{font-size:11px;color:var(--mute);min-height:1.6em}
.stage .who{margin-top:6px;display:inline-flex;gap:4px;align-items:center;font-size:10.5px;font-weight:700;color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent);padding:1px 7px;border-radius:9px}
.stage:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:8px;height:8px;border-top:2px solid var(--mute);border-right:2px solid var(--mute);transform:translateY(-50%) rotate(45deg);animation:nudge 1.4s ease-in-out infinite}
.rail{position:relative;height:6px;border-radius:3px;margin:2px 6px 16px;background:linear-gradient(90deg,var(--accent),var(--ai),var(--warn),var(--warn),var(--ai),var(--warn),var(--ok));opacity:.85;overflow:hidden}
.rail i{position:absolute;top:-4px;left:-30px;width:30px;height:14px;border-radius:7px;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));animation:travel 4.5s linear infinite}
.rail i:nth-child(2){animation-delay:.9s}.rail i:nth-child(3){animation-delay:1.8s}.rail i:nth-child(4){animation-delay:2.7s}.rail i:nth-child(5){animation-delay:3.6s}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px}
/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.kpi{display:flex;gap:12px;align-items:center;padding:13px 14px}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}.kpi .l{font-size:12px;color:var(--mute)}
.ki{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent)}
.ki svg{width:22px;height:22px}
.ki.alarm svg{animation:alarm 1.4s infinite}
.ring-wrap{position:relative;width:62px;height:62px;flex:none}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.ring{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.rbg{stroke:var(--chip)}.rfg{stroke-dasharray:282.74;stroke-linecap:round}
#main.anim .rfg{animation:ringIn 1.3s cubic-bezier(.2,.8,.2,1) both}
/* ---------- lists ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;padding:4px 11px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink);position:relative;overflow:hidden;display:inline-flex;gap:5px;align-items:center;transition:background .2s,color .2s}
.chip .ico{width:13px;height:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px;max-height:72vh;overflow:auto;padding:2px}
.li{border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;background:var(--panel);transition:transform .18s,border-color .18s,box-shadow .18s;display:flex;gap:9px;align-items:flex-start}
.li>.bd{flex:1;min-width:0}
.li:hover{border-color:var(--accent);transform:translateX(3px)}
.li.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.li .t{font-weight:600;font-size:13px;line-height:1.45}
.li .m{font-size:11px;color:var(--mute);display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:320px;max-height:58vh;overflow:auto;padding:6px 4px;scroll-behavior:smooth}
.mrow{display:flex;gap:8px;align-items:flex-start}
.mrow.user{flex-direction:row-reverse}
.mrow .av{width:32px;height:32px;font-size:13px;margin-top:2px}
.mrow .av.ai svg{width:17px;height:17px}
.msg{max-width:84%;padding:10px 12px;border-radius:14px;min-width:0}
.msg .tx{white-space:pre-wrap;word-break:break-word}
.msg.ai{background:var(--ai-soft);border-top-left-radius:4px}
.msg.user{background:var(--accent-soft);border-top-right-radius:4px}
.msg.ai.sec{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 60%,transparent)}
.msg .who{font-size:11px;font-weight:700;color:var(--ai);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.msg.sec .who{color:var(--bad)}
.secic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bad);color:#fff;float:left;margin:0 8px 4px 0;--pc:color-mix(in srgb,var(--bad) 55%,transparent);animation:pr 1.4s infinite}
.sysline{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:11.5px;white-space:nowrap}
.sysline::before,.sysline::after{content:"";flex:1;height:1px;background:var(--line)}
.sysline .ico{width:13px;height:13px}

.kbcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ai);border-radius:10px;padding:10px 12px;margin-top:8px}

#main.anim .meter>i,#main.anim-d .meter>i,.pop .meter>i,.anim-in .meter>i,.modal.open .meter>i,#main.anim .bar>i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.actions{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.inrow{display:flex;gap:8px;margin-top:10px}.inrow input{flex:1}

.msteps{display:flex;align-items:center;margin:10px 0 4px;max-width:420px}

/* ---------- drawer / modal / toast ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:40;overflow:auto;padding:18px 20px}

.runlist{list-style:none;padding:0;margin:10px 0 14px}

.runlist .rsi{color:var(--mute);opacity:.5}.runlist li.done .rsi{color:var(--ok);opacity:1}
.wait{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--ai);border-radius:50%;animation:spin .7s linear infinite}
.okwrap{display:flex;gap:14px;align-items:center;background:var(--ok-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--ok)}

.bigok{width:56px;height:56px;flex:none}

.bigok path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .5s forwards}
.rm-h{display:flex;gap:12px;align-items:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
.flash{position:fixed;inset:0;pointer-events:none;z-index:65;box-shadow:inset 0 0 0 4px var(--bad),inset 0 0 90px color-mix(in srgb,var(--bad) 40%,transparent);animation:flashA 1.6s ease-out forwards}
/* ---------- misc ---------- */
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;font-size:13px;cursor:pointer;border-radius:9px;transition:background .2s,color .2s}
.chk:hover{background:var(--panel2)}
.chk input{width:16px;height:16px;margin-top:3px;flex:none;accent-color:var(--ok)}
.chk.done{color:var(--ok)}
.ckprog{display:flex;gap:10px;align-items:center;margin:2px 0 6px;font-size:12px}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ai));transform-origin:left;border-radius:4px}
.barrow{display:grid;grid-template-columns:170px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.empty{color:var(--mute);text-align:center;padding:32px 10px;font-size:13px}
.empty .eic{width:54px;height:54px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--chip);animation:float 3s ease-in-out infinite}
.empty .eic svg{width:24px;height:24px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-h{font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 4px;letter-spacing:.02em;display:flex;gap:5px;align-items:center}
.art p{margin:2px 0 8px}
.kwl{display:flex;gap:4px;flex-wrap:wrap}
.mask{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 5px;font-weight:700;font-size:.92em;display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.mask .ico{width:12px;height:12px;vertical-align:0}
.pv{border:1.5px dashed color-mix(in srgb,var(--ai) 55%,transparent);border-radius:13px;padding:12px 14px;background:linear-gradient(135deg,var(--ai-soft),var(--panel));margin-top:4px}
.pv-h{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ai);font-size:13px;margin-bottom:8px}

.pvp{font-size:18px;margin:2px 0}
.pvp .badge{font-size:14px;padding:2px 12px}
.pvp.pop .badge{animation:popIn .45s}
.vflow{list-style:none;padding:0;margin:0 0 12px;position:relative}
.vflow::before{content:"";position:absolute;left:17px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--accent),var(--ai),var(--warn),var(--ai),var(--warn),var(--ok))}
.vflow::after{content:"";position:absolute;left:13px;top:16px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ai),0 0 12px var(--ai);animation:down 5.5s ease-in-out infinite}
.vflow li{display:flex;gap:10px;padding:5px 0;position:relative;z-index:1;font-size:13px;align-items:center}

.vflow .vi svg{width:17px;height:17px}
.feed{display:flex;flex-direction:column;gap:8px}
.feed-i{display:flex;gap:9px;align-items:center;font-size:12.5px}
.feed-i .t{font-weight:600}
.suggest{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);margin-bottom:10px}
.suggest .av{width:34px;height:34px;font-size:14px}
.md-h{color:var(--accent);font-weight:700}.md-f{color:var(--mute)}.md-k{color:var(--ai);font-weight:700}.md-b{color:var(--ok);font-weight:700}
.vfresh{animation:freshG 1.4s 4}
.effc{display:flex;align-items:center;gap:6px}
.hide-sm{display:inline}
/* ---------- PC info ---------- */
.pcsec{border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;margin:4px 0 12px;background:var(--panel2)}
.pcsec-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pic.sm{width:34px;height:34px;border-radius:10px}.pic.sm svg{width:18px;height:18px}
.pcitems{font-size:12px;color:var(--mute);margin:2px 0 10px}.pcitems summary{cursor:pointer;display:inline-flex;gap:5px;align-items:center}.pcitems ul{margin:6px 0 0;padding-left:18px;line-height:1.7}
.chk.need{animation:shake .5s;background:var(--bad-soft);color:var(--bad)}
.pccard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);margin-top:6px}
.msg .pccard{margin-top:8px}
.pcsrc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.pci{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:9px;padding:7px 9px;font-size:12px;min-width:0}
.pci>.ico{color:var(--accent);margin-top:2px}
.pci>div{min-width:0;flex:1}
.pci b{display:block;font-size:12.5px;word-break:break-word}
.pci .meter{margin-top:5px}
.pcline{font-size:12.5px;margin-bottom:6px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pcfl{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pcf{display:flex;gap:8px;padding:7px 10px;border-radius:9px;font-size:12.5px;align-items:flex-start}
.pcf>.ico{margin-top:2px}
.pcf.bad{background:var(--bad-soft);color:var(--bad)}.pcf.warn{background:var(--warn-soft);color:var(--warn)}.pcf.info{background:var(--accent-soft);color:var(--accent)}.pcf.ok{background:var(--ok-soft);color:var(--ok)}
.pcf .pd{color:var(--ink);opacity:.85}
.pfa{font-weight:700;margin-top:2px}
.pop .pcf,.anim-in .pcf,.pop .pci,.anim-in .pci,#main.anim .pci,#main.anim .pcf{animation:rise .4s both;animation-delay:calc(.15s + var(--i,0)*70ms)}
.pvpc{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px}
.kbcard.tips{border-left-color:var(--accent)}.kbcard.tips .kbt .ico{color:var(--accent)}
.tipl{list-style:none;padding:0;margin:6px 0 0}.tipl li{display:flex;gap:6px;align-items:flex-start;padding:3px 0;font-size:13px}

.pop .tipl li{animation:rise .4s both;animation-delay:calc(.3s + var(--i,0)*100ms)}
.btn.attn{animation:attnGlow 1.6s infinite}
@keyframes attnGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}60%{box-shadow:0 0 0 8px transparent}}
/* ---------- page entrance ---------- */
#main.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
#main.anim .pic{animation:popIn .55s cubic-bezier(.2,.9,.3,1.3) both}
#main.anim .li{animation:rise .45s both;animation-delay:calc(var(--i,0)*40ms)}
#main.anim tbody tr{animation:rise .45s both;animation-delay:calc(.15s + var(--i,0)*35ms)}
#main.anim-d .detail{animation:fadeR .4s cubic-bezier(.2,.8,.2,1) both}
.anim-in>*{animation:rise .4s both}
/* ---------- keyframes ---------- */
@keyframes grad{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ping{0%{transform:scale(.92);opacity:.65}100%{transform:scale(1.4);opacity:0}}
@keyframes pr{0%{box-shadow:0 0 0 0 var(--pc)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
@keyframes readyGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}60%{box-shadow:0 0 0 8px transparent}}
@keyframes p1g{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}60%{box-shadow:0 0 0 5px transparent}}
@keyframes blink{50%{opacity:.5}}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes nudge{0%,100%{right:-12px;opacity:.25}50%{right:-15px;opacity:.85}}
@keyframes travel{to{left:100%}}
@keyframes ringIn{from{stroke-dashoffset:282.74}}
@keyframes alarm{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}50%{transform:rotate(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.95)}}
@keyframes msgInR{from{opacity:0;transform:translateX(16px) scale(.95)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{15%,55%{transform:translateX(-6px)}35%,75%{transform:translateX(6px)}}
@keyframes look{0%,100%{transform:translateX(-2px) rotate(-8deg)}50%{transform:translateX(3px) rotate(8deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.9) translateY(10px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes tbar{from{width:100%}to{width:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fall{to{transform:translate(var(--x),106vh) rotate(var(--r))}}
@keyframes flashA{0%,35%{opacity:1}100%{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes popIn{0%{transform:scale(.35) rotate(-18deg);opacity:0}70%{transform:scale(1.12) rotate(3deg)}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadeR{from{opacity:0;transform:translateX(12px)}}
@keyframes down{0%{top:16px}100%{top:calc(100% - 26px)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(15deg)}}
@keyframes freshG{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 40%,transparent)}}
/* ---------- responsive ---------- */
@media (max-width:1100px){.pipe{grid-template-columns:repeat(4,minmax(0,1fr))}.stage::after{display:none}.rail{display:none}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 nav{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:2px}
 nav a{white-space:nowrap;margin:0;flex:none}nav a.on::before{display:none}nav .sep,nav .navnote{display:none}
 .g2,.g3,.g-main,.g-side,.cols2{grid-template-columns:1fr}
 .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
 main{padding:14px 16px 48px}.top{position:static}
 .barrow{grid-template-columns:120px 1fr 30px}
 .pv-grid{grid-template-columns:1fr}
}
@media (max-width:640px){.hide-sm{display:none}.brand small{display:none}}

.tryrow{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:7px 10px;background:var(--panel);transition:border-color .2s,transform .2s}

/* ===================== AI検索エンジン（オフライン・疑似AI） =====================
   文字バイグラムのコサイン類似度 ＋ キーワード一致加点 ＋ 有効率による補正。
   実運用では、この search() を Claude / OpenAI API 呼び出し（RAG）に置き換える想定。 */
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s、。，．,.!?！？「」『』（）()\[\]【】・:：;；\/\-_"'“”]/g,'')}
function grams(s){const t=norm(s),g=new Set();for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));if(t.length===1)g.add(t);return g}
function buildIndex(){
 INDEX=state.kb.filter(k=>k.status==='active').map(k=>({id:k.id,g:grams([k.title,k.title,k.symptom,k.keywords.join(' ')].join(' ')),kw:k.keywords.map(norm).filter(w=>w.length>=2)}));
 return INDEX.length;
}
function search(text,limit){
 if(!INDEX)buildIndex();
 const q=grams(text),nt=norm(text);
 return INDEX.map(e=>{
  let inter=0;q.forEach(x=>{if(e.g.has(x))inter++});
  let s=(q.size&&e.g.size)?inter/Math.sqrt(q.size*e.g.size):0;
  const hits=e.kw.filter(w=>nt.includes(w));
  s=s*0.9+Math.min(hits.length*0.12,0.45);
  const k=kbById(e.id);const r=effRate(k);
  if(k.use>=3&&r!=null)s+=(r-0.5)*0.08;
  return {id:e.id,score:Math.max(0,Math.min(s,0.96)),hits};
 }).filter(r=>r.score>0.05).sort((a,b)=>b.score-a.score).slice(0,limit||5);
}

}

function buildHandover(t){
 const L=[];
 L.push(`■ 概要：${t.subject}`);
 L.push(`■ 依頼者：${t.requester}（受付：${t.channel}）`);
 L.push(`■ 優先度：${t.priority}　SLA期限：${fmt(due(t))}`);
 L.push(`■ 引継ぎ理由：${t.handover?t.handover.reason:''}`);
 L.push('■ AI一次対応の経過：');
 const shown=t.aiLog.filter(m=>m.kind==='kb');
 if(shown.length)shown.forEach(m=>{const k=kbById(m.kbId);L.push(`　- ${m.kbId}「${k?k.title:''}」を提示（一致度 ${pct(m.score)}）`)});
 else L.push('　- 承認済みナレッジに該当なし');
 if(t.failedKb&&t.failedKb.length)L.push(`　- 利用者回答：${t.failedKb.join('、')} の手順では解決せず`);
 if(t.extra&&t.extra.length)t.extra.forEach(x=>L.push(`　- 追加情報：${x}`));
 if(t.pc){const r=t.pc.rec,b=t.pc.br;L.push('■ PC情報（相談者の同意あり）：');if(r)L.push(`　- ${r.asset}／${r.host}／${r.os}（${r.build}）／${r.net}・${r.ip}`);if(b)L.push(`　- ブラウザ実測：${b.os}／${b.browser}／${b.cores||'-'}コア`);(t.pcFind||[]).filter(f=>f.lvl!=='ok').forEach(f=>L.push(`　- [${LVL[f.lvl].l}${f.rel?'・症状に関連':''}] ${f.title}${f.action?'：'+f.action:''}`))}else L.push('■ PC情報：未取得');
 L.push(`■ 推定カテゴリ：${cat(t.cat).label}　推奨担当：${t.suggest}（${staff(t.suggest).role}）`);
 let act='提示済み手順の実施状況をヒアリングし、差分から切り分けを開始';
 if(t.sec)act='端末のネットワーク隔離を確認 → 認証情報の入力有無を確認 → 該当アカウントのパスワードリセット・セッション無効化を検討 → 同報範囲の調査';
 else if(!shown.length)act='新規事象のため、影響範囲（人数・拠点）と発生時刻の確認から切り分けを開始';
 const pr=(t.pcFind||[]).find(f=>f.rel&&(f.lvl==='bad'||f.lvl==='warn'));if(pr&&!t.sec)act=`PC診断「${pr.title}」を優先確認（${pr.action}） → `+act;
 L.push(`■ 推奨アクション：${act}`);
 return L.join('\n');
}
function createDraft(t){
 const names=personTokens(t.requester).concat(STAFF.map(s=>s.name));
 const body=t.body+((t.extra&&t.extra.length)?'\n'+t.extra.join('\n'):'');
 const m1=maskPII(body,names),m2=maskPII(t.subject,names),m3=maskPII(t.resolution.cause,names),m4=maskPII(t.resolution.steps.join('\n'),names);
 const subj=m2.text.replace(/[。．.]$/,'');

 const kwSrc=[m2.text,m1.text,m3.text,m4.text].join(' ');
 return {id,ticketId:t.id,title:subj+'ときの対処',cat:t.cat,symptom:m1.text.replace(/\s+/g,' ').slice(0,180),cause:m3.text,steps:m4.text.split('\n').map(s=>s.trim()).filter(Boolean),keywords:extractKw(kwSrc),target:'',failedKb:(t.failedKb||[]).slice(),applicant:t.resolution.by,createdAt:now(),status:'draft',masked:mergeFound([m1,m2,m3,m4]),reviews:[]};
}

  t.cat='security';

  const r=search(text,4);
  if(r[0]&&r[0].score>=TH_LOW&&t.cat==='other'){t.cat=kbById(r[0].id).cat;msgs.push({role:'ai',text:`内容からカテゴリを「${cat(t.cat).label}」と推定しました。`})}
  if(r[0]&&r[0].score>=TH_HIGH){
   msgs.push(kbMsg(t,r[0]));
   t.candidates=r.slice(1).filter(x=>x.score>=TH_LOW).map(x=>x.id);
  }else if(r[0]&&r[0].score>=TH_LOW){
   const c=r.filter(x=>x.score>=TH_LOW).slice(0,3);
   msgs.push({role:'ai',kind:'cands',text:'確度の高い回答は見つかりませんでしたが、近いナレッジ候補があります。症状に近いものを選んでください。',cands:c.map(x=>({id:x.id,score:x.score})),tips:pcTips(t)});
   t.candidates=[];
  }else{
   const pt=pcTips(t);msgs.push(pt.length?{role:'ai',kind:'tips',tips:pt,text:'承認済みナレッジに該当する事例はありませんでしたが、PC情報から原因の候補が見つかりました。この内容を添えて担当者へ引き継ぎます。'}:{role:'ai',text:'承認済みナレッジに該当する事例が見つかりませんでした。新しい事象の可能性があるため、担当者へ引き継ぎます。'});
   after=()=>escalate(t,'ナレッジ該当なし',true);
  }
 }
 play(t,msgs,after);
}
function play(t,msgs,after){
 busy.add(t.id);refreshFor(t);
 let i=0;
 const step=()=>{
  if(i<msgs.length){const m=Object.assign({},msgs[i],{t:now()});t.aiLog.push(m);i++;refreshFor(t);setTimeout(step,RM?120:850)}
  else{busy.delete(t.id);save();if(after)after();else render()}
 };
 setTimeout(step,RM?100:900);
}
function refreshFor(t){if(ui.view==='ai'&&ui.sel.ai===t.id)render();else renderNav()}

function escalate(t,reason,byAi){
 if(window.__OPS_ESCALATE__)window.__OPS_ESCALATE__(t,reason);
 t.status='escalated';t.escalatedAt=now();t.suggest=suggestAssignee(t);
 t.handover={reason,at:now()};t.handover.summary=buildHandover(t);
 t.aiLog.push({role:'ai',text:`担当者へ引き継ぎます。ここまでの経過はAIが要約して担当者に渡すので、同じ説明を繰り返す必要はありません。\n推奨担当：${t.suggest}（${staff(t.suggest).role}）　SLA期限：${fmt(due(t))}`,t:now()});
 t.aiLog.push({role:'sys',text:'人間の担当者へ引継ぎ（③ 引継ぎキュー）',t:now()});
 hist(t,'人間へ引継ぎ：'+reason,byAi?'AI':state.actor);
 audit('人間へ引継ぎ',t.id,reason);save();render();

function publish(d,approver,comment,checks){
 const T=now();let kb,action,from=null;
 if(d.target&&kbById(d.target)){
  kb=kbById(d.target);from=kb.version;action='改訂';
  const p=kb.version.split('.');const nv=p[0]+'.'+(Number(p[1]||0)+1);
  const oldCat=kb.cat;
  Object.assign(kb,{title:d.title,cat:d.cat,symptom:d.symptom,cause:d.cause,steps:d.steps.slice(),keywords:d.keywords.slice(),version:nv,updatedAt:T,approvedBy:approver,approvedAt:T,status:'active'});
  kb.history.push({ver:nv,at:T,by:approver,note:`${d.id}（${d.ticketId}）により改訂`});
  if(oldCat!==d.cat){state.skills[oldCat].minor++;state.skills[oldCat].updatedAt=T}
 }else{
  action='新規';
  kb={id:'KB-'+state.seq.kb++,cat:d.cat,title:d.title,symptom:d.symptom,cause:d.cause,steps:d.steps.slice(),keywords:d.keywords.slice(),version:'1.0',status:'active',author:d.applicant,approvedBy:approver,approvedAt:T,updatedAt:T,use:0,helpful:0,notHelpful:0,sources:[],history:[{ver:'1.0',at:T,by:approver,note:`${d.id}（${d.ticketId}）から新規作成`}]};
  state.kb.push(kb);
 }
 if(!kb.sources.includes(d.ticketId))kb.sources.push(d.ticketId);
 d.status='approved';d.kbId=kb.id;d.approvedAt=T;d.reviews.push({by:approver,at:T,result:'承認',comment,checks});
 const t=tk(d.ticketId);if(t){t.kbId=kb.id;hist(t,`ナレッジ ${kb.id} v${kb.version} として承認・反映`,approver)}
 const sk=state.skills[kb.cat];const sFrom='1.'+sk.minor;sk.minor++;sk.updatedAt=T;
 const n=buildIndex();
 const rec={t:T,kbId:kb.id,ver:kb.version,skill:sk.name,skillVer:'1.'+sk.minor,indexSize:n,by:approver,action};
 state.reflect.unshift(rec);
 audit('承認',d.id,`${kb.id} v${kb.version}（${action}）`);
 audit('DB保存・AI/Skills反映',kb.id,`${sk.name} v${sFrom}→v1.${sk.minor}／検索インデックス ${n}件`);
 save();
 return {kb,action,from,sFrom,sTo:'1.'+sk.minor,skill:sk.name,n};
}

const RSP=[['diag','状態を診断','activity'],['log','イベントログを確認','list'],['net','ネットワーク疎通を確認','wifi'],['app','アプリの版を確認','layers'],['fix','推奨の修復を実行','wrench'],['kb','ナレッジの手順を表示','book'],['re','再現確認','reset']];
const rsSeen={};let lastRs=null;
function rsIntent(x){
 const n=norm(x);
 const m=[['fix',['修復','更新して','適用して','直して','再登録','再発行','インストール']],['re',['再現','直った','治った','解消したか']],['log',['ログ','イベント']],['net',['ping','疎通','ネットワーク','回線','dns','速度']],['app',['バージョン','アプリの版','ドライバ']],['diag',['診断','状態','スキャン']],['kb',['ナレッジ','kb']]];
 for(const [k,ws] of m)if(ws.some(w=>n.includes(norm(w))))return k;
 return null;
}
function rsOpen(t){
 const fx=(t.rs&&t.rs.fixed)||[];
 const F=pcDiagnose(t.pc,t.subject+' '+t.body+' '+(t.extra||[]).join(' '),t.sec).filter(f=>f.lvl!=='ok'&&!fx.includes(f.title));
 return F.length?F:[{lvl:'ok',title:'PC側に未対処の指摘はありません',detail:'',action:'',kw:[],rel:false}];
}
function evLine(f,r){
 const x=f.title;
 if(/FortiClient/.test(x))return `[Error] FortiSslvpn: negotiation failed (client ${r.forti}, required ${STD.forti})`;
 if(/MFA/.test(x))return `[Warning] AAD: MFA challenge sent to old device (${r.mfa.device})`;
 if(/ディスク/.test(x))return `[Warning] Ntfs: disk C: free space low (${r.diskFree}GB)`;
 if(/DirectCloud/.test(x))return `[Error] DirectCloudDrive ${r.dc}: sync worker stopped (unsupported client)`;
 if(/GPU/.test(x))return `[Warning] nvlddmkm: display driver ${r.gpuDrv} stopped responding and recovered`;
 if(/証明書/.test(x))return '[Error] HENNGE DeviceCert: certificate expired or expiring';
 if(/メールボックス/.test(x))return `[Warning] Outlook: mailbox quota ${r.mbox}%`;
 if(/更新プログラム/.test(x))return `[Info] WindowsUpdate: ${r.patchAgo} days since last successful install`;
 if(/ウイルス/.test(x))return `[Error] Defender: signature out of date (${r.avDefAgo}d)`;
 if(/再起動/.test(x))return `[Info] Kernel-General: uptime ${r.bootAgo} days`;
 if(/ネットワークに接続中/.test(x))return `[Warning] NetworkProfile: still connected (${r.ip})`;
 return '[Info] '+x;
}
function termHtml(lines){
 return `<pre class="term">${lines.map(l=>esc(l).replace(/^&gt; .*/,m=>`<span class="tc">${m}</span>`).replace(/\[Error\]|✗|応答なし/g,m=>`<span class="te">${m}</span>`).replace(/\[Warning\]/g,m=>`<span class="tw">${m}</span>`).replace(/完了|OK|✓/g,m=>`<span class="tk">${m}</span>`)).join('\n')}</pre>`;
}
function rsExec(t,text,intent){
 const r=t.pc.rec,rs=t.rs,open=rsOpen(t).filter(f=>f.lvl!=='ok');const all=norm(t.subject+t.body);
 const k=intent||rsIntent(text);const M=[];
 if(k==='diag')M.push({role:'ai',kind:'pc',text:open.length?`診断しました。未対処の指摘が ${open.length}件あります。`:'診断しました。PC側に未対処の指摘はありません。'});
 else if(k==='log'){

 if(!d.title||d.title.length<8)add('warn','タイトルが短すぎます','症状が分かるタイトルにしてください。');
 if(!d.cause||d.cause.length<10)add('warn','原因の記述が不足しています','何が原因だったかを事実で書いてください。');
 const sh=d.steps.filter(x=>x.length<8);if(sh.length)add('warn',`短すぎる手順が ${sh.length}件あります`,sh.join('／'));
 const sc=txt.match(/[^。\n]*(のみ対象|未確認|に限る|限定)[^。\n]*/);if(sc)add('warn','適用範囲が限定・未確認の記述があります','「'+sc[0].trim()+'」— 全拠点で使える表現にするか、適用範囲を明記してください。');
 if(/ミス|不注意|怠っ|怠慢|勝手に/.test(txt))add('warn','個人を評価・非難する表現の可能性があります','事実と手順のみで記述してください。');
 if(d.keywords.length<3)add('warn','キーワードが少ない','3個以上あるとAI検索で見つかりやすくなります。','kw');
 const sim=search(d.title+' '+d.symptom,3).filter(x=>x.id!==d.target&&x.score>=TH_HIGH)[0];
 if(sim&&!d.target)add('info',`既存の ${sim.id} と内容が近い（一致度 ${pct(sim.score)}）`,'新規ではなく「改訂」にする方が適切かもしれません。');
 if(!R.length)add('ok','問題は見つかりませんでした','このまま承認申請できます。');
 const score=Math.max(0,100-R.reduce((a,r)=>a+({bad:30,warn:12,info:4,ok:0}[r.lvl]),0));
 return {at:now(),items:R,score};
}

 const lv=rsLive().length;

 return R;
}

 const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);
 s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
 if(getComputedStyle(b).position==='static')b.style.position='relative';b.style.overflow='hidden';
 b.appendChild(s);setTimeout(()=>s.remove(),650);
});
