<html lang="ja">

<title>みらいAI窓口 × ヘルプデスク ステップ受付 V3.1</title>
<!--
 ステップ受付・統合UI V3.1（完全オフライン・単一HTML）
 V3.1：AIの一次対応の前に、PC基本情報を読み取りだけで事前取得する仕組みを追加。
 1件の相談を STEP 1〜7（はじめに→困りごと→AIの一次対応→引継ぎ→担当者の対応→ナレッジ化→完了）で最後まで進める。
 見た目は「みらいSF 受付ステーション」に合わせた。詳しい画面と台帳は「業務ツール」に収録。
 元にしたサンプル：AIヘルプデスク 外部AI連携版 V1.1 ／ みらいAI窓口 Open WebUI × Cowork型 V3.1
 データはこのブラウザ（localStorage）にのみ保存。AIの答えは模擬。外部とは通信しない（CSPで遮断）。
-->
<style>
/* ===== 統合UI V3（受付ステーション風・ステップ形式） ===== */
:root{
 --u-bg:#f4f3ee;--u-surface:#ffffff;--u-surface2:#efede6;--u-ink:#1b222b;--u-muted:#5f6874;--u-line:#e1ddd2;
 --u-navy:#16314f;--u-navy2:#0f2440;--u-safety:#f5b800;--u-safety-soft:#fff5d3;--u-accent:#ee7d1c;
 --u-teal:#0f9d9a;--u-teal-soft:#dcf3f1;--u-acc:#16314f;--u-accsoft:#e4ebf4;
 --u-g:#1f9d55;--u-g-soft:#e1f4e8;--u-y:#e0a800;--u-y-soft:#fdf2d2;--u-r:#c9302c;--u-r-soft:#fbe2e1;
 --u-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 28px rgba(20,30,40,.08);--u-radius:16px;
 --u-font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--u-bg:#10141a;--u-surface:#18202a;--u-surface2:#212a35;--u-ink:#e7ecf1;--u-muted:#9fabb8;--u-line:#2c3846;--u-safety-soft:#35290b;--u-teal-soft:#0f2f2d;--u-g-soft:#11301f;--u-y-soft:#352a0b;--u-r-soft:#3a1616;--u-acc:#8ab4e6;--u-accsoft:#1d2b3d;--u-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--u-bg:#10141a;--u-surface:#18202a;--u-surface2:#212a35;--u-ink:#e7ecf1;--u-muted:#9fabb8;--u-line:#2c3846;--u-safety-soft:#35290b;--u-teal-soft:#0f2f2d;--u-g-soft:#11301f;--u-y-soft:#352a0b;--u-r-soft:#3a1616;--u-acc:#8ab4e6;--u-accsoft:#1d2b3d;--u-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--u-bg)}
.ux-off{display:none!important}
#ux{display:grid;grid-template-columns:84px minmax(0,1fr);height:100vh;height:100dvh;background:var(--u-bg);color:var(--u-ink);font-family:var(--u-font);font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
#ux .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
/* レール */
#uxRail{background:linear-gradient(180deg,var(--u-navy),var(--u-navy2));color:#cfdbe8;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:40;overflow-y:auto;scrollbar-width:none}
#uxRail .logo{width:46px;height:46px;border-radius:14px;background:var(--u-safety);color:#1b222b;display:grid;place-items:center;margin-bottom:10px;box-shadow:0 0 0 4px rgba(245,184,0,.2);flex:none}
#uxRail .logo .ico{width:26px;height:26px}
#uxRail button{width:68px;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;cursor:pointer;font:inherit;font-size:11px;line-height:1.3;position:relative;flex:none}
#uxRail button .ico{width:22px;height:22px}
#uxRail button:hover{background:rgba(255,255,255,.08)}
#uxRail button.on{background:rgba(245,184,0,.16);color:#fff}
#uxRail button.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--u-safety)}
#uxRail .rb{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--u-accent);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
#uxRail .sp{flex:1}
/* 上部 */
.ux-main{display:flex;flex-direction:column;min-width:0;min-height:0}
#uxTop{display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--u-line);background:color-mix(in srgb,var(--u-surface) 90%,transparent);flex:none;flex-wrap:nowrap;min-width:0}
#uxTop h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1560px){#uxTop h1 small{display:none}}@media(max-width:1280px){#uxStgP{display:none!important}}
#uxTop h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#uxTop h1 .ico{color:var(--u-accent)}
#uxTop h1 small{font-size:12px;color:var(--u-muted);font-weight:500}
#uxTop .sp{flex:1}
.u-off{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--u-g-soft);color:var(--u-g);font-weight:700;white-space:nowrap}
.u-off i{width:8px;height:8px;border-radius:50%;background:var(--u-g);animation:u-beat 1.8s infinite}
@keyframes u-beat{50%{opacity:.3}}
.u-who{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.u-who select{border:1px solid var(--u-line);border-radius:10px;padding:5px 10px;background:var(--u-surface);color:var(--u-ink);font:inherit;max-width:270px}
.u-role{font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--u-accsoft);color:var(--u-acc);white-space:nowrap}
.u-pill{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1px solid var(--u-line);background:var(--u-surface2);color:var(--u-muted);cursor:pointer;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;font:inherit;font-size:11.5px}
.u-pill.ng{background:var(--u-r-soft);color:var(--u-r);border-color:transparent}
.u-estop{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--u-r);color:var(--u-r);background:var(--u-surface);border-radius:10px;padding:4px 10px;font:inherit;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.u-estop.on{background:var(--u-r);color:#fff}
#uxBanner{flex:none;padding:7px 24px;background:var(--u-r);color:#fff;font-weight:700;font-size:13px}
#uxCrumb{flex:none;display:flex;align-items:center;gap:10px;padding:8px 24px;border-bottom:1px solid var(--u-line);background:var(--u-surface2);font-size:13px}
#uxCrumb b{font-size:14px}
.ux-content{flex:1;min-height:0;display:flex}
#uxPage{flex:1;min-width:0;overflow:auto}
#cw{flex:1;min-width:0;min-height:0;display:flex}
#hd{flex:1;min-width:0;min-height:0;overflow:auto}
#cwPortal,#hdPortal{position:fixed;left:0;top:0;width:0;height:0;overflow:visible;z-index:90}
/* ページ部品 */
#uxPage .u-page{padding:22px 24px 60px;max-width:1280px;width:100%;margin:0 auto;animation:u-vin .35s ease}
@keyframes u-vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#uxPage .u-card{background:var(--u-surface);border:1px solid var(--u-line);border-radius:var(--u-radius);box-shadow:var(--u-shadow);min-width:0}
#uxPage .u-pad{padding:18px}
#uxPage .u-h2{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px}
#uxPage .u-h2 .ico{color:var(--u-accent)}
#uxPage .u-muted{color:var(--u-muted)}
#uxPage .u-small{font-size:12.5px}
#uxPage .u-mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--u-muted)}
#uxPage .u-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;border:1px solid var(--u-line);background:var(--u-surface);color:var(--u-ink);cursor:pointer;white-space:nowrap;font:inherit;transition:transform .15s,background .2s}
#uxPage .u-btn:hover{background:var(--u-surface2)}
#uxPage .u-btn:active{transform:scale(.97)}
#uxPage .u-btn.pri{background:var(--u-navy);color:#fff;border-color:var(--u-navy)}
#uxPage .u-btn.pri:hover{background:#1f416a}
#uxPage .u-btn.go{background:var(--u-safety);color:#1b222b;border-color:var(--u-safety);font-weight:700}
#uxPage .u-btn.ok{background:var(--u-g);border-color:var(--u-g);color:#fff;font-weight:700}
#uxPage .u-btn.dng{color:var(--u-r)}
#uxPage .u-btn.sm{padding:5px 10px;font-size:12.5px;border-radius:10px}
#uxPage .u-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
#uxPage .u-sig{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
#uxPage .u-sig i{width:10px;height:10px;border-radius:50%}
#uxPage .u-sig.g{background:var(--u-g-soft);color:var(--u-g)}#uxPage .u-sig.g i{background:var(--u-g)}
#uxPage .u-sig.y{background:var(--u-y-soft);color:#946f00}#uxPage .u-sig.y i{background:var(--u-y)}
#uxPage .u-sig.r{background:var(--u-r-soft);color:var(--u-r)}#uxPage .u-sig.r i{background:var(--u-r)}
#uxPage .u-st{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:8px;background:var(--u-surface2);white-space:nowrap}
#uxPage .u-st.a{background:var(--u-accsoft);color:var(--u-acc)}#uxPage .u-st.w{background:var(--u-y-soft);color:#8a6500}#uxPage .u-st.t{background:var(--u-teal-soft);color:#0d7d7a}#uxPage .u-st.d{background:var(--u-g-soft);color:var(--u-g)}#uxPage .u-st.r{background:var(--u-r-soft);color:var(--u-r)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #uxPage .u-sig.y,:root:not([data-theme="light"]) #uxPage .u-st.w{color:#f3c64b}:root:not([data-theme="light"]) #uxPage .u-st.t{color:#5fd3cf}}
:root[data-theme="dark"] #uxPage .u-sig.y,:root[data-theme="dark"] #uxPage .u-st.w{color:#f3c64b}
#uxPage .u-in{width:100%;border:1.5px solid var(--u-line);border-radius:12px;padding:9px 12px;background:var(--u-surface);color:var(--u-ink);font:inherit;transition:border-color .2s}
#uxPage .u-in:focus{outline:none;border-color:var(--u-teal);box-shadow:0 0 0 3px var(--u-teal-soft)}
#uxPage textarea.u-in{min-height:110px;resize:vertical}
#uxPage label.u-fl{display:block;font-weight:700;font-size:13.5px;margin:14px 0 6px}
#uxPage label.u-fl .req{font-size:11px;color:#fff;background:var(--u-r);border-radius:6px;padding:0 6px;margin-left:6px}
#uxPage .u-hint{font-size:12.5px;color:var(--u-muted);margin-top:4px}
#uxPage .u-note{border-radius:12px;padding:10px 14px;font-size:13px;margin:10px 0;background:var(--u-surface2)}
#uxPage .u-note.y{background:var(--u-y-soft)}#uxPage .u-note.r{background:var(--u-r-soft);color:var(--u-r)}#uxPage .u-note.g{background:var(--u-g-soft)}#uxPage .u-note.t{background:var(--u-teal-soft)}
/* ホーム */
#uxPage .u-hello{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
#uxPage .u-hero{position:relative;overflow:hidden;padding:24px;border-radius:var(--u-radius);color:#fff;background:linear-gradient(135deg,var(--u-navy) 0%,#1f4a76 100%);box-shadow:var(--u-shadow)}
#uxPage .u-hero::after{content:"";position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;border-radius:50%;border:26px dashed rgba(245,184,0,.25);animation:u-spin 30s linear infinite}
@keyframes u-spin{to{transform:rotate(360deg)}}
#uxPage .u-hero h2{margin:0 0 6px;font-size:22px}
#uxPage .u-hero p{margin:0 0 16px;color:#c9d8e8;max-width:540px}
#uxPage .u-hero .u-btn{position:relative;z-index:1}
#uxPage .u-hero .u-btn.go{font-size:15px;padding:11px 20px}
#uxPage .u-hero .u-btn.go .ico{animation:u-nudge 1.6s ease-in-out infinite}
@keyframes u-nudge{50%{transform:translateX(4px)}}
#uxPage .u-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
#uxPage .u-kpi{padding:14px 16px;cursor:pointer;transition:transform .2s}
#uxPage .u-kpi:hover{transform:translateY(-2px)}
#uxPage .u-kpi .n{font-size:28px;font-weight:900;line-height:1.1}
#uxPage .u-kpi .n small{font-size:12px;color:var(--u-muted);margin-left:2px;font-weight:700}
#uxPage .u-kpi .t{font-size:12.5px;color:var(--u-muted);display:flex;align-items:center;gap:6px}
#uxPage .u-kpi .t .ico{width:15px;height:15px;color:var(--u-accent)}
#uxPage .u-ratio{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--u-surface2)}
#uxPage .u-ratio i{height:100%}
#uxPage .u-ratio .g{background:var(--u-g)}#uxPage .u-ratio .y{background:var(--u-y)}#uxPage .u-ratio .r{background:var(--u-r)}
#uxPage .u-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
#uxPage .u-feed{list-style:none;margin:0;padding:0}
#uxPage .u-feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--u-line);font-size:13.5px}
#uxPage .u-feed li:last-child{border-bottom:0}
#uxPage .u-feed .av{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--u-surface2);color:var(--u-accent);font-weight:800;font-size:12px}
#uxPage .u-feed small{color:var(--u-muted);display:block}
#uxPage .u-mini{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--u-line);margin-bottom:8px;cursor:pointer;transition:transform .2s,border-color .2s;background:var(--u-surface)}
#uxPage .u-mini:hover{transform:translateX(4px);border-color:var(--u-teal)}
#uxPage .u-mini b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#uxPage .u-empty{color:var(--u-muted);text-align:center;padding:26px 10px;font-size:13px}
/* ステップ（ウィザード） */
#uxPage .w-steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
#uxPage .w-stp{border:0;background:none;cursor:pointer;text-align:center;padding:0;color:var(--u-muted);font:inherit;font-size:12px;line-height:1.5}
#uxPage .w-stp:disabled{cursor:default;opacity:.55}
#uxPage .w-stp .bar{height:6px;border-radius:3px;background:var(--u-line);margin-bottom:6px;overflow:hidden}
#uxPage .w-stp .bar i{display:block;height:100%;width:0;background:var(--u-teal);transition:width .4s}
#uxPage .w-stp.done .bar i,#uxPage .w-stp.on .bar i{width:100%}
#uxPage .w-stp.skip .bar i{width:100%;background:repeating-linear-gradient(45deg,var(--u-line),var(--u-line) 4px,var(--u-surface2) 4px,var(--u-surface2) 8px)}
#uxPage .w-stp.on{color:var(--u-ink);font-weight:800}
#uxPage .w-stp.on .bar i{background:var(--u-safety)}
#uxPage .w-stp b{display:block;font-size:11px;letter-spacing:.06em}
#uxPage .w-stp.done b::after{content:" ✓";color:var(--u-teal)}
#uxPage .w-wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
#uxPage .w-pane{padding:22px 24px;min-height:440px}

#uxPage .w-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--u-line);flex-wrap:wrap}
#uxPage .w-nav .r{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

#uxPage .w-choice{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--u-line);background:var(--u-surface);color:var(--u-ink);cursor:pointer;font:inherit;transition:all .2s}

#uxPage .w-chips{display:flex;flex-wrap:wrap;gap:8px}
#uxPage .w-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--u-line);background:var(--u-surface);color:var(--u-ink);cursor:pointer;font:inherit;font-size:13.5px;transition:all .15s}
#uxPage .w-chip:hover{border-color:var(--u-teal)}

#uxPage .w-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* ===================== AI検索エンジン（オフライン・疑似AI） =====================
   文字バイグラムのコサイン類似度 ＋ キーワード一致加点 ＋ 役に立った率による補正。
   実運用では、この search() を Claude / OpenAI API 呼び出し（RAG）に置き換える想定。 */
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s、。，．,.!?！？「」『』（）()\[\]【】・:：;；\/\-_"'“”]/g,'')}
function grams(s){const t=norm(s),g=new Set();for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));if(t.length===1)g.add(t);return g}
function buildIndex(){
 INDEX=state.kb.filter(k=>k.status==='active').map(k=>({id:k.id,g:grams([k.title,k.title,k.symptom,k.keywords.join(' ')].join(' ')),kw:k.keywords.map(norm).filter(w=>w.length>=2)}));
 return INDEX.length;
}
function search(text,limit){
 if(!INDEX)buildIndex();
 const q=grams(text),nt=norm(text);
 return INDEX.map(e=>{
  let inter=0;q.forEach(x=>{if(e.g.has(x))inter++});
  let s=(q.size&&e.g.size)?inter/Math.sqrt(q.size*e.g.size):0;
  const hits=e.kw.filter(w=>nt.includes(w));
  s=s*0.9+Math.min(hits.length*0.12,0.45);
  const k=kbById(e.id);const r=effRate(k);
  if(k.use>=3&&r!=null)s+=(r-0.5)*0.08;
  return {id:e.id,score:Math.max(0,Math.min(s,0.96)),hits};
 }).filter(r=>r.score>0.05).sort((a,b)=>b.score-a.score).slice(0,limit||5);
}
function secCheck(text){

 return SEC_CRIT.some(w=>text.includes(w))?'critical':'suspect';
}
function calcPriority(u,i,sec){
 if(sec==='critical')return 'P1';
 const s=({高:3,中:2,低:1}[u]||2)+({個人:1,部署:2,全社:3}[i]||1);
 let p=s>=6?'P1':s===5?'P2':s===4?'P3':'P4';
 if(sec&&p>'P2')p='P2';
 return p;
}

  let got=RK[r.kind]||r.kind;if(r.kind==='answer')got=r.out.kbId+' で回答';else if(r.kind==='cands')got='候補 '+r.out.cands.map(c=>c.id).join('・');
  const e=q.expect;let ok;
  if(e==='excluded')ok=r.kind==='excluded';else if(e==='handoff')ok=r.kind==='nogrounds';else if(e==='stopped')ok=r.kind==='stopped';
  else ok=(r.kind==='answer'&&r.out.kbId===e)||(r.kind==='cands'&&r.out.citations.includes(e));
  const leak=r.checks.some(c=>c.n==='機密情報が入っていない'&&!c.ok);
  return {id:q.id,q:q.q,expect:e,got,kind:r.kind,ok,leak,ng:r.checks.filter(c=>!c.ok).map(c=>c.n),cost:r.cost};
 });

 state.testRuns.unshift(tr);if(state.testRuns.length>40)state.testRuns.length=40;
 return tr;
}

function buildHandover(t){
 const L=[];
 L.push(`■ 概要：${t.subject}`);
 L.push(`■ 依頼者：${t.requester}（受付：${t.channel}）`);
 L.push(`■ 優先度：${t.priority}　対応期限：${fmt(due(t))}`);
 L.push(`■ 引継ぎ理由：${t.handover?t.handover.reason:''}`);
 if(t.coworkTicket){L.push(`■ 連携元：AI相談 ${t.coworkTicket}（本人が共有に同意した情報のみ）`);Object.keys(t.coworkShared||{}).forEach(k=>{const v=t.coworkShared[k];if(Array.isArray(v)){L.push(`　- ${k}：`);v.forEach(x=>L.push(`　　・${x}`))}else L.push(`　- ${k}：${v}`)})}
 L.push('■ AI一次対応の経過：');
 const shown=t.aiLog.filter(m=>m.kind==='kb');
 if(shown.length)shown.forEach(m=>{const k=kbById(m.kbId);L.push(`　- ${m.kbId}「${k?k.title:''}」を提示（近さ ${pct(m.score)}）`)});
 else if(t.coworkTicket)L.push('　- AI相談で一次対応（診断・資料案内）済み。解決しなかったため本人同意のうえ引継ぎ');
 else L.push('　- 承認済みナレッジに該当なし');
 if(t.failedKb&&t.failedKb.length)L.push(`　- 利用者回答：${t.failedKb.join('、')} の手順では解決せず`);
 if(t.extra&&t.extra.length)t.extra.forEach(x=>L.push(`　- 追加情報：${x}`));
 const lr=t.lastRun&&state.relayLog?runById(t.lastRun):null;
 if(lr)L.push(`■ 運び役の処理：${lr.id} ${RK[lr.kind]||lr.kind}${lr.reason?'（'+lr.reason+'）':''}`);
 if(t.aiDraft)L.push(`■ AIの回答案：あり（根拠 ${t.aiDraft.kbId}・運び役 ${t.aiDraft.run}）→ 下の「AIの回答案」を確認して評価`);
 L.push(`■ 推定分野：${cat(t.cat).label}　おすすめの担当：${t.suggest}（${staff(t.suggest).role}）`);
 const cis=cisOf(t.id).map(ciById).filter(Boolean);
 if(cis.length)L.push(`■ 対象の機器・サービス：${cis.map(c=>`${c.id} ${c.name}（管理：${c.owner}）`).join('、')}`);
 const simOpen=similarTickets(t,0.3).filter(r=>{const x=tk(r.id);return x&&isOpen(x)&&!childrenOf(t.id).includes(r.id)&&parentOf(t.id)!==r.id}).slice(0,2);
 if(simOpen.length)L.push(`■ 似ている未解決の問い合わせ：${simOpen.map(r=>`${r.id}（類似度 ${pct(r.score)}）`).join('、')} → 同一障害の可能性。親子の関連付けを検討`);
 if(parentOf(t.id))L.push(`■ 親の問い合わせ：${parentOf(t.id)}（親の対応状況を確認）`);
 let act='提示済み手順の実施状況をヒアリングし、差分から切り分けを開始';
 if(t.sec)act='端末のネットワーク隔離を確認 → 認証情報の入力有無を確認 → 該当アカウントのパスワードリセット・セッション無効化を検討 → 同報範囲の調査';
 else if(!shown.length)act='新規事象のため、影響範囲（人数・拠点）と発生時刻の確認から切り分けを開始';
 if(t.coworkTicket&&!t.sec)act='AI相談の診断結果を確認し、利用者へ連絡して切り分けを継続（端末の設定変更が必要なら、承認キューの承認付き修復を使う）';
 L.push(`■ 推奨アクション：${act}`);
 return L.join('\n');
}

function afterRelay(t,r,msgs){

 audit('運び役で処理',t.id,`${r.id}：${RK[r.kind]}${r.reason?'／'+r.reason:''}`);

 if(r.kind==='excluded'&&t.sec){
  t.cat='security';
  say('セキュリティ事象の可能性を検知しました。AI対象外のため、AIには送りません。決まった初動手順を案内し、セキュリティ担当へすぐに引き継ぎます。');
  msgs.push({role:'ai',who:RELAY_WHO,kind:'steps',title:'今すぐ行ってください（初動対応）',steps:SEC_STEPS});
  after=()=>escalate(t,t.sec==='critical'?'セキュリティ事象を検知（被害の可能性あり・AI対象外）':'セキュリティ事象の疑いを検知（AI対象外）',true);
 }else if(['excluded','stopped','nogrounds','budget','fail','checkfail'].includes(r.kind)){

  after=()=>escalate(t,r.reason,true);
 }else if(R.stage==='3a'){
  if(t.cat==='other')t.cat=kbById(r.out.kbId).cat;
  t.aiDraft={run:r.id,kind:r.kind,text:r.out.text,kbId:r.out.kbId,cites:r.out.citations.slice(),userSteps:r.out.userSteps.slice(),staffSteps:r.out.staffSteps.slice(),at:now(),useful:null};
  say('受け付けました。AIが作った回答案を担当者が確認してから連絡します（確認モード）。');
  after=()=>escalate(t,'確認モード：AIの回答案を担当者が確認',true);
 }else if(r.kind==='answer'){
  if(t.cat==='other'){t.cat=kbById(r.out.kbId).cat;say(`内容から分野を「${cat(t.cat).label}」と推定しました。`)}
  const m=kbMsg(t,{id:r.out.kbId,score:r.out.score,hits:r.out.hits});m.text='';m.aiText=r.out.text;m.run=r.id;msgs.push(m);
  t.candidates=r.evidence.slice(1).map(x=>x.id);
  relatedKbs(r.out.kbId).forEach(k=>{const kk=kbById(k);if(kk&&kk.status==='active'&&!t.candidates.includes(k))t.candidates.push(k)});

function play(t,msgs,after){
 busy.add(t.id);refreshFor(t);
 let i=0;
 const step=()=>{
  if(i<msgs.length){const m=Object.assign({},msgs[i],{t:now()});t.aiLog.push(m);i++;refreshFor(t);setTimeout(step,650)}
  else{busy.delete(t.id);save();if(after)after();else render()}
 };
 setTimeout(step,450);
}
function refreshFor(t){if(ui.view==='ai'&&ui.sel.ai===t.id)render();else renderNav()}

 t.status='escalated';t.escalatedAt=now();t.suggest=suggestAssignee(t);
 t.handover={reason,at:now()};t.handover.summary=buildHandover(t);
 t.aiLog.push({role:'ai',text:`担当者へ引き継ぎます。ここまでの経過はAIが要約して担当者に渡すので、同じ説明を繰り返す必要はありません。\nおすすめの担当：${t.suggest}（${staff(t.suggest).role}）　対応期限：${fmt(due(t))}`,t:now()});
 t.aiLog.push({role:'sys',text:'担当者へ引継ぎ（③ 引継ぎキュー）',t:now()});
 hist(t,'担当者へ引継ぎ：'+reason,byAi?'AI':state.actor);
 audit('担当者へ引継ぎ',t.id,reason);save();render();
 toast(`${t.id} を担当者へ引き継ぎました`);
}

function publish(d,approver,comment,checks){
 const T=now();let kb,action,from=null;
 if(d.target&&kbById(d.target)){
  kb=kbById(d.target);from=kb.version;action='改訂';
  const p=kb.version.split('.');const nv=p[0]+'.'+(Number(p[1]||0)+1);
  const oldCat=kb.cat;
  Object.assign(kb,{title:d.title,cat:d.cat,symptom:d.symptom,cause:d.cause,steps:d.steps.slice(),keywords:d.keywords.slice(),version:nv,updatedAt:T,approvedBy:approver,approvedAt:T,status:'active'});
  kb.history.push({ver:nv,at:T,by:approver,note:`${d.id}（${d.ticketId}）により改訂`});
  if(oldCat!==d.cat){state.skills[oldCat].minor++;state.skills[oldCat].updatedAt=T}
 }else{
  action='新規';
  kb={id:'KB-'+state.seq.kb++,cat:d.cat,title:d.title,symptom:d.symptom,cause:d.cause,steps:d.steps.slice(),keywords:d.keywords.slice(),version:'1.0',status:'active',author:d.applicant,approvedBy:approver,approvedAt:T,updatedAt:T,use:0,helpful:0,notHelpful:0,sources:[],history:[{ver:'1.0',at:T,by:approver,note:`${d.id}（${d.ticketId}）から新規作成`}]};
  state.kb.push(kb);
 }
 if(!kb.sources.includes(d.ticketId))kb.sources.push(d.ticketId);
 addLink(d.ticketId,kb.id,'kb_source',{auto:1,by:approver});
 cisOf(d.ticketId).forEach(c=>addLink(kb.id,c,'ci_kb',{auto:1,by:approver,note:'元の問い合わせから継承'}));
 d.status='approved';d.kbId=kb.id;d.approvedAt=T;d.reviews.push({by:approver,at:T,result:'承認',comment,checks});
 const t=tk(d.ticketId);if(t){t.kbId=kb.id;hist(t,`ナレッジ ${kb.id} v${kb.version} として承認・反映`,approver)}
 const sk=state.skills[kb.cat];const sFrom='1.'+sk.minor;sk.minor++;sk.updatedAt=T;
 const n=buildIndex();
 const rec={t:T,kbId:kb.id,ver:kb.version,skill:sk.name,skillVer:'1.'+sk.minor,indexSize:n,by:approver,action};
 state.reflect.unshift(rec);
 audit('承認',d.id,`${kb.id} v${kb.version}（${action}）`);
 audit('DB保存・本棚に反映',kb.id,`${sk.name} v${sFrom}→v1.${sk.minor}／本棚 ${n}件`);
 save();
 return {kb,action,from,sFrom,sTo:'1.'+sk.minor,skill:sk.name,n};
}

 const fail=d.failedKb&&d.failedKb.length?`<div class="note n-acc">AIが提示した ${d.failedKb.join('、')} では解決しなかった事例です。既存ナレッジの改訂にするか、新規にするかを判断してください。</div>`:'';

 }

}

V.prompt=function(){

 if(!ui.pv||!promptExact(ui.pv))ui.pv=(list.find(p=>p.status==='review'||p.status==='draft'||p.status==='returned')||promptByVer(R.promptVer)).ver;
 const p=promptExact(ui.pv);
 return `<h1>AIへの指示書</h1><p class="sub">AIに渡す「この会社のきまり」です。規程と同じように版を管理し、本番のAIでの試験に合格した版だけを承認者が承認します。どの版で答えたかは運び役の日記に残ります。</p>
 <div class="grid g-side"><div><div class="list">${list.map(x=>`<div class="li ${x.ver===p.ver?'on':''}" onclick="App.selPrompt('${x.ver}')"><div class="t">指示書 v${x.ver}</div><div class="m">${promptBadge(x)}<span>${esc(x.author)}・${fmt(x.at)}</span></div>${x.note?`<div class="m">${esc(x.note)}</div>`:''}</div>`).join('')}</div><button class="btn ghost sm" style="margin-top:8px" onclick="App.newPrompt()">＋ 新しい版を作る</button></div>

function promptPanel(p){
 const R=state.relay,f=promptFlags(p.text),cur=promptByVer(R.promptVer),cm=modelById(R.model),lt=lastTest(R.model,p.ver);
 const edit=p.status==='draft'||p.status==='returned';
 const flags=`<div class="sec-h">この版に入っているきまり</div>${Object.keys(FLAG_LABEL).map(k=>`<div style="font-size:13px">${f[k]?'<span style="color:var(--ok);font-weight:700">✔</span>':'<span style="color:var(--bad);font-weight:700">✖</span>'} ${esc(FLAG_LABEL[k])}</div>`).join('')}`;
 const test=lt?`<div class="note ${lt.pass?'n-ok':'n-bad'}">本番のAI（${esc(cm.name)} ${cm.ver}）での試験 ${lt.id}：正答率 ${pct(lt.score)}・隠し漏れ ${lt.leak}件 → <b>${lt.pass?'合格':'不合格'}</b>　<a href="#" onclick="App.selTest('${lt.id}');return false">結果を見る</a></div>`:`<div class="note n-warn">本番のAI（${esc(cm.name)} ${cm.ver}）での試験はまだです。承認には合格が必要です。</div>`;
 const diff=p.ver!==cur.ver?`<div class="sec-h">本番の版（v${cur.ver}）との違い</div><pre class="box">${lineDiff(cur.text,p.text)}</pre>`:'';
 const last=(p.reviews||[]).slice(-1)[0];
 const ret=p.status==='returned'&&last?`<div class="note n-bad"><b>差戻し（${esc(last.by)}・${fmt(last.at)}）</b><br>${esc(last.comment)}</div>`:'';
 let body=edit?`<label class="f">本文<textarea id="pr_text" rows="18" class="mono" style="font-size:12px">${esc(p.text)}</textarea></label><label class="f">変更の理由<input id="pr_note" value="${esc(p.note||'')}"></label>
  <div class="btns"><button class="btn ghost" onclick="App.savePrompt('${p.ver}')">保存</button><button class="btn ai" onclick="App.testPrompt('${p.ver}')">この版で試験する</button><button class="btn" onclick="App.submitPrompt('${p.ver}')">承認申請</button></div>`:`<pre class="box">${esc(p.text)}</pre>`;
 let appr='';
 if(p.status==='review'){
  const a=state.actor,okRole=isApprover(a)&&a!==p.author,ok=okRole&&lt&&lt.pass;
  appr=`<h3>承認</h3>${!isApprover(a)?`<div class="note n-warn">操作者「${esc(a)}」には承認権限がありません。<div class="btns" style="margin-top:6px">${STAFF.filter(s=>s.approver&&s.name!==p.author).map(s=>`<button class="btn sm" onclick="App.setActor('${s.name}')">${s.name}に切り替える</button>`).join('')}</div></div>`:a===p.author?'<div class="note n-bad">作成者本人は承認できません。</div>':''}
  ${okRole&&!(lt&&lt.pass)?'<div class="note n-bad">本番のAIでの試験に合格していないため承認できません。差し戻してください。</div>':''}
  <label class="f">コメント（差戻し時は必須）<textarea id="pr_c" rows="2" ${okRole?'':'disabled'}></textarea></label>
  <div class="btns"><button class="btn ok" ${ok?'':'disabled'} onclick="App.approvePrompt('${p.ver}')">承認して本番の指示書にする</button><button class="btn bad" ${okRole?'':'disabled'} onclick="App.returnPrompt('${p.ver}')">差戻し</button><button class="btn ai sm" onclick="App.testPrompt('${p.ver}')">この版で試験する</button></div>`;
 }
 const hist=p.status==='approved'?`<div class="hint" style="margin-top:8px">作成 ${esc(p.author)}（${fmtFull(p.at)}）／承認 ${esc(p.approvedBy||'-')}（${fmtFull(p.approvedAt)}）</div>`:'';
 return `<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 class="mt0" style="margin-bottom:4px">指示書 v${p.ver}</h2><div class="btns">${promptBadge(p)}<span class="hint">作成 ${esc(p.author)}・${fmt(p.at)}</span></div></div></div>${ret}${flags}${test}${diff}${body}${appr}${hist}`;
}

/* ===================== 統合ブリッジ（みらいAI窓口 ⇄ AIヘルプデスク） =====================
   AI窓口で解決しなかった相談を、本人が同意した情報だけ INC として受け取り、
   解決結果と承認済みナレッジを AI窓口へ返すための窓口。外部とは通信しない。 */
const CW_CAT={'IT端末':'device','ID・アクセス権':'account','セキュリティ事故':'security','業務・規程':'other','AI窓口':'other'};
function intakeFromCowork(o){
 const text=o.subject+'\n'+o.body;
 let c=CW_CAT[o.category]||'other';
 let sec=secCheck(text);if(c==='security'&&!sec)sec='suspect';if(sec)c='security';
 if(!sec&&(c==='other'||c==='device')){const r=search(text,1)[0];if(r&&r.score>=TH_LOW)c=kbById(r.id).cat}
 const T=now(),urg=o.priority==='緊急'?'高':'中';
 const t={id:'INC-'+state.seq.inc++,createdAt:T,channel:'みらいAI窓口',requester:o.requester,cat:c,urgency:urg,impact:'個人',
  priority:o.priority==='緊急'?'P1':calcPriority(urg,'個人',sec),subject:o.subject,body:o.body,status:'escalated',sec:sec||null,
  aiLog:[],shown:[],candidates:[],extra:[],failedKb:[],history:[],escalatedAt:T,coworkTicket:o.tktId,coworkShared:o.shared||{}};
 t.aiLog.push({role:'sys',text:`みらいAI窓口（${o.tktId}）から連携されました（優先度 ${t.priority}）`,t:T});
 t.aiLog.push({role:'ai',who:'みらいAI窓口',text:'AI窓口で一次対応（診断・案内）を行いましたが解決しなかったため、本人が共有に同意した情報だけを担当者へ引き継ぎます。',t:T});
 t.history.push({t:T,actor:'みらいAI窓口',a:`受付（みらいAI窓口 ${o.tktId} から連携）`});
 state.tickets.unshift(t);
 detectCIs(text).forEach(x=>addLink(t.id,x,'ci_affects',{auto:1,by:'AI',note:'AI推定'}));
 t.suggest=o.assignee||suggestAssignee(t);if(o.assignee)t.assignee=o.assignee;
 t.handover={reason:'みらいAI窓口から引継ぎ（本人同意済みの範囲のみ）',at:T};
 t.handover.summary=buildHandover(t);
 t.history.push({t:T,actor:'AI',a:'担当者へ引継ぎ：'+t.handover.reason});
 state.audit.unshift({t:T,actor:'みらいAI窓口',action:'AI窓口から連携',target:t.id,detail:`${o.tktId}：${o.subject}`});
 save();renderNav();
 return t.id;
}

function auditAdd(st,actor,event,detail){const prev=st.audit.length?st.audit[st.audit.length-1].hash:'GENESIS';const e={seq:st.audit.length+1,ts:nowISO(),actor,event,detail:detail||{}};e.prev=prev;e.hash=sha256(prev+'|'+JSON.stringify([e.seq,e.ts,e.actor,e.event,e.detail]));st.audit.push(e);return e}
function verifyChain(list){let prev='GENESIS';for(const e of list){const h=sha256(prev+'|'+JSON.stringify([e.seq,e.ts,e.actor,e.event,e.detail]));if(e.prev!==prev||e.hash!==h)return {ok:false,at:e.seq};prev=e.hash}return {ok:true,n:list.length}}
function toks(q){return (q.match(/[\u30A0-\u30FFー]{2,}|[\u4E00-\u9FFF々]{2,}|[A-Za-z0-9]{2,}/g)||[]).map(x=>x.toLowerCase())}
function kbScore(k,q){const ql=q.toLowerCase();let s=0;k.tags.forEach(t=>{if(ql.includes(t.toLowerCase()))s+=3});toks(q).forEach(t=>{if(k.title.toLowerCase().includes(t))s+=2;else if(k.body.toLowerCase().includes(t))s+=1});return s}
function allDocs(st){return KB.concat(st.faqs,(typeof S!=='undefined'&&st===S&&window.HD)?HD.kb():[])}
function kbById(st,id){return allDocs(st).find(k=>k.id===id)}
function canSee(userId,doc){return DEPTS[USERS[userId].dept].scopes.includes(doc.scope)}
function kbSearch(st,userId,q){const scored=allDocs(st).map(k=>({k,s:kbScore(k,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);return {hits:scored.filter(x=>canSee(userId,x.k)).slice(0,3),hidden:scored.filter(x=>!canSee(userId,x.k)).length}}
function dataPolicy(cls,model){if(cls==='極秘')return {ok:false,msg:'「極秘」区分のファイルはAIで扱いません。所管部門の手続で処理してください。'};if(cls==='機密'&&model==='external')return {ok:false,msg:'「機密」区分は外部AIへ送信できません。社内ローカルモデルを選ぶか担当者へ相談してください。'};return {ok:true,msg:''}}
function suggestClass(name){if(/人事評価|給与|賞与|健康診断|マイナンバー|個人番号/.test(name))return '極秘';if(/契約|見積|原価|個人|名簿|顧客/.test(name))return '機密';return '社内限定'}
function dlpMask(t){const found=[];let s=t;
 s=s.replace(/(パスワード|password|PW|暗証番号)\s*(?:[:：=]|は)\s*([A-Za-z0-9!-\/:-@\[-`{-~]{4,})/gi,(m,a)=>{found.push('パスワード等');return a+'：＊＊＊＊（マスク）'});
 s=s.replace(/\b\d{4}[- ]?\d{4}[- ]?\d{4}[- ]?\d{4}\b/g,()=>{found.push('カード番号らしき数字');return '＊＊＊＊-＊＊＊＊-＊＊＊＊-＊＊＊＊'});
 s=s.replace(/\b\d{4}[- ]?\d{4}[- ]?\d{4}\b/g,()=>{found.push('個人番号らしき12桁');return '＊＊＊＊-＊＊＊＊-＊＊＊＊'});
 return {text:s,found:[...new Set(found)]}}
function propHash(p){return sha256(JSON.stringify([p.id,p.opId,p.deviceId,p.userId,p.params]))}
function createProposal(st,userId,opId,params,meta){
 const op=OPS[opId];if(!op)throw new Error('許可リストに存在しない操作：'+opId);
 if(op.level>=5){auditAdd(st,userId,'blocked_prohibited',{opId});return {blocked:true,opId}}
 const id='OP-'+pad(++st.counters.prop,4);
 const p={id,opId,userId,deviceId:USERS[userId].device,params:params||{},meta:meta||{},status:'proposed',created:nowISO(),userDecision:null,adminDecision:null,approvedHash:null,chatId:null};
 p.hash=propHash(p);st.proposals[id]=p;
 auditAdd(st,userId,'proposal_created',{prop:id,opId,level:op.level,hash:p.hash.slice(0,12)});
 return p}
function userDecision(st,id,dec){const p=st.proposals[id];if(!p||p.status!=='proposed')return p;
 if(dec==='Y'){const h=propHash(p);p.userDecision={by:p.userId,at:nowISO(),hash:h};p.approvedHash=h;p.status=OPS[p.opId].level>=4?'pending_admin':'ready';auditAdd(st,p.userId,'user_approved',{prop:id,hash:h.slice(0,12)});if(p.status==='pending_admin')auditAdd(st,'system','admin_approval_requested',{prop:id})}
 else{p.userDecision={by:p.userId,at:nowISO(),dec:'N'};p.status='rejected';auditAdd(st,p.userId,'user_rejected',{prop:id})}
 return p}
function adminDecision(st,id,adminId,dec,comment){const p=st.proposals[id];const a=USERS[adminId];
 if(!p||p.status!=='pending_admin')return {ok:false,msg:'承認待ちの申請ではありません'};
 if(!a||a.role!=='itadmin')return {ok:false,msg:'IT端末管理者のみ判断できます'};
 if(adminId===p.userId){auditAdd(st,adminId,'self_approval_denied',{prop:id});return {ok:false,msg:'自分の申請は承認できません（職務分離）。別のIT管理者が判断します。'}}
 if(propHash(p)!==p.approvedHash){p.status='invalidated';auditAdd(st,'system','hash_mismatch',{prop:id});return {ok:false,msg:'本人承認後に内容が変わったため、承認を取り直してください'}}
 if(dec==='approve'){p.adminDecision={by:adminId,at:nowISO(),comment:comment||'',hash:p.approvedHash};p.status='ready';auditAdd(st,adminId,'admin_approved',{prop:id,comment:comment||''})}
 else{p.adminDecision={by:adminId,at:nowISO(),dec:'reject',comment:comment||''};p.status='admin_rejected';auditAdd(st,adminId,'admin_rejected',{prop:id,comment:comment||''})}
 return {ok:true}}
function serverVerify(st,p){const op=OPS[p.opId];const c=[];
 c.push(['操作IDが許可リストに登録済み',!!op&&op.level<5]);
 c.push(['緊急停止が解除されている',!st.estop]);
 c.push(['本人承認（Y）が記録済み',!!(p.userDecision&&p.userDecision.hash)]);
 c.push(['承認時から操作内容が変わっていない',!!p.approvedHash&&p.approvedHash===propHash(p)]);
 c.push(['対象端末＝依頼者に割り当てられた端末',!!USERS[p.userId]&&USERS[p.userId].device===p.deviceId]);
 if(op&&op.level>=4)c.push(['IT管理者の承認済み（自己承認でない）',!!(p.adminDecision&&p.adminDecision.hash===p.approvedHash&&p.adminDecision.by!==p.userId)]);
 c.push(['申請の状態が実行可能',p.status==='ready'||p.status==='executing']);
 return {ok:c.every(x=>x[1]),checks:c}}
function applyOp(st,p){const v=serverVerify(st,p);
 if(!v.ok){auditAdd(st,'system','exec_denied',{prop:p.id,failed:v.checks.filter(c=>!c[1]).map(c=>c[0])});return {ok:false,msg:'サーバ側の実行前検証で不合格のため、実行しませんでした。端末は変更していません。',checks:v.checks}}
 const op=OPS[p.opId],d=st.devices[p.deviceId];
 if(st.failNext){st.failNext=false;p.status='failed';auditAdd(st,'agent','exec_failed',{prop:p.id,reason:'模擬障害'});return {ok:false,msg:'PCエージェントが想定外の応答を返したため中断しました（模擬障害）。端末には変更を加えていません。',checks:v.checks}}
 if(op.key)p.snapshot=clone(d[op.key]);
 let verify=[],file=null;
 switch(p.opId){
  case 'PRINT_JOB_CANCEL_OWN':d.printer.jobs=d.printer.jobs.filter(j=>!(j.owner===p.userId&&j.status==='エラー'));verify=[['本人のエラージョブ',d.printer.jobs.some(j=>j.owner===p.userId&&j.status==='エラー')?'残存':'0件'],['他の利用者のジョブ','変更なし（'+d.printer.jobs.filter(j=>j.owner!==p.userId).length+'件保持）']];break;
  case 'SPOOLER_RESTART':d.printer.spooler='running';verify=[['スプーラサービス','実行中'],['待機中のジョブ',d.printer.jobs.length+'件（保持）']];break;
  case 'AUDIO_DEVICE_SET':d.audio.default=p.params.device;verify=[['既定の出力デバイス',d.audio.default],['テスト音','選択したデバイスで再生（模擬）']];break;
  case 'TEMP_CLEAN_USER':{const mv=Math.max(0,+(d.disk.tempGB-0.2).toFixed(1));d.disk.quarantineGB=+(d.disk.quarantineGB+mv).toFixed(1);d.disk.freeGB=+(d.disk.freeGB+mv).toFixed(1);d.disk.tempGB=0.2;verify=[['隔離した容量',mv+' GB（7日保持）'],['空き容量',d.disk.freeGB+' GB'],['ドキュメント・共有フォルダ','変更なし']];break}
  case 'VPN_ADAPTER_ENABLE':d.vpn.adapter='enabled';d.vpn.connected=true;verify=[['VPN仮想アダプタ','有効'],['接続テスト','社内ポータルへ到達（模擬）']];break;
  case 'FILE_RENAME_BATCH':d.files.renamedCopy=true;verify=[['作成したコピー',p.params.count+'件 → '+p.params.dest],['元の写真','変更なし']];break;
  case 'FILE_CREATE':file={name:p.params.filename,content:p.params.content};verify=[['新規ファイル',p.params.filename],['元の添付ファイル','変更なし']];break;
  case 'REBOOT':d.rebootedAt=nowISO();d.rebootCount=(d.rebootCount||0)+1;verify=[['再起動','完了（模擬）'],['再起動後の状態再取得','PCエージェント応答あり（模擬）'],['未保存の作業','利用者の確認済み（Y）']];break;
 }
 p.status='done';p.doneAt=nowISO();p.result={verify,file};
 auditAdd(st,'agent','executed',{prop:p.id,opId:p.opId,device:p.deviceId});
 return {ok:true,verify,file,checks:v.checks}}
function rollbackOp(st,id,actor){const p=st.proposals[id];if(!p)return {ok:false};const op=OPS[p.opId];
 if(p.status!=='done'||!op.rollbackable||!op.key)return {ok:false,msg:'元に戻せる状態ではありません'};
 if(actor!==p.userId&&USERS[actor].role!=='itadmin')return {ok:false,msg:'依頼者本人またはIT管理者のみ'};
 st.devices[p.deviceId][op.key]=clone(p.snapshot);p.status='rolled_back';auditAdd(st,actor,'rolled_back',{prop:id});return {ok:true}}
function createTicket(st,o){const n=++st.counters.ticket;const t={id:'TKT-2026-'+pad(n,4),userId:o.userId,dept:USERS[o.userId].dept,category:o.category||'AI窓口',priority:o.priority||'通常',group:GROUPS[o.category]||GROUPS['AI窓口'],status:'受付',summary:o.summary||'',shared:o.shared||{},propId:o.propId||null,assignee:o.assignee||null,created:nowISO(),history:[{at:nowISO(),by:'system',text:'AI窓口から引継ぎ（本人同意済みの範囲のみ共有）'}],resolution:''};st.tickets.unshift(t);auditAdd(st,o.userId,'ticket_created',{ticket:t.id,category:t.category,priority:t.priority});return t}

function testEngine(){
 const st=freshState();const R=[];const D=id=>st.devices[id];const J=o=>JSON.stringify(o);
 const T=(name,ref,fn)=>{try{const r=fn();R.push({name,ref,ok:!!(r&&r.ok),note:(r&&r.note)||''})}catch(e){R.push({name,ref,ok:false,note:'例外：'+e.message})}};
 T('権限のない資料を表示しない','09-合格条件1',()=>{const r=kbSearch(st,'u1','人事異動の手続を教えて');return {ok:!r.hits.some(h=>h.k.id==='KB-010')&&r.hidden>0,note:'表示 '+r.hits.length+'件／権限外のため非表示 '+r.hidden+'件（題名も出さない）'}});

 T('異常時は変更せず担当者へ渡せる','09-合格条件6',()=>{const b=J(D('MRK-DT-0311').disk);const p=createProposal(st,'u3','TEMP_CLEAN_USER',{});userDecision(st,p.id,'Y');st.failNext=true;const r=applyOp(st,p);const t=createTicket(st,{userId:'u3',category:'IT端末',summary:'自動修復が失敗',propId:p.id});return {ok:!r.ok&&p.status==='failed'&&J(D('MRK-DT-0311').disk)===b&&!!st.tickets.find(x=>x.id===t.id),note:'失敗 → 変更なし → '+t.id+' を起票'}});
 T('承認後に内容が変わったら実行しない','07-承認の取り直し',()=>{const p=createProposal(st,'u1','AUDIO_DEVICE_SET',{device:'ヘッドセット（USB）'});userDecision(st,p.id,'Y');p.params.device='内蔵スピーカー';const r=applyOp(st,p);return {ok:!r.ok,note:'承認ハッシュ不一致を検知'}});
 T('設定変更（L4）は管理者承認なしに実行しない','07-権限表',()=>{const p=createProposal(st,'u2','VPN_ADAPTER_ENABLE',{});userDecision(st,p.id,'Y');const a=serverVerify(st,p).ok;adminDecision(st,p.id,'u4','approve','確認済み');const b=serverVerify(st,p).ok;return {ok:!a&&b,note:'本人Yのみ：NG → 管理者承認後：OK'}});
 T('自己承認を禁止（職務分離）','07-権限表',()=>{const p=createProposal(st,'u4','SPOOLER_RESTART',{});userDecision(st,p.id,'Y');const r=adminDecision(st,p.id,'u4','approve');return {ok:!r.ok&&p.status==='pending_admin',note:r.msg||''}});
 T('禁止操作はAIから実行できない','07-権限表 L5',()=>{const r=createProposal(st,'u1','SEC_DISABLE',{});return {ok:r.blocked===true&&st.audit.some(e=>e.event==='blocked_prohibited'),note:'提案自体を作らずブロック・記録'}});
 T('許可リストにない操作は作れない','07-操作許可リスト',()=>{let thrown=false;try{createProposal(st,'u1','FORMAT_DISK',{})}catch(e){thrown=true}return {ok:thrown,note:'未登録の操作IDは拒否'}});
 T('緊急停止中は実行しない','07-いつでも止める',()=>{const b=J(D('MRK-DT-0311').disk);const p=createProposal(st,'u3','TEMP_CLEAN_USER',{});userDecision(st,p.id,'Y');st.estop=true;const r=applyOp(st,p);st.estop=false;return {ok:!r.ok&&J(D('MRK-DT-0311').disk)===b,note:'緊急停止ON → 実行前検証NG'}});
 T('機密・極秘データの送信を制御','07-データ区分',()=>({ok:!dataPolicy('機密','external').ok&&dataPolicy('機密','local').ok&&!dataPolicy('極秘','local').ok&&dataPolicy('社内限定','external').ok,note:'機密→外部不可／極秘→AI不可'}));
 T('パスワード等をマスクして保存','07-守るルール',()=>{const r=dlpMask('パスワードは Abc12345! です');return {ok:!r.text.includes('Abc12345'),note:r.text}});
 T('監査ログの改ざんを検知','07-記録が残る',()=>{const ok1=verifyChain(st.audit).ok;const c=clone(st.audit);c[2].detail={tampered:true};const r=verifyChain(c);return {ok:ok1&&!r.ok,note:'正常 '+st.audit.length+'件を検証／改ざん版は #'+r.at+' で検知'}});
 T('PC基本情報の事前取得は読み取りのみ（端末を変えない）','事前取得',()=>{const b=J(D('MRK-NB-2048'));const s=pcSnapshot(st,'u2');return {ok:!!s&&s.items.length>=25&&J(D('MRK-NB-2048'))===b,note:(s?s.items.length:0)+'項目を取得・端末の状態は変化なし'}});
 T('事前取得に「取得しない情報」が含まれない','事前取得',()=>{const s=pcSnapshot(st,'u1');const bad=s.items.filter(i=>PC_NOT.some(n=>i.k.includes(n)));return {ok:bad.length===0,note:'ファイルの中身・閲覧履歴・画面・キー入力などは項目にない'}});

 T('事前取得の異常を、相談内容に関係する順に示す','事前取得',()=>{const s=pcSnapshot(st,'u2');const f=pcFlags(s,'VPNにつながらない');return {ok:f.length>0&&f[0].rel&&/VPN|社内ポータル/.test(f[0].k),note:'先頭：'+(f[0]?f[0].k+'（'+f[0].v+'）':'-')}});

const KEY='mirai-wizard-v31-cowork';
let S;const UI={pending:[],typing:false,stick:true,lastTests:null,auditFilter:'',ticketFilter:''};
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===31){S=o}}}catch(e){}
 if(!S)S=freshState();
 S.chats.forEach(c=>c.messages.forEach(m=>{if(m.kind==='diag')m.shown=m.steps.length;if(m.kind==='exec'&&m.state==='running'){m.state='aborted';const p=S.proposals[m.propId];if(p&&p.status==='executing'){p.status='aborted';auditAdd(S,'system','exec_aborted',{prop:p.id,reason:'画面の再読み込み'})}}}))}

/* ============ チャット補助 ============ */
const me=()=>USERS[S.ui.user];
function newChat(){const c={id:uid(),userId:S.ui.user,title:'新しい相談',created:nowISO(),messages:[{id:uid(),kind:'welcome',at:nowISO()}]};S.chats.unshift(c);S.ui.chat=c.id;save();return c}
function activeChat(){return S.chats.find(c=>c.id===S.ui.chat&&c.userId===S.ui.user)||null}
function ensureChat(){let c=activeChat();if(!c){c=S.chats.find(x=>x.userId===S.ui.user);if(c)S.ui.chat=c.id;else c=newChat()}return c}
function addMsg(chat,m){m.id=m.id||uid();m.at=nowISO();chat.messages.push(m);return m}
function ai(chat,html,opt){return addMsg(chat,Object.assign({kind:'ai',html,model:MODELS[S.ui.model]},opt||{}))}
function findMsg(id){for(const c of S.chats){const m=c.messages.find(x=>x.id===id);if(m)return [c,m]}return [null,null]}
function diag(chat,title,steps){const m=addMsg(chat,{kind:'diag',title,steps,shown:0,device:me().device});auditAdd(S,me().id,'diag_run',{title,device:me().device});animateDiag(m);return m}
function animateDiag(m){const step=()=>{m.shown++;refresh();if(m.shown<m.steps.length)setTimeout(step,420);else save()};setTimeout(step,300)}
function prop(chat,opId,params,meta,after){if(chat&&chatOpsUsed(chat)>=MAX_OPS_PER_CHAT){ai(chat,`<p>この相談では対応コマンドを <b>${MAX_OPS_PER_CHAT}回</b> 実行しました。これ以上は自動で実行せず、担当者へ引き継ぎます。</p>`,{conf:'—'});consentCard(chat,'IT端末','通常',after||null,null,{reason:`実行上限（${MAX_OPS_PER_CHAT}回）に達したため、これ以上のコマンドは実行していません。`});save();refresh();return null}
 const p=createProposal(S,me().id,opId,params,meta);p.chatId=chat.id;addMsg(chat,{kind:'proposal',propId:p.id,after});return p}

 const rel={print:['印刷スプーラ',d.printer.spooler==='running'?'実行中':'停止'],vpn:['VPNアダプタ',d.vpn.adapter==='enabled'?'有効':'無効'],audio:['音声の出力先',d.audio.default],slow:['ディスク',d.disk.freeGB+' GB 空き / 一時ファイル '+d.disk.tempGB+' GB'],share:['共有フォルダ権限',d.share.access==='ok'?'あり':'なし']}[intent];
 return addMsg(chat,{kind:'confirm',state:'pending',intent,text:String(text).slice(0,300),ctx:{device:d.id+'／'+d.os,pc:rel?[rel[0]+'：'+rel[1]]:[]}})}
function respond(chat,text,atts){const u=me();const intent=detectIntent(text,atts);S.stats.intents[intent]=(S.stats.intents[intent]||0)+1;
 if(intent!=='whistle')auditAdd(S,u.id,'chat_query',{intent,chars:text.length,atts:atts.length});
 if(CONFIRM_INTENTS[intent]&&!atts.length){confirmHearing(chat,text,intent);save();refresh();return}
 H[intent](chat,text,atts,u,S.devices[u.device])}
function parseCSV(t,dl){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===dl){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function csvStats(text,dl){const rows=parseCSV(text,dl);if(rows.length<2)return null;const head=rows[0].map(h=>h.trim());const body=rows.slice(1);
 const isNum=v=>v!==''&&!isNaN(Number(String(v).replace(/,/g,'')));const isDate=v=>/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(v);const num=v=>Number(String(v||'0').replace(/,/g,''))||0;
 const numCols=head.map((h,i)=>i).filter(i=>{const vs=body.map(r=>(r[i]||'').trim()).filter(Boolean);return vs.length&&vs.every(isNum)});
 let grpCol=head.map((h,i)=>i).find(i=>!numCols.includes(i)&&!body.every(r=>isDate((r[i]||'').trim())));
 const totals={},G={};numCols.forEach(i=>totals[i]=0);
 body.forEach(r=>{const g=grpCol!=null?(r[grpCol]||'（空欄）').trim():'全体';G[g]=G[g]||{count:0,sums:{}};G[g].count++;numCols.forEach(i=>{const v=num(r[i]);totals[i]+=v;G[g].sums[i]=(G[g].sums[i]||0)+v})});
 const groups=Object.entries(G).sort((a,b)=>(b[1].sums[numCols[0]]||0)-(a[1].sums[numCols[0]]||0)).slice(0,12);
 return {head,rows:body.length,numCols,grpCol:grpCol==null?null:grpCol,totals,groups}}
const fmtN=n=>(Math.round((n||0)*100)/100).toLocaleString('ja-JP');
const csvCell=v=>{const s=String(v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

function send(textOverride){const inp=document.getElementById('inp');let text=(textOverride!=null?textOverride:(inp?inp.value:'')).trim();const atts=UI.pending.splice(0);
 if(!text&&!atts.length)return;
 const chat=ensureChat();const u=me();const placeholder=!text;if(!text)text='（ファイルを添付しました）';
 const isWh=detectIntent(text,[])==='whistle';const dl=dlpMask(text);
 atts.forEach(a=>{const pol=dataPolicy(a.cls,S.ui.model);a.ok=pol.ok;a.msg=pol.msg;auditAdd(S,u.id,pol.ok?'file_analyze':'policy_blocked',{ext:a.ext,cls:a.cls,model:S.ui.model})});
 addMsg(chat,{kind:'user',text:isWh?'（専用窓口へご案内する内容のため、本文はこの窓口に保存していません）':dl.text,atts:atts.map(a=>({name:a.name,size:a.size,cls:a.cls,ok:a.ok,msg:a.msg}))});
 if(chat.title==='新しい相談')chat.title=isWh?'専用窓口のご案内':(placeholder&&atts[0]?atts[0].name:dl.text).slice(0,28);
 if(dl.found.length)auditAdd(S,u.id,'dlp_masked',{types:dl.found});
 S.stats.queries++;if(inp){inp.value='';autosize(inp)}
 UI.typing=true;UI.stick=true;save();refresh();renderPend();
 setTimeout(()=>{UI.typing=false;
  if(dl.found.length)ai(chat,`<p>🔏 入力に <b>${esc(dl.found.join('、'))}</b> と思われる情報があったため、保存・AI送信の前に伏せ字にしました。パスワード等はチャットに入力しないでください。</p>`,{conf:'—'});
  const ng=atts.filter(a=>!a.ok);if(ng.length)addMsg(chat,{kind:'block',tone:'warn',title:'📎 添付ファイルの一部をAIに渡していません',html:ng.map(a=>`<p>・${esc(a.name)}（${esc(a.cls)}）：${esc(a.msg)}</p>`).join('')});
  const ok=atts.filter(a=>a.ok);
  if(!(placeholder&&!ok.length))respond(chat,isWh?text:dl.text,ok);
  save();refresh()},700)}

function runExec(chat,propId){const p=S.proposals[propId];const v=serverVerify(S,p);
 const m=addMsg(chat,{kind:'exec',propId,checks:v.checks,steps:[],total:(OPS[p.opId].steps||[]).length,state:v.ok?'running':'denied'});
 if(!v.ok){auditAdd(S,'system','exec_denied',{prop:propId,failed:v.checks.filter(c=>!c[1]).map(c=>c[0])});save();refresh();return}
 p.status='executing';auditAdd(S,'agent','exec_started',{prop:propId,device:p.deviceId});save();refresh();
 const steps=OPS[p.opId].steps||[];let i=0;
 const tick=()=>{if(S.estop){m.state='aborted';p.status='aborted';auditAdd(S,'agent','exec_aborted',{prop:propId,reason:'緊急停止'});save();refresh();return}
  if(i<steps.length-1){m.steps.push(steps[i]);i++;save();refresh();setTimeout(tick,650);return}
  const r=applyOp(S,p);m.checks=r.checks||m.checks;
  if(r.ok){m.steps.push(steps[steps.length-1]);m.state='done';m.verify=r.verify;
   const nextId=OP_NEXT[p.opId],used=chatOpsUsed(chat);
   if(nextId&&used<MAX_OPS_PER_CHAT){setTimeout(()=>{const cc=S.chats.find(x=>x.id===chat.id);if(!cc||S.estop)return;ai(cc,`<p>続けて <b>${esc(OPS[nextId].name)}</b> を行いますか？ 実行する場合は「Y」、不要な場合は「N」を選んでください。</p>`,{conf:'—'});prop(cc,nextId,{},{target:OPS[nextId].impact},m.id);save();refresh()},900)}
   else if(nextId&&used>=MAX_OPS_PER_CHAT){ai(chat,`<p>対応コマンドの実行が上限（${MAX_OPS_PER_CHAT}回）に達したため、「${esc(OPS[nextId].name)}」は実行せず担当者へ引き継ぎます。</p>`,{conf:'—'});consentCard(chat,'IT端末','通常',null,p.id,{reason:`実行上限（${MAX_OPS_PER_CHAT}回）に達したため、次の「${OPS[nextId].name}」は未実行です。`})}
  }else{m.state='failed';m.msg=r.msg;if(p.status==='executing')p.status='failed';consentCard(chat,'IT端末','通常',null,propId,{reason:`実行に失敗しました（端末は変更なし）。操作: ${OPS[p.opId].name}（Lv${OPS[p.opId].level}）／対象: ${(p.meta&&p.meta.target)||'—'}`})}
  save();refresh()};
 setTimeout(tick,450)}

async function readFileObj(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
 const kind=['csv','tsv'].includes(ext)?'csv':['txt','log','md','json'].includes(ext)?'text':['png','jpg','jpeg','gif','bmp','webp'].includes(ext)?'image':['pdf','docx','xlsx','pptx','doc','xls','ppt'].includes(ext)?'doc':'binary';
 const a={id:uid(),name:f.name,size:f.size,ext,kind,cls:suggestClass(f.name),text:''};
 if((kind==='csv'||kind==='text')&&f.size<=1048576){const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{t=new TextDecoder('shift_jis').decode(buf)}catch(e2){t=new TextDecoder().decode(buf)}}a.text=t.replace(/^\uFEFF/,'').slice(0,200000)}
 else if(kind==='csv'||kind==='text'){a.note='1MB超のため本文は読み込みません';a.kind='binary'}
 return a}

function linkToHelpdesk(c,t){
 if(!window.HD)return;const u=USERS[c.userId];t.chatId=c.id;
 const body=Object.entries(t.shared).map(([k,v])=>Array.isArray(v)?'【'+k+'】\n'+v.join('\n'):'【'+k+'】'+v).join('\n');
 try{t.incId=HD.intake({tktId:t.id,requester:DEPTS[u.dept].name+' '+u.name,subject:t.summary,body,category:t.category,priority:t.priority,shared:t.shared,assignee:t.assignee})}catch(e){t.incId=null;console.error(e)}
 if(t.incId){t.hdState='escalated';t.history.push({at:nowISO(),by:'system',text:'AIヘルプデスクへ連携（'+t.incId+'）。対応結果はここに自動で反映されます'});auditAdd(S,c.userId,'hd_linked',{ticket:t.id,inc:t.incId})}
}
const HD_ST={escalated:'受付',in_progress:'対応中',resolved:'解決',ai:'受付',ai_resolved:'解決'};
function syncHd(){
 if(!window.HD||!S)return;let ch=false;
 S.tickets.forEach(t=>{
  if(!t.incId)return;const r=HD.getInc(t.incId,t.id);
  if(!r){if(!t.hdLost){t.hdLost=true;ch=true}return}
  if(t.hdLost){t.hdLost=false;ch=true}
  const c=S.chats.find(x=>x.id===t.chatId);
  if(r.assignee&&r.assignee!==t.hdAssignee){t.hdAssignee=r.assignee;t.history.push({at:nowISO(),by:'system',text:'ヘルプデスクの担当：'+r.assignee});ch=true}
  const st=HD_ST[r.status]||t.status;
  if(st!==t.status){const prev=t.status;t.status=st;
   if(r.resolution)t.resolution='原因：'+r.resolution.cause+'／対応：'+r.resolution.steps.join(' → ');
   t.history.push({at:nowISO(),by:'system',text:'ヘルプデスク（'+t.incId+'）の状態を反映：'+prev+' → '+st});
   auditAdd(S,'system','hd_synced',{ticket:t.id,inc:t.incId,status:st});
   if(st==='解決'&&c&&r.resolution)addMsg(c,{kind:'ai',model:'AIヘルプデスク連携',html:`<p>📬 受付番号 <b>${esc(t.id)}</b>（${esc(t.incId)}）は、担当者（${esc(r.assignee||'')}）が解決しました。</p><p class="small"><b>原因：</b>${esc(r.resolution.cause)}</p><ol class="small">${r.resolution.steps.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol><p class="small muted">まだ困っている場合は、もう一度相談してください。</p>`});
   ch=true}
  if(r.kbId&&r.kbId!==t.hdKb){t.hdKb=r.kbId;t.history.push({at:nowISO(),by:'system',text:'ナレッジ '+r.kbId+' として承認・公開'});auditAdd(S,'system','hd_synced',{ticket:t.id,inc:t.incId,kb:r.kbId});
   if(c)addMsg(c,{kind:'ai',model:'AIヘルプデスク連携',html:`<p>📚 この相談の解決内容は、承認者の確認を経て社内ナレッジ <span class="src" data-act="kbOpen" data-id="${esc(r.kbId)}">📚 ${esc(r.kbId)}</span> になりました。次からは同じ相談にAI窓口がこのナレッジを出典に答えます。</p>`});
   ch=true}
 });
 if(ch)save();
}

 const c={id:'CASE-'+pad(S.counters.case,4),userId:S.ui.user,created:nowISO(),step:1,kind:'',subject:'',body:'',urg:'通常',chatId:null,closed:null,want:false,share:{diag:true,device:true,atts:false,pc:true},pcOpt:null};
 cases().unshift(c);S.ui.case=c.id;S.ui.screen='wizard';auditAdd(S,c.userId,'case_created',{case:c.id});save();return c}
function link(c){
 const chat=c.chatId?S.chats.find(x=>x.id===c.chatId):null;
 const tkt=c.chatId?S.tickets.find(t=>t.chatId===c.chatId):null;
 const inc=tkt&&tkt.incId&&window.HD?HD.incInfo(tkt.incId):null;
 const dr=inc&&inc.draftId?HD.draftInfo(inc.draftId):null;
 const kb=inc&&inc.kbId?HD.kbInfo(inc.kbId):null;
 return {chat,tkt,inc,dr,kb}}
function reach(c,L){
 if(c.closed==='ai')return 7;
 let r=1;if(c.kind)r=2;if(c.chatId)r=3;if(L.tkt||c.want)r=4;if(L.inc)r=5;
 if(L.inc&&L.inc.status==='resolved')r=6;
 if(L.kb||(L.inc&&L.inc.status==='resolved'&&!L.inc.draftId))r=7;
 return r}
function sigOf(c,L){
 const txt=(c.subject+' '+c.body);
 const fin=c.closed==='ai'||!!L.kb||!!(L.inc&&L.inc.status==='resolved'&&!L.inc.draftId);
 if(fin&&c.kind!=='sec')return 'g';
 if(c.kind==='sec'||(L.inc&&L.inc.sec)||c.urg==='緊急'||/不審|ウイルス|ウィルス|感染|紛失|盗難|フィッシング/.test(txt))return 'r';
 if(L.tkt||c.want)return 'y';return 'g'}
function sigReasons(c,L){
 const R=[];
 if(c.kind==='sec'||/不審|ウイルス|ウィルス|感染|紛失|盗難|フィッシング/.test(c.subject+' '+c.body))R.push(['r','セキュリティの心配があるため、AIは自分で解決せず担当者へすぐ渡します']);
 if(c.urg==='緊急')R.push(['r','「急ぎ」が選ばれています']);
 if(L.tkt)R.push(['y','担当者へ引き継ぎ済み（'+L.tkt.id+'）']);
 else if(c.want)R.push(['y','「解決しない」と回答。担当者へ引き継ぎます']);
 if(c.closed==='ai')R.push(['g','AIの一次対応で解決しました']);
 if(L.kb)R.push(['g','解決内容がナレッジ '+L.kb.id+' になりました']);
 if(!R.length)R.push(['g',c.chatId?'AIが社内資料と端末の状態から対応しています':'まだ判定材料がありません（相談の種類と内容を入力してください）']);
 return R}
function nextActor(c,L){
 if(c.closed==='ai'||L.kb||(L.inc&&L.inc.status==='resolved'&&!L.inc.draftId))return {who:null,label:'完了',what:'この案件は完了しています'};
 if(!c.chatId)return {who:c.userId,label:'相談する人',what:'相談の種類と内容を入力して、AIに相談します'};
 if(!L.tkt)return {who:c.userId,label:'相談する人',what:c.want?'担当者に渡す情報を選んで引き継ぎます':'AIの答えを試し、解決したか／しないかを選びます'};
 if(!L.inc)return {who:null,label:'-',what:'ヘルプデスクとの連携を確認してください'};
 if(L.inc.status==='escalated'||L.inc.status==='in_progress'){const n=L.inc.assignee||L.inc.suggest;return {who:uidOfHd(n),label:'ヘルプデスク担当',what:L.inc.status==='escalated'?'引継ぎメモを確認して担当を決めます':'原因と手順を解決記録に書きます'}}
 if(L.dr&&(L.dr.status==='draft'||L.dr.status==='returned'))return {who:uidOfHd(L.dr.applicant),label:'担当者（ナレッジ下書き）',what:L.dr.status==='returned'?'差戻しの内容を直して再申請します':'下書きを整えて承認申請します'};
 if(L.dr&&L.dr.status==='review'){const a=['渡辺','山本'].find(n=>n!==L.dr.applicant);return {who:uidOfHd(a),label:'ナレッジ承認者',what:'チェックリストで確認して承認します'}}
 return {who:null,label:'-',what:''}}
function stageLabel(c,L){
 if(c.closed==='ai')return ['AIで解決','d'];if(L.kb)return ['完了（ナレッジ化）','d'];
 if(L.inc){if(L.inc.status==='resolved'){if(!L.inc.draftId)return ['完了','d'];return L.dr&&L.dr.status==='review'?['承認待ち','w']:['ナレッジ下書き','t']}return L.inc.status==='in_progress'?['担当者が対応中','a']:['引継ぎ待ち','w']}
 if(L.tkt)return ['引継ぎ済み','w'];if(c.chatId)return ['AIが対応中','t'];return ['入力中','']}

  it('リソース','ディスクの空き',d.disk.freeGB+' / '+d.disk.totalGB+' GB',d.disk.freeGB<15?'ng':d.disk.freeGB<40?'warn':'ok',d.disk.freeGB<15?'空き容量がとても少なくなっています':d.disk.freeGB<40?'空き容量が少なめです':'','遅い|重い|容量|空き|保存'),
  it('リソース','本人の一時ファイル',d.disk.tempGB+' GB',d.disk.tempGB>2?'warn':'ok',d.disk.tempGB>2?'整理すると空きが増やせます':'','遅い|重い|容量|空き'),
  it('セキュリティ','ウイルス対策','有効（定義ファイルは本日更新）','ok','','ウイルス|不審|感染|セキュリティ'),
  it('セキュリティ','ディスク暗号化','有効','ok','','紛失|盗難'),
  it('セキュリティ','Windows Update',wu?'更新 '+wu+'件が再起動待ち':'最新',wu?'warn':'ok',wu?'再起動すると更新が適用されます':'','遅い|更新|再起動|不具合'),
  it('周辺機器','既定のプリンター',d.printer.name||'（なし）','ok','','印刷|プリンタ|複合機'),
  it('周辺機器','印刷スプーラ',d.printer.spooler==='running'?'実行中':'停止',d.printer.spooler==='running'?'ok':'ng',d.printer.spooler==='running'?'':'印刷を管理するサービスが止まっています','印刷|プリンタ|複合機'),
  it('周辺機器','印刷キュー',d.printer.jobs.length+'件（本人のエラー '+own+'件）',own?'warn':'ok',own?'エラーで止まっている本人の印刷があります':'','印刷|プリンタ|複合機'),
  it('周辺機器','音声の出力先',d.audio.default,/HDMI/.test(d.audio.default)?'warn':'ok',/HDMI/.test(d.audio.default)?'ヘッドセットがつながっていますが、音はモニターから出る設定です':'','音|Teams|聞こえ|スピーカー|ヘッドセット|マイク|会議'),
  it('周辺機器','USB機器',(1+h%3)+'台（キーボード・マウスなど）','ok','','USB'),
  it('ソフトウェア','Microsoft 365 Apps','最新チャネル（16.0.'+(18000+h%900)+'）','ok','','Outlook|Excel|Word|メール'),
  it('ソフトウェア','Teams','新しいTeams（25.'+(1+h%9)+'）','ok','','Teams|会議|音'),
  it('ソフトウェア','VPNクライアント',d.vpn.client,'ok','','VPN'),
  it('ソフトウェア','DirectCloudドライブ','6.'+(h%4)+'（同期は正常）','ok','','DirectCloud|同期'),
  it('最近のエラー','アプリ・システムのエラー（24時間）',err+'件',err>=8?'warn':'ok',err>=8?'エラーの記録がいつもより多めです':'','')
 ];
 return {at:nowISO(),device:d.id,userId,items,ver:1};
}
function pcFlags(snap,text){
 if(!snap)return [];const t=String(text||'');
 return snap.items.filter(i=>i.lv!=='ok').map(i=>Object.assign({rel:!!(i.tag&&new RegExp(i.tag,'i').test(t))},i)).sort((a,b)=>(b.rel-a.rel)||((b.lv==='ng')-(a.lv==='ng')));
}
/* AIに渡す形（外部AIなら IP・シリアル番号を伏せる） */
function pcForAI(snap,model){
 if(!snap)return '';
 return snap.items.map(i=>{let v=i.v;if(model==='external'&&(i.k==='IPアドレス'||i.k==='シリアル番号'))v=i.k==='IPアドレス'?'[IPアドレス]':'[シリアル番号]';return `${i.grp}／${i.k}：${v}`}).join('\n');
}
function pcLines(c){
 const s=c&&c.pc&&c.pc.state==='done'?c.pc.snap:null;if(!s)return [];
 const f=pcFlags(s,c.subject+' '+c.body).map(i=>`【気になる点】${i.k}：${i.v}${i.note?'（'+i.note+'）':''}`);
 const keys=['コンピュータ名','OS','前回の再起動から','接続の種類','IPアドレス','VPN','ディスクの空き','Windows Update','印刷スプーラ','音声の出力先'];
 const base=s.items.filter(i=>keys.includes(i.k)&&i.lv==='ok').map(i=>`${i.k}：${i.v}`);
 return [`取得日時：${s.at}（読み取りのみ・${s.items.length}項目）`].concat(f,base);
}
function pcLinesForChat(chatId){const c=cases().find(x=>x.chatId===chatId);return c&&c.share&&c.share.pc===false?[]:pcLines(c)}
function pcVisible(c){const u=me();if(u.id===c.userId)return true;const L=link(c);return !!(L.tkt&&L.tkt.shared&&L.tkt.shared['PC基本情報（事前取得）'])}
function pcStart(c){
 if(!c||c.pcOpt===false)return;if(c.pc&&c.pc.state==='running')return;
 if(c.pc&&c.pc.state==='done')c.pcPrev=c.pc.snap;
 c.pc={state:'running',shown:0,snap:pcSnapshot(S,c.userId)};save();pcPaint(c);
 const tick=()=>{const cc=caseById(c.id);if(!cc||!cc.pc||cc.pc.state!=='running')return;
  cc.pc.shown++;if(cc.pc.shown>=PCG.length){pcDone(cc)}else{save();pcPaint(cc);setTimeout(tick,380)}};
 setTimeout(tick,380)}
function pcDone(c){
 if(!c.pc||c.pc.state==='done')return;c.pc.state='done';c.pc.shown=PCG.length;
 const f=pcFlags(c.pc.snap,c.subject+' '+c.body);
 auditAdd(S,c.userId,'pcinfo_collected',{case:c.id,device:c.pc.snap.device,items:c.pc.snap.items.length,flags:f.length});
 save();pcPaint(c)}
function pcDiff(c){
 if(!c.pcPrev||!c.pc||c.pc.state!=='done')return [];
 return c.pc.snap.items.map(i=>{const p=c.pcPrev.items.find(x=>x.k===i.k);return p&&p.v!==i.v?{k:i.k,from:p.v,to:i.v,lv:i.lv}:null}).filter(Boolean)}
const PCLV={ok:['正常','g'],warn:['注意','y'],ng:['異常','r']};
function pcCardHtml(c,compact){
 const p=c.pc;const owner=me().id===c.userId;
 if(!p){
  if(c.pcOpt===false)return `<div class="w-pc-h">${ICO('i-pc')}<b>PC基本情報の事前取得</b><span class="u-st">取得しない</span></div><div class="u-small u-muted">${compact?'この相談では取得しません':'この相談では取得しません。必要になったら、あとから取得できます。'}</div>${owner&&!c.chatId?`<div class="w-chips" style="margin-top:8px"><button class="w-chip" data-act="wPcOpt" data-v="on">取得する</button></div>`:owner?`<button class="u-btn sm" style="margin-top:8px" data-act="wPcRe">${ICO('i-search')} いま取得する</button>`:''}`;
  return `<div class="w-pc-h">${ICO('i-pc')}<b>PC基本情報の事前取得</b><span class="u-st">準備中</span></div>`}
 const n=p.snap?p.snap.items.length:0;
 if(p.state==='running'){
  const g=p.shown;
  return `<div class="w-pc-h">${ICO('i-pc')}<b>PC基本情報を取得中…</b><span class="u-st t">${g}/${PCG.length}</span></div>
  <div class="w-pcbar"><i style="width:${g/PCG.length*100}%"></i></div>
  ${compact?'':`<ul class="w-pcg">${PCG.map((x,i)=>`<li class="${i<g?'ok':i===g?'run':''}">${i<g?'✓':i===g?'…':'・'} ${esc(x)}</li>`).join('')}</ul>`}
  <div class="u-small u-muted">読み取りだけで集めています。入力はこのまま続けられます。</div>`}
 const f=pcFlags(p.snap,c.subject+' '+c.body),df=pcDiff(c);
 return `<div class="w-pc-h">${ICO('i-pc')}<b>PC基本情報</b><span class="u-st d">取得済み</span></div>
 <div class="u-small u-muted">${esc(p.snap.device)}・${esc(p.snap.at.slice(11,16))} に ${n}項目を読み取りました</div>
 ${f.length?`<div class="u-small" style="margin-top:6px"><b>気になる点 ${f.length}件</b></div><ul class="w-pcf">${f.slice(0,compact?3:6).map(i=>`<li><span class="u-sig ${PCLV[i.lv][1]}"><i></i>${PCLV[i.lv][0]}</span> ${i.rel?'<b>★</b> ':''}${esc(i.k)}：${esc(i.v)}</li>`).join('')}${f.length>(compact?3:6)?`<li class="u-muted">ほか ${f.length-(compact?3:6)}件</li>`:''}</ul>`:`<div class="u-note g" style="margin:6px 0 0">気になる点は見つかりませんでした</div>`}
 ${df.length?`<div class="u-small" style="margin-top:6px"><b>前回から変わった点</b></div><ul class="w-pcf">${df.map(x=>`<li>${esc(x.k)}：${esc(x.from)} → <b>${esc(x.to)}</b></li>`).join('')}</ul>`:''}
 <div class="w-chips" style="margin-top:8px"><button class="u-btn sm" data-act="wPcView" data-id="${c.id}">${ICO('i-search')} 詳しく見る</button>${owner?`<button class="u-btn sm" data-act="wPcRe">${ICO('i-undo')} 最新にする</button>`:''}</div>`}
function pcPaint(c){
 const a=document.getElementById('wzPc'),b=document.getElementById('wzPcAside');
 if(a&&a.dataset.case===c.id)a.innerHTML=pcCardHtml(c,false);
 if(b&&b.dataset.case===c.id)b.innerHTML=pcCardHtml(c,true);
 if(c.pc&&c.pc.state==='done')uxShell()}
function pcAnnounce(c,chat){
 const s=c.pc&&c.pc.state==='done'?c.pc.snap:null;
 if(!s){if(c.pcOpt===false)addMsg(chat,{kind:'ai',model:'PCエージェント（事前取得）',html:'<p>🖥️ この相談では、PC基本情報を事前に取得していません（本人の選択）。必要になったら、診断のときに必要な項目だけ読み取ります。</p>'});return}
 const f=pcFlags(s,c.subject+' '+c.body),ext=S.ui.model==='external';
 addMsg(chat,{kind:'ai',model:'PCエージェント（事前取得）',html:`<p>🖥️ 相談の前に取得した <b>PC基本情報</b>（${esc(s.device)}・${esc(s.at.slice(11,16))}・${s.items.length}項目）を確認しました。</p>${f.length?`<p>気になる点が <b>${f.length}件</b> あります。</p><ul>${f.map(i=>`<li>${i.rel?'★ ':''}<b>${esc(i.k)}</b>：${esc(i.v)}${i.note?'　<span class="small muted">'+esc(i.note)+'</span>':''}</li>`).join('')}</ul>`:'<p>気になる点は見つかりませんでした。</p>'}<p class="small muted">★＝相談内容に関係しそうな項目です。このあと、相談内容に合わせて詳しく調べます。${ext?'外部AIには、IPアドレスとシリアル番号を伏せて渡しています。':''}</p><div class="btns"><button class="btn sm" data-act="wPcView" data-id="${esc(c.id)}">PC基本情報を詳しく見る</button></div>`})}
function pcModal(c){
 const s=c.pc&&c.pc.snap;if(!s)return;
 if(!pcVisible(c)){toast('この案件では、PC基本情報は共有されていません');return}
 const rows=PCG.map(g=>{const its=s.items.filter(i=>i.grp===g);return `<tr><th colspan="3">${esc(g)}</th></tr>`+its.map(i=>`<tr><td>${esc(i.k)}</td><td>${esc(i.v)}${i.note?`<div class="small muted">${esc(i.note)}</div>`:''}</td><td><span class="dot ${i.lv==='ok'?'ok':i.lv==='warn'?'warn':'ng'}"></span>${PCLV[i.lv][0]}</td></tr>`).join('')}).join('');
 modal(`<div class="mh"><h3>🖥️ PC基本情報（事前取得）</h3><button class="btn sm" data-act="closeModal">閉じる</button></div>
 <div class="small muted">${esc(c.id)}｜${esc(uname(c.userId))}｜${esc(s.device)}｜取得 ${esc(s.at)}｜読み取りのみ・${s.items.length}項目</div>
 <div class="note">🚫 <b>取得しない情報</b>：${PC_NOT.map(esc).join('、')}</div>
 <div class="tblw"><table style="min-width:520px"><tr><th>項目</th><th>値</th><th>判定</th></tr>${rows}</table></div>
 <details style="margin-top:10px"><summary class="small" style="cursor:pointer">AIに渡した形（${S.ui.model==='external'?'外部AI：IPアドレス・シリアル番号を伏せる':'社内のAI'}）</summary><pre style="white-space:pre-wrap;background:var(--code);padding:8px 10px;border-radius:8px;font-size:12px">${esc(pcForAI(s,S.ui.model))}</pre></details>`)}
function viewPcinfo(){
 const C=cases().filter(c=>c.pc&&c.pc.snap);
 return `<div class="vh"><div><h2>🖥️ PC基本情報（事前取得）</h2><p>相談を入力している間に、PCエージェントが読み取りだけで集めた基本情報です。本人と、引継ぎで共有された担当者だけが中身を見られます。</p></div></div>
 <div class="note">🚫 取得しない情報：${PC_NOT.map(esc).join('、')}。外部AIへ渡すときは、IPアドレスとシリアル番号を伏せます。</div>
 <div class="tblw"><table><tr><th>案件</th><th>相談した人</th><th>端末</th><th>取得日時</th><th>項目</th><th>気になる点</th><th>共有</th></tr>
 ${C.map(c=>{const s=c.pc.snap,f=pcFlags(s,c.subject+' '+c.body),v=pcVisible(c);return `<tr class="${v?'click':''}" ${v?`data-act="wPcView" data-id="${c.id}"`:''}><td><b>${esc(c.id)}</b><div class="small muted">${esc(c.subject||c.body.slice(0,24))}</div></td><td>${esc(uname(c.userId))}</td><td>${esc(s.device)}</td><td class="small">${esc(s.at)}</td><td>${s.items.length}</td><td>${f.length?f.map(i=>`<span class="badge ${i.lv==='ng'?'ng':'warn'}">${esc(i.k)}</span>`).join(' '):'<span class="badge ok">なし</span>'}</td><td>${v?'<span class="badge ok">閲覧可</span>':'<span class="badge mute">共有されていない</span>'}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">まだ取得した記録はありません。新しい相談の STEP 2 で自動的に取得します。</td></tr>'}
 </table></div>`}

/* ============ 初期化 ============ */
/* プロフィール（氏名・所属）を USERS に反映する。
   状態はログイン（Access メール）ごとに保存されるため、同じ人が別の端末で開いても同じ表示になる。 */
function applyProfiles(){if(!S||!S.profiles)return;for(const [id,p] of Object.entries(S.profiles)){const u=USERS[id];if(!u||!p)continue;if(p.name)u.name=p.name;if(p.dept&&DEPTS[p.dept])u.dept=p.dept}}
function init(){load();applyProfiles();applyTheme();
 document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el){const m=$('#attmenu');if(m&&!e.target.closest('.attwrap'))m.classList.add('hide');return}const f=ACT[el.dataset.act];if(f){if(el.dataset.act!=='closeModalBg')e.preventDefault();f(el.dataset,el,e)}});
 document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='persona'){S.ui.user=t.value;syncHdActor();if(!canView(S.ui.view))S.ui.view=homeView();auditAdd(S,t.value,'persona_switch',{});S.ui.chat=null;ensureChat();UI.pending=[];UI.stick=true;save();renderSide();renderTop();renderView();toast(me().name+'（'+ROLES[me().role]+'）に切り替えました')}
  else if(t.id==='model'){S.ui.model=t.value;save();toast(t.value==='external'?'外部AI（模擬）：機密区分は送信できません':'社内ローカルLLM（模擬）を使用します')}
  else if(t.dataset.chg==='cls'){const a=UI.pending.find(x=>x.id===t.dataset.id);if(a)a.cls=t.value}
  else if(t.dataset.chg==='failNext'){S.failNext=t.checked;save();toast(t.checked?'次の実行は失敗します（異常系テスト）':'異常系テストを解除')}
  else if(t.dataset.ck){const [c,m]=findMsg(t.dataset.mid);if(m){m.sel[t.dataset.ck]=t.checked;save()}}
  else if(t.id==='file'){const fs=[...t.files];t.value='';Promise.all(fs.map(readFileObj)).then(as=>{UI.pending.push(...as);renderPend();if((S.ui.screen||'home')==='wizard')uxRender();if(as.length)toast('ファイルはこのブラウザ内で読み込みました（外部送信なし）')})}
  else if(t.id==='auf'){UI.auditFilter=t.value;renderView()}});
 document.addEventListener('input',e=>{const t=e.target;if(t.id==='inp')autosize(t);else if(t.id==='orgq')filterOrg();else if(t.id==='kbq')filterKb()});
 document.addEventListener('keydown',e=>{if(e.target.id==='inp'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}if(e.key==='Escape')closeModal()});
 document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='msgs'){const b=e.target;UI.stick=b.scrollHeight-b.scrollTop-b.clientHeight<80}},true);
 window.addEventListener('resize',()=>renderTop());
 ensureChat();save();renderSide();renderTop();renderView()}
if(typeof document!=='undefined'&&document.getElementById('app'))init();
window.CW={onShow(){syncHd();refresh()},stats:cwStats,openTicket(id){const t=S.tickets.find(x=>x.id===id);if(!t){toast('該当の受付番号がありません（初期化された可能性）');return}
 if(me().role==='employee'&&S.ui.user!==t.userId){S.ui.user=t.userId;syncHdActor();auditAdd(S,t.userId,'persona_switch',{});toast(uname(t.userId)+'（依頼者）に切り替えました')}
 S.ui.screen='tool';S.ui.view='tickets';save();renderSide();renderTop();renderView();openTicket(id)}};
if(!S.cases)S.cases=[];if(!S.ui.screen)S.ui.screen='home';S.cases.forEach(c=>{if(c.pc&&c.pc.state==='running'){c.pc.state='done';c.pc.shown=PCG.length}});
syncHdActor();renderSide();renderTop();renderView();

</script>
