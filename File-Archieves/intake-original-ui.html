<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みらいSF 受付ステーション</title>
<style>
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface2:#efede6; --ink:#1b222b; --muted:#5f6874; --line:#e1ddd2;
  --navy:#16314f; --navy2:#0f2440; --safety:#f5b800; --safety-soft:#fff5d3; --accent:#ee7d1c;
  --teal:#0f9d9a; --teal-soft:#dcf3f1; --ci:#4f5bd5; --ci-soft:#e8eafb;
  --g:#1f9d55; --g-soft:#e1f4e8; --y:#e0a800; --y-soft:#fdf2d2; --r:#c9302c; --r-soft:#fbe2e1;
  --shadow:0 1px 2px rgba(20,30,40,.05),0 10px 28px rgba(20,30,40,.08);
  --radius:16px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141a; --surface:#18202a; --surface2:#212a35; --ink:#e7ecf1; --muted:#9fabb8; --line:#2c3846; --safety-soft:#35290b; --teal-soft:#0f2f2d; --ci-soft:#1e2247; --g-soft:#11301f; --y-soft:#352a0b; --r-soft:#3a1616; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ci);cursor:pointer}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
.rail{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cfdbe8;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;position:sticky;top:0;height:100vh;z-index:40}
.rail .logo{width:46px;height:46px;border-radius:14px;background:var(--safety);color:#1b222b;display:grid;place-items:center;margin-bottom:10px;box-shadow:0 0 0 4px rgba(245,184,0,.2)}
.rail .logo .ico{width:26px;height:26px}
.rail button{width:68px;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;cursor:pointer;font-size:11px;position:relative}
.rail button .ico{width:22px;height:22px}
.rail button:hover{background:rgba(255,255,255,.08)}
.rail button.on{background:rgba(245,184,0,.16);color:#fff}
.rail button.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--safety)}
.rail .badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.rail .sp{flex:1}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
.top h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.top h1 small{font-size:12px;color:var(--muted);font-weight:500}
.top .sp{flex:1}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--g-soft);color:var(--g);font-weight:700}
.offline i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:beat 1.8s infinite}
@keyframes beat{50%{opacity:.3}}
.rolesw{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.rolesw select{min-width:0}
.rolesw select{border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--surface)}
.page{padding:22px 24px 60px;max-width:1280px;width:100%;margin:0 auto}
.view{animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
.h2{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px}
.h2 .ico{color:var(--accent)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;transition:transform .15s,background .2s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#1f416a}
.btn.go{background:var(--safety);color:#1b222b;border-color:var(--safety);font-weight:700}
.btn.dng{color:var(--r)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sig{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.sig i{width:10px;height:10px;border-radius:50%}
.sig.g{background:var(--g-soft);color:var(--g)}.sig.g i{background:var(--g)}
.sig.y{background:var(--y-soft);color:#946f00}.sig.y i{background:var(--y)}
.sig.r{background:var(--r-soft);color:var(--r)}.sig.r i{background:var(--r)}
@media (prefers-color-scheme:dark){.sig.y{color:#f3c64b}}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:8px;background:var(--surface2);white-space:nowrap}
.st.received{background:#e6eefb;color:#2f5f9e}.st.review,.st.wait{background:var(--y-soft);color:#8a6500}
.st.approved,.st.dev,.st.verify,.st.field{background:var(--teal-soft);color:#0d7d7a}.st.done{background:var(--g-soft);color:var(--g)}
.st.back{background:var(--r-soft);color:var(--r)}.st.hold{background:var(--surface2);color:var(--muted)}
@media (prefers-color-scheme:dark){.st{color:var(--ink)!important}}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 18%,transparent)}
textarea{resize:vertical;min-height:88px}
label.fl{display:block;font-weight:700;font-size:13.5px;margin:14px 0 6px}
label.fl .req{font-size:11px;color:#fff;background:var(--r);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

/* home */
.hello{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero{position:relative;overflow:hidden;padding:24px;border-radius:var(--radius);color:#fff;background:linear-gradient(135deg,var(--navy) 0%,#1f4a76 100%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;border-radius:50%;border:26px dashed rgba(245,184,0,.25);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{margin:0 0 6px;font-size:22px}
.hero p{margin:0 0 16px;color:#c9d8e8;max-width:520px}
.hero .btn.go{font-size:15px;padding:11px 20px;position:relative;z-index:1}
.hero .btn.go .ico{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .n{font-size:28px;font-weight:900;line-height:1.1}
.kpi .n small{font-size:12px;color:var(--muted);margin-left:2px;font-weight:700}
.kpi .t{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .t .ico{width:15px;height:15px;color:var(--accent)}
.ratio{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.ratio i{height:100%;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ratio .g{background:var(--g)}.ratio .y{background:var(--y)}.ratio .r{background:var(--r)}
.rl{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;animation:vin .4s both}
.feed li:last-child{border-bottom:0}
.feed .av{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--accent);font-weight:800;font-size:12px}
.feed small{color:var(--muted);display:block}
.mini{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:transform .2s,border-color .2s}
.mini:hover{transform:translateX(4px);border-color:var(--teal)}
.mini b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .no{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted)}

/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.stp{border:0;background:none;cursor:pointer;text-align:center;padding:0;color:var(--muted);font-size:12px}
.stp .bar{height:6px;border-radius:3px;background:var(--line);margin-bottom:6px;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s}
.stp.done .bar i,.stp.on .bar i{width:100%}
.stp.on{color:var(--ink);font-weight:800}
.stp.on .bar i{background:var(--safety)}
.stp b{display:block;font-size:11px;letter-spacing:.06em}
.pane{padding:22px 24px;min-height:440px}
.pane h3{margin:0 0 4px;font-size:20px}
.pane .lead{margin:0 0 6px;color:var(--muted)}
.pane.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.navbtns{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.err{display:none;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--r-soft);color:var(--r);font-size:13.5px}
.err.show{display:block}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;transition:all .2s}
.choice:hover{border-color:color-mix(in srgb,var(--teal) 50%,var(--line))}
.choice.on{border-color:var(--teal);background:var(--teal-soft)}
.choice .ib{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent)}
.choice.on .ib{background:var(--teal);color:#fff}
.choice b{display:block}
.choice small{color:var(--muted);font-size:12.5px;line-height:1.5;display:block}
.choice.sg{border-width:2.5px}
.choice.sg.g.on{border-color:var(--g);background:var(--g-soft)}.choice.sg.y.on{border-color:var(--y);background:var(--y-soft)}.choice.sg.r.on{border-color:var(--r);background:var(--r-soft)}
.choice.sg .dot{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.choice.sg.g .dot{background:var(--g)}.choice.sg.y .dot{background:var(--y);color:#1b222b}.choice.sg.r .dot{background:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;transition:all .15s}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on::before{content:"✓"}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:10px 0}
.depts .chip{justify-content:center;border-radius:12px;padding:6px 8px;font-size:12.5px}
.depts .chip.on::before{content:""}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{display:flex;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;transition:all .2s;animation:vin .3s both}
.tool:hover{border-color:var(--teal)}
.tool.on{border-color:var(--teal);background:var(--teal-soft)}
.tool .d{flex:none;width:14px;height:14px;border-radius:50%;margin-top:4px}
.tool .d.g{background:var(--g)}.tool .d.y{background:var(--y)}.tool .d.r{background:var(--r)}
.tool b{display:block;font-size:13.5px}
.tool small{color:var(--muted);font-size:12px;line-height:1.5;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.crit{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ci{display:grid;grid-template-columns:30px minmax(0,1fr) 34px;gap:8px;align-items:start;animation:vin .3s both}
.ci .n{width:30px;height:30px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:4px}
.ci input.vague{border-color:var(--y);background:var(--y-soft)}
.ci input.good{border-color:var(--g)}
.lint{font-size:12.5px;margin-top:4px;min-height:0}
.lint.vague,.lint.short{color:#9a6200}
.lint.ok{color:var(--g)}
.ci .rm{border:0;background:var(--surface2);border-radius:10px;width:34px;height:38px;cursor:pointer;color:var(--muted)}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.examples button{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px dashed var(--teal);background:var(--teal-soft);cursor:pointer;color:inherit}
.vsbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.vsbox div{padding:10px 12px;border-radius:12px;font-size:13px}
.vsbox .b{background:var(--r-soft)}.vsbox .gd{background:var(--g-soft)}
mark.vague{background:var(--y-soft);color:inherit;border-bottom:2px solid var(--y)}

/* preview */
.pv{position:sticky;top:80px;display:flex;flex-direction:column;gap:12px}
.pvhead{display:flex;align-items:center;gap:14px;padding:16px}
.light{flex:none;background:#20262e;border-radius:22px;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.light span{width:34px;height:34px;border-radius:50%;opacity:.18;transition:opacity .4s,box-shadow .4s,transform .4s}
.light .g{background:#22b463}.light .y{background:#f5c400}.light .r{background:#e3403a}
.light span.on{opacity:1;transform:scale(1.06)}
.light .g.on{box-shadow:0 0 20px #22b463}.light .y.on{box-shadow:0 0 20px #f5c400}.light .r.on{box-shadow:0 0 20px #e3403a;animation:redb 1.2s infinite}
@keyframes redb{50%{opacity:.55}}
.pvhead b{font-size:16px}
.reasons{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px}
.reasons li{display:flex;gap:6px;margin:2px 0;animation:vin .3s both}
.reasons i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.reasons i.g{background:var(--g)}.reasons i.y{background:var(--y)}.reasons i.r{background:var(--r)}
.meas{padding:14px 16px}
.meas .big{font-size:26px;font-weight:900;color:var(--teal)}
.mb{display:grid;grid-template-columns:118px minmax(0,1fr) 16px;gap:6px;align-items:center;font-size:12px;margin:4px 0}
.mb .b{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mb .b i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--safety));transition:width .5s}
.order{overflow:hidden}
.order .oh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;border-bottom:5px solid var(--safety);font-size:13.5px}
.order .oh .sp{flex:1}
.order .tg{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.order .tg button{border:0;background:none;color:#cbd8e6;font-size:11.5px;padding:2px 8px;cursor:pointer}
.order .tg button.on{background:var(--safety);color:#1b222b;font-weight:700}
.order dl{margin:0;padding:6px 14px 12px;font-size:12.5px;max-height:330px;overflow:auto}
.order dt{font-weight:800;margin-top:8px;color:var(--muted);font-size:11.5px}
.order dd{margin:2px 0 0}
.order dd ul{margin:0;padding-left:16px}
pre.yaml{margin:0;padding:12px 14px;background:#0f1b29;color:#d7e3ef;font-size:11.5px;line-height:1.6;white-space:pre;overflow:auto;max-height:360px}

/* board */
.btool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btool .sp{flex:1}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface2);border-radius:14px;padding:10px;min-height:300px;display:flex;flex-direction:column;gap:8px;transition:background .2s,outline .2s}
.col.over{background:var(--teal-soft);outline:2px dashed var(--teal)}
.col h4{margin:0 0 2px;font-size:13px;display:flex;align-items:center;gap:6px}
.col h4 em{font-style:normal;margin-left:auto;font-size:11.5px;background:var(--surface);border-radius:999px;padding:0 8px;color:var(--muted)}
.col.side h4{color:var(--muted)}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s;border-left:5px solid var(--line);animation:vin .3s both}
.kc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kc.g{border-left-color:var(--g)}.kc.y{border-left-color:var(--y)}.kc.r{border-left-color:var(--r)}
.kc.drag{opacity:.4}
.kc.new{animation:glow 1.8s ease}
@keyframes glow{0%,40%{box-shadow:0 0 0 4px var(--safety)}100%{box-shadow:none}}
.kc .no{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.kc b{display:block;font-size:13.5px;line-height:1.45;margin:2px 0 6px}
.kc .meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}

/* list */
.fbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
table.t th,table.t td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}
table.t th{background:var(--surface2);font-size:12.5px;color:var(--muted);white-space:nowrap}
table.t tbody tr{cursor:pointer;transition:background .2s}
table.t tbody tr:hover{background:var(--safety-soft)}

/* drawer */
.dmask{position:fixed;inset:0;background:rgba(10,20,30,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.dmask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:90;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer.show{transform:none}
.dh{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.dh .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh .no{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.dh h3{margin:6px 0 10px;font-size:18px}
.dh .x{margin-left:auto;border:0;background:var(--surface2);border-radius:10px;width:34px;height:34px;cursor:pointer}
.dh .acts{display:flex;flex-wrap:wrap;gap:6px}
.prog{display:flex;gap:3px;margin-top:12px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.p{background:var(--teal)}
.prog span.c{background:var(--safety);animation:beat 1.6s infinite}
.prog.off span.c{background:var(--r)}
.plab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px}
.dtabs{display:flex;gap:4px;padding:8px 20px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.dtabs button.on{border-bottom-color:var(--safety);color:var(--ink);font-weight:700}
.db{flex:1;overflow:auto;padding:16px 20px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:700;font-size:12.5px}
.kv dd{margin:0}
.kv ul,.kv ol{margin:0;padding-left:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.box h4 .ico{color:var(--accent)}
ul.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
ul.tl li{position:relative;padding:0 0 12px 12px;font-size:13px;animation:vin .3s both}
ul.tl li::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:3px solid var(--bg)}
ul.tl small{display:block;color:var(--muted)}
.cmt{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.cmt small{display:block;color:var(--muted)}

/* modal, stamp, toast */
.mmask{position:fixed;inset:0;background:rgba(10,20,30,.5);display:none;align-items:center;justify-content:center;z-index:120;padding:16px}
.mmask.show{display:flex;animation:vin .2s}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.modal .mbd{padding:16px 18px;max-height:65vh;overflow:auto}
.modal .mft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2)}
.stopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stopts label{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.stopts label.dis{opacity:.4;cursor:not-allowed}
.redw{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--r-soft)}
.redw.show{display:block}
.stamp{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(10,20,30,.35)}
.stamp.show{display:flex}
.stamp .hanko{width:220px;height:220px;border-radius:50%;border:10px solid #d4413a;color:#d4413a;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.92);font-weight:900;animation:press .7s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.stamp .hanko b{font-size:46px;line-height:1.1;letter-spacing:.1em}
.stamp .hanko span{font-family:ui-monospace,Consolas,monospace;font-size:14px;border-top:3px solid #d4413a;margin-top:6px;padding-top:4px}
.stamp .hanko small{font-size:12px;margin-top:2px}
@keyframes press{0%{transform:scale(2.6) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13.5px;animation:tin .3s ease;display:flex;gap:8px;align-items:center}
.toast.ng{background:var(--r)}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.data-row{display:flex;flex-wrap:wrap;gap:8px}
.notice{font-size:12.5px;color:var(--muted);margin-top:24px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}

@media (max-width:1100px){ .wiz{grid-template-columns:1fr} .pv{position:static} .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .rail .logo,.rail .sp{display:none}
  .rail button{width:auto;flex:1;padding:6px 2px}
  .rail button.on::before{left:20%;right:20%;top:-4px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .top{padding:10px 14px;flex-wrap:wrap}
  .top h1 small{display:none}
  .rolesw{width:100%}
  .page{padding:14px 14px 90px}
  .hello,.two,.choices,.tools,.grid2,.vsbox,.stopts{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:repeat(7,minmax(0,1fr))}
  .stp span{display:none}
  .pane{padding:18px 16px}
  .fbar{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

/* ===== みらいソフトウェアファクトリー 詳細受付：共通コア（オフライン） ===== */
const SF = (function(){
  const COLORS = {g:{l:'青',n:'任せる'},y:{l:'黄',n:'チェック付き'},r:{l:'赤',n:'決めさせない'}};
  const RANK = {g:0,y:1,r:2};
  const STATUSES = [
    {k:'received',l:'受付',flow:1},
    {k:'review',l:'内容確認中',flow:1},
    {k:'wait',l:'承認待ち',flow:1},
    {k:'approved',l:'承認済み',flow:1},
    {k:'dev',l:'実装中',flow:1},
    {k:'verify',l:'検証中',flow:1},
    {k:'field',l:'現場試用',flow:1},
    {k:'done',l:'完了',flow:1},
    {k:'back',l:'差戻し',flow:0},
    {k:'hold',l:'見送り',flow:0}
  ];
  const NEXT = {received:'review',review:'wait',wait:'approved',approved:'dev',dev:'verify',verify:'field',field:'done',back:'received'};
  const ROLES = [
    {k:'requester',l:'依頼者',name:'山田 太郎',dept:'koji'},
    {k:'desk',l:'受付担当（IT・DX）',name:'佐藤 花子',dept:'it'},
    {k:'approver',l:'承認者（業務責任者）',name:'鈴木 一郎',dept:'koji'}
  ];
  const KINDS = ['新しい道具がほしい','いまある道具を良くしたい','不具合の報告','相談・アイデア'];
  const USERS = ['現場の担当者','現場所長','現場事務','本社・支店の担当者','協力会社','発注者','経営層'];
  const PLACES = ['事務所','現場（屋外）','電波の弱い現場','移動中・車内'];
  const DATA = [
    {k:'personal',l:'個人情報（名簿・資格・健康など）'},
    {k:'client',l:'発注者から預かった図面・データ'},
    {k:'location',l:'現場の位置情報'},
    {k:'photo',l:'工事写真・検査記録の原本'},
    {k:'money',l:'お金の情報（金額・原価・支払い）'}
  ];
  const PARTIES = ['社内のみ','協力会社も使う','発注者も見る'];
  const DECIDES = [
    {k:'g',l:'記録・整理・検索・お知らせ'},
    {k:'y',l:'たたき台づくり・比べっこ・見落としチェック'},
    {k:'r',l:'合否・金額・契約・人の処遇・安全などを決める'}
  ];
  const CONSTRAINTS = [
    'いまのログイン方法は変えない',
    '本物のデータを練習用の場所に持ち込まない',
    '写真・記録の原本は加工しない',
    '個人情報は必要な人だけが見られるようにする',
    '電波がなくても入力が消えないようにする'
  ];
  const APPROVALS = [
    'データを消す・作り直す変更',
    'ログインや権限の変更',
    '新しい外部サービスとの接続',
    '協力会社・発注者に見せる範囲の変更',
    '提出様式の変更',
    '安全・品質の判定にかかわる変更'
  ];
  const FREQ = [{k:'d',l:'毎日',m:20},{k:'w',l:'毎週',m:4},{k:'m',l:'毎月',m:1},{k:'o',l:'ときどき',m:0.3}];
  const READY = [{k:5,l:'電子データでそろっている'},{k:3,l:'一部は紙・Excel'},{k:1,l:'紙や人の頭の中'}];
  const SPREAD = [{k:5,l:'全社で使えそう'},{k:3,l:'いくつかの部署・現場で使えそう'},{k:1,l:'自分の部署だけ'}];
  const VAGUE = ['使いやすい','使い易い','見やすい','わかりやすい','分かりやすい','いい感じ','いいかんじ','適切','適宜','なるべく','できるだけ','早く','速く','すばやく','簡単','かんたん','便利','スムーズ','きれい','ちゃんと','しっかり','柔軟','直感的','快適','いろいろ','など'];

  const pad = (n,l)=>String(n).padStart(l||2,'0');
  function nowISO(){ return new Date().toISOString(); }
  function fmt(iso, withTime){
    if(!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return iso;
    const s = d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
    return withTime===false ? s : s+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function lines(t){ return String(t||'').split(/\r?\n/).map(s=>s.replace(/^\s*[-・●]\s*/,'').trim()).filter(Boolean); }
  const statusOf = k => STATUSES.find(s=>s.k===k) || STATUSES[0];
  const deptOf = id => CATALOG.find(d=>d.id===id);
  function toolOf(ref){
    if(!ref) return null;
    const [d,i] = ref.split('|'); const dep = deptOf(d); if(!dep) return null;
    const t = dep.tools[+i]; return t ? {dept:dep, name:t[0], desc:t[1], c:t[2]} : null;
  }
  const roleOf = k => ROLES.find(r=>r.k===k) || ROLES[0];

  /* ---- 信号の色の判定（候補） ---- */
  function judge(r){
    const reasons = [];
    let c = 'g';
    const up = (to, why) => { if (RANK[to] > RANK[c]) c = to; reasons.push({c:to, t:why}); };
    if (r.decides) up(r.decides, r.decides==='r' ? '「決める」仕事が入っています。AIに決めさせない範囲です' : r.decides==='y' ? 'たたき台・チェックの道具は、担当者の確認が必要です' : '記録・整理・お知らせの道具です');
    const tool = toolOf(r.toolRef);
    if (tool && tool.c !== 'g') up(tool.c, 'カタログ上の色が「'+COLORS[tool.c].l+'」の道具です');
    (r.data||[]).forEach(k => { const d = DATA.find(x=>x.k===k); if (d) up('y', d.l+'を扱います'); });
    if (r.parties && r.parties !== '社内のみ') up('y', '社外の人（'+r.parties.replace('も使う','').replace('も見る','')+'）が関わります');
    if ((r.approvals||[]).includes('安全・品質の判定にかかわる変更')) up('y', '安全・品質の判定にかかわります');
    if (!reasons.length) reasons.push({c:'g', t:'まだ判定材料がありません（「この道具は何をしますか」を選んでください）'});
    return {c, reasons};
  }

  /* ---- ものさし（参考値。着手順は別途決定） ---- */
  function measure(r){
    const f = FREQ.find(x=>x.k===r.freq);
    const people = Math.max(0, +r.people||0), minutes = Math.max(0, +r.minutes||0);
    const hours = f ? Math.round(people * f.m * minutes / 60 * 10) / 10 : 0;
    const band = (v, cuts) => { let s=1; cuts.forEach((x,i)=>{ if (v>=x) s=i+2; }); return Math.min(s,5); };
    const j = judge(r);
    const scores = [
      {k:'people', l:'困っている人の多さ', v: people ? band(people,[3,10,30,100]) : 0},
      {k:'signal', l:'青信号か', v: r.decides ? ({g:5,y:3,r:1})[j.c] : 0},
      {k:'hours', l:'手間の減り方', v: hours ? band(hours,[5,20,50,150]) : 0},
      {k:'ready', l:'データがそろっているか', v: +r.dataReady||0},
      {k:'spread', l:'ほかに広げられるか', v: +r.spread||0}
    ];
    return {hours, scores};
  }

  /* ---- 合格の条件のチェック ---- */
  function lint(text){
    const t = String(text||'').trim();
    if (!t) return {ok:false, level:'empty', words:[], tip:''};
    if (/〇〇|△△|○○/.test(t)) return {ok:false, level:'vague', words:['〇〇'], tip:'「〇〇」「△△」の所を、自分の言葉に書きかえてください。'};
    const words = VAGUE.filter(w => t.includes(w));
    if (words.length) return {ok:false, level:'vague', words, tip:'「'+words.join('」「')+'」は人によって受け取り方がちがうため、検査機で合否を決められません。数字や「〜できる／〜できない」で書いてみましょう。'};
    if (t.length < 8) return {ok:false, level:'short', words:[], tip:'もう少し具体的に書きましょう（だれが・何を・どうなれば合格か）。'};
    return {ok:true, level:'ok', words:[], tip:'検査で確かめられる書き方です。'};
  }
  function markVague(text){
    let h = esc(text);
    VAGUE.slice().sort((a,b)=>b.length-a.length).forEach(w => { h = h.split(esc(w)).join('<mark class="vague">'+esc(w)+'</mark>'); });
    return h;
  }

  /* ---- 権限（サンプル） ---- */
  function canMove(role, from, to){
    if (from === to) return false;
    if (role === 'approver') return true;
    if (role === 'desk') return !['approved','done'].includes(to) && from !== 'done';
    if (role === 'requester') return (from==='back' && to==='received') || (['received','back'].includes(from) && to==='hold');
    return false;
  }
  function canEdit(role, r){ return role !== 'requester' ? !['done'].includes(r.status) : ['received','back'].includes(r.status); }

  /* ---- 注文書（作業指示書）YAML ---- */
  function q(s){ return '"' + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r?\n/g,' ') + '"'; }
  function list(key, arr, ind){ ind = ind||''; if(!arr || !arr.length) return ind+key+': []\n'; return ind+key+':\n' + arr.map(x=>ind+'  - '+q(x)).join('\n') + '\n'; }
  function toYAML(r){
    const j = judge(r), m = measure(r), d = deptOf(r.dept), tool = toolOf(r.toolRef);
    const dataL = (r.data||[]).map(k => (DATA.find(x=>x.k===k)||{}).l).filter(Boolean);
    const f = FREQ.find(x=>x.k===r.freq);
    let y = '';
    y += 'id: '+q(r.id)+'\n';
    y += 'title: '+q(r.title)+'\n';
    y += 'kind: '+q(r.kind)+'\n';
    y += 'department: '+q(d ? d.name : '')+'\n';
    y += 'catalog_tool: '+q(tool ? tool.name : 'カタログ外')+'\n';
    y += 'requested_by: '+q(r.applicant)+'\n';
    y += 'approver: '+q(r.approver)+'\n';
    y += 'status: '+q(statusOf(r.status).l)+'\n';
    y += 'signal:\n  suggested: '+q(COLORS[j.c].l)+'\n  decided: '+q(r.signalFinal ? COLORS[r.signalFinal].l : '未決定（承認者が決める）')+'\n';
    y += '\n' + list('problem', lines(r.problem));
    y += list('purpose', lines(r.purpose));
    y += list('users', r.users);
    y += list('places', r.places);
    y += '\n' + list('scope', lines(r.scope));
    y += list('out_of_scope', lines(r.outScope));
    y += '\n' + list('acceptance_criteria', (r.criteria||[]).filter(Boolean));
    y += '\n' + list('constraints', (r.constraints||[]).concat(lines(r.constraintsOther)));
    y += list('data_handling', dataL.length ? dataL : ['特別な情報は扱わない']);
    y += 'parties: '+q(r.parties||'社内のみ')+'\n';
    y += list('requires_human_approval', r.approvals);
    y += '\nmeasure:  # 参考値。着手順は別途決める\n';
    y += '  people: '+(+r.people||0)+'\n  frequency: '+q(f?f.l:'')+'\n  minutes_per_time: '+(+r.minutes||0)+'\n  est_hours_per_month: '+m.hours+'\n';
    y += '\nrequested_at: '+q(fmt(r.createdAt))+'\nwish_date: '+q(r.wish||'')+'\n';
    return y;
  }

  /* ---- CSV ---- */
  function toCSV(items){
    const head = ['受付番号','件名','部署','依頼区分','起票者','信号（候補）','信号（決定）','状態','月あたり削減見込み(h)','受付日時','更新日時'];
    const cell = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
    const rows = items.map(r => { const j=judge(r), m=measure(r), d=deptOf(r.dept);
      return [r.id, r.title, d?d.name:'', r.kind, r.applicant, COLORS[j.c].l, r.signalFinal?COLORS[r.signalFinal].l:'', statusOf(r.status).l, m.hours, fmt(r.createdAt), fmt(r.updatedAt)].map(cell).join(','); });
    return '﻿' + head.map(cell).join(',') + '\r\n' + rows.join('\r\n');
  }
  function download(name, text, mime){
    try {
      const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return true;
    } catch(e) { return false; }
  }

  /* ---- 保存（ブラウザ内のみ。使えない環境ではメモリ保持） ---- */
  let memory = null;
  function load(key){
    try { const s = localStorage.getItem(key); if (s) { const d = JSON.parse(s); if (d && Array.isArray(d.items)) return {data:d, persistent:true}; } }
    catch(e) { return {data: memory || seed(), persistent:false}; }
    return {data: seed(), persistent: storageOK()};
  }

  const critRow = (c, j) => { const L = SF.lint(c); return '<div class="ci" data-ci="'+j+'"><span class="n">'+(j+1)+'</span><div><input type="text" data-crit="'+j+'" value="'+E(c)+'" class="'+(L.level==='vague'?'vague':L.ok?'good':'')+'" placeholder="'+(j===0?'例：圏外で撮った写真がアプリを閉じても消えない':'')+'"><div class="lint '+(L.level==='empty'?'':L.level)+'">'+(L.level==='empty'?'':(L.ok?'✓ ':'△ ')+E(L.tip))+'</div></div><button type="button" class="rm" data-rmc="'+j+'" title="削除"'+(S.draft.criteria.length<=1?' disabled':'')+'>'+ico('i-x')+'</button></div>'; };

  function bindStep(){

        d.criteria[+c] = e.target.value; const L = SF.lint(e.target.value), box = e.target.nextElementSibling;
        e.target.className = L.level==='vague'?'vague':L.ok?'good':''; box.className = 'lint '+(L.level==='empty'?'':L.level); box.textContent = L.level==='empty'?'':(L.ok?'✓ ':'△ ')+L.tip; updPreview();

      '<select id="ls"><option value="">すべての状態</option>'+SF.STATUSES.map(s=>'<option value="'+s.k+'"'+(S.fs===s.k?' selected':'')+'>'+E(s.l)+'</option>').join('')+'</select>'+
      '<select id="lc"><option value="">すべての色</option>'+['g','y','r'].map(c=>'<option value="'+c+'"'+(S.fc===c?' selected':'')+'>'+SF.COLORS[c].l+'</option>').join('')+'</select></div>'+
      '<div class="card tw"><table class="t"><thead><tr><th>受付番号</th><th>件名</th><th>部署</th><th>起票者</th><th>信号</th><th>状態</th><th>削減見込み</th><th>更新</th></tr></thead><tbody id="ltb">'+
      (a.length ? a.map(r=>{ const d=SF.deptOf(r.dept); return '<tr data-id="'+E(r.id)+'"><td style="font-family:ui-monospace,Consolas,monospace;white-space:nowrap">'+E(r.id)+'</td><td><b>'+E(r.title)+'</b></td><td>'+E(d?d.short:'')+'</td><td>'+E(r.applicant)+'</td><td>'+sig(colorOf(r))+'</td><td>'+st(r.status)+'</td><td>'+SF.measure(r).hours+' h/月</td><td style="white-space:nowrap">'+E(SF.fmt(r.updatedAt))+'</td></tr>'; }).join('') : '<tr><td colspan="8" class="muted" style="text-align:center;padding:30px">条件に合う依頼がありません</td></tr>')+
      '</tbody></table></div><p class="hint">'+a.length+' 件 ／ 全 '+S.data.items.length+' 件</p>';
    const re = () => { const p = $('#lq').selectionStart; renderList(); const x=$('#lq'); x.focus(); try{x.setSelectionRange(p,p);}catch(_){} };
    $('#lq').addEventListener('input', e => { S.fq=e.target.value; re(); });
    $('#ld').addEventListener('change', e => { S.fd=e.target.value; renderList(); });
    $('#ls').addEventListener('change', e => { S.fs=e.target.value; renderList(); });
    $('#lc').addEventListener('change', e => { S.fc=e.target.value; renderList(); });
    $$('#ltb tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>openDrawer(tr.dataset.id)));
    $('#lcsv').addEventListener('click', () => SF.download('受付一覧_'+ymd()+'.csv', SF.toCSV(a), 'text/csv') ? toast('CSVを書き出しました') : toast('書き出せませんでした', true));
    $('#ljson').addEventListener('click', exportJSON);
  }
  const ymd = () => { const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
  function exportJSON(){ SF.download('受付データ_'+ymd()+'.json', JSON.stringify(S.data,null,2), 'application/json') ? toast('JSONを書き出しました') : toast('書き出せませんでした', true); }

  /* ---- data ---- */
  function renderData(){
    $('#view').innerHTML =
      '<div class="two"><div class="card pad"><h2 class="h2">'+ico('i-db')+'データの保存</h2>'+
        '<p>保存先：<b>'+(S.persistent?'このブラウザの保存領域（外部には送信しません）':'一時保存（閉じると消えます）')+'</b><br>件数：<b>'+S.data.items.length+'</b> 件</p>'+
        '<div class="data-row"><button class="btn" id="dj" type="button">'+ico('i-down')+'JSONで書き出す</button><button class="btn" id="dc" type="button">'+ico('i-down')+'CSVで書き出す</button><button class="btn" id="di" type="button">'+ico('i-up')+'JSONを取り込む</button><button class="btn dng" id="dr" type="button">'+ico('i-undo')+'サンプルに戻す</button></div>'+
        '<p class="hint">JSONは AppSuite風サンプルと同じ形式です。どちらで作ったデータも取り込めます。</p></div>'+
      '<div class="card pad"><h2 class="h2">'+ico('i-shield')+'このサンプルの約束</h2><ul style="margin:0;padding-left:18px">'+
        '<li>インターネットに接続せず、外部のサービスやライブラリを一切読み込みません</li>'+
        '<li>信号の色は「候補」を自動で出しますが、<b>最終決定は承認者</b>が行います</li>'+
        '<li>赤信号の承認には「AIに決めさせない」確認が必要です</li>'+
        '<li>「承認済み」「完了」にできるのは承認者だけです（役割の切り替えは動作確認用）</li>'+
        '<li>受付・相談・承認依頼の入口はここ。正式な判断は対象のPR等に記録する想定です</li></ul></div></div>';
    $('#dj').addEventListener('click', exportJSON);
    $('#dc').addEventListener('click', () => SF.download('受付一覧_'+ymd()+'.csv', SF.toCSV(S.data.items), 'text/csv') ? toast('CSVを書き出しました') : toast('書き出せませんでした', true));
    $('#di').addEventListener('click', () => $('#importFile').click());
    $('#dr').addEventListener('click', () => confirmBox('サンプルに戻す','登録した内容はすべて消え、最初のサンプルデータに戻ります。よろしいですか？','サンプルに戻す',()=>{ S.data=SF.seed(); persist(); toast('サンプルデータに戻しました'); renderData(); }));
  }
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!SF.validImport(o)) throw 0;
        confirmBox('JSONの取り込み', o.items.length+' 件のデータで、いまのデータを置き換えます。よろしいですか？', '取り込む', () => {
          o.seq = Math.max(o.seq||0, ...o.items.map(x=>+String(x.id).split('-').pop()||0)); S.data=o; persist(); toast(o.items.length+' 件を取り込みました'); go('board'); });
      } catch(_) { toast('このファイルは取り込めません', true); } e.target.value=''; };
    rd.readAsText(f);
  });

  /* ---- drawer ---- */
  function openDrawer(id){ S.open=id; S.dtab='sum'; renderDrawer(); $('#drawer').classList.add('show'); $('#dmask').classList.add('show'); }
  function closeDrawer(){ S.open=null; $('#drawer').classList.remove('show'); $('#dmask').classList.remove('show'); }
  $('#dmask').addEventListener('click', closeDrawer);
  function renderDrawer(){
    const r = find(S.open); if(!r) return closeDrawer();
    const j = SF.judge(r), m = SF.measure(r), dep = SF.deptOf(r.dept), tl = SF.toolOf(r.toolRef);
    const flow = SF.STATUSES.filter(s=>s.flow), ci = flow.findIndex(s=>s.k===r.status), nx = SF.NEXT[r.status];
    const canNext = nx && SF.canMove(S.role, r.status, nx);
    const ul = a => (a&&a.length) ? '<ul>'+a.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>' : '<span class="muted">－</span>';
    const fq = SF.FREQ.find(x=>x.k===r.freq);
    let body = '';
    if (S.dtab==='sum') body =
      '<div class="box"><h4>'+ico('i-flag')+'信号の色</h4><div>判定の候補：'+sig(j.c)+'　承認者の決定：'+(r.signalFinal?sig(r.signalFinal):'<span class="muted">未決定</span>')+'</div><ul class="reasons">'+j.reasons.map(x=>'<li><i class="'+x.c+'"></i>'+E(x.t)+'</li>').join('')+'</ul></div>'+
      '<div class="box"><h4>'+ico('i-inbox')+'依頼の中身</h4><dl class="kv">'+
        '<dt>起票者</dt><dd>'+E(r.applicant)+(r.contact?'（'+E(r.contact)+'）':'')+'</dd><dt>部署</dt><dd>'+E(dep?dep.name:'')+'</dd><dt>依頼区分</dt><dd>'+E(r.kind)+'</dd>'+
        '<dt>カタログ</dt><dd>'+(tl?E(tl.name)+' '+sig(tl.c):'<span class="muted">カタログ外</span>')+'</dd>'+
        '<dt>困っていること</dt><dd>'+E(r.problem).replace(/\n/g,'<br>')+'</dd><dt>目的</dt><dd>'+E(r.purpose).replace(/\n/g,'<br>')+'</dd>'+
        '<dt>使う人</dt><dd>'+ul(r.users)+(r.people?'<span class="muted">約 '+E(r.people)+' 人</span>':'')+'</dd><dt>使う場所</dt><dd>'+ul(r.places)+'</dd>'+
        '<dt>作るもの</dt><dd>'+ul(SF.lines(r.scope))+'</dd><dt>今回は作らない</dt><dd>'+ul(SF.lines(r.outScope))+'</dd>'+
        '<dt>合格の条件</dt><dd>'+((r.criteria||[]).length?'<ol>'+r.criteria.map(c=>'<li>'+SF.markVague(c)+(SF.lint(c).ok?'':' <small style="color:#9a6200">△ 書き直しをおすすめ</small>')+'</li>').join('')+'</ol>':'－')+'</dd>'+
        '<dt>扱う情報</dt><dd>'+ul((r.data||[]).map(k=>(SF.DATA.find(x=>x.k===k)||{}).l))+'</dd><dt>関わる相手</dt><dd>'+E(r.parties)+'</dd>'+
        '<dt>守ること</dt><dd>'+ul((r.constraints||[]).concat(SF.lines(r.constraintsOther)))+'</dd><dt>必ず人に聞くこと</dt><dd>'+ul(r.approvals)+'</dd>'+
        '<dt>ものさし</dt><dd><b>'+m.hours+'</b> 時間／月（'+(fq?E(fq.l):'－')+'・1回'+(r.minutes?E(r.minutes)+'分':'－')+'）</dd>'+
        '<dt>承認者</dt><dd>'+E(r.approver)+'</dd><dt>希望時期</dt><dd>'+E(r.wish||'－')+'</dd>'+
        '<dt>添付</dt><dd>'+((r.attachments||[]).length?r.attachments.map(a=>'📎 '+E(a.name)).join('<br>'):'<span class="muted">なし</span>')+'</dd></dl></div>';
    if (S.dtab==='yaml') body = '<div class="box"><h4>'+ico('i-doc')+'注文書（作業指示書）</h4><p class="hint" style="margin-top:0">AIへ渡す前に、人がレビューします。</p><pre class="yaml" style="max-height:none;border-radius:10px">'+E(SF.toYAML(r))+'</pre><div class="data-row" style="margin-top:10px"><button class="btn sm" id="ycp" type="button">'+ico('i-copy')+'コピー</button><button class="btn sm" id="ydl" type="button">'+ico('i-down')+'ダウンロード</button></div></div>';
    if (S.dtab==='log') body =
      '<div class="box"><h4>'+ico('i-chat')+'コメント</h4>'+((r.comments||[]).length?r.comments.map(c=>'<div class="cmt"><small>'+E(SF.fmt(c.at))+'　'+E(c.by)+'</small>'+E(c.text).replace(/\n/g,'<br>')+'</div>').join(''):'<p class="muted">まだありません</p>')+
        '<textarea id="ctx" placeholder="コメントを入力" style="margin-top:8px;min-height:70px"></textarea><div style="text-align:right;margin-top:6px"><button class="btn sm pri" id="cad" type="button">'+ico('i-chat')+'コメントする</button></div></div>'+
      '<div class="box"><h4>'+ico('i-clock')+'変更履歴</h4><ul class="tl">'+r.history.slice().reverse().map((h,i)=>'<li style="animation-delay:'+(i*.04)+'s"><b>'+E(h.action)+'</b><small>'+E(SF.fmt(h.at))+'　'+E(h.by)+'（'+E(h.role)+'）</small>'+(h.note?'<div>'+E(h.note)+'</div>':'')+'</li>').join('')+'</ul></div>';
    $('#drawer').innerHTML =
      '<div class="dh"><div class="r1"><span class="no">'+E(r.id)+'</span>'+st(r.status)+sig(colorOf(r))+(r.signalFinal?'':'<span class="muted" style="font-size:12px">候補</span>')+'<button class="x" id="dx" type="button" title="閉じる">'+ico('i-x')+'</button></div>'+
        '<h3>'+E(r.title)+'</h3><div class="acts">'+
          (nx ? '<button class="btn sm go" id="dnext" type="button"'+(canNext?'':' disabled title="いまの役割ではできません"')+'>'+ico('i-arrow')+'「'+E(SF.statusOf(nx).l)+'」へ進める</button>' : '')+
          '<button class="btn sm" id="dst" type="button">'+ico('i-flag')+'状態を変更</button>'+
          '<button class="btn sm" id="ded" type="button"'+(SF.canEdit(S.role,r)?'':' disabled title="いまの役割・状態では編集できません"')+'>'+ico('i-edit')+'編集</button>'+
          '<button class="btn sm dng" id="ddl" type="button"'+(S.role==='requester'?' disabled title="依頼者は削除できません"':'')+'>'+ico('i-trash')+'削除</button></div>'+
        '<div class="prog'+(ci<0?' off':'')+'">'+flow.map((s,i)=>'<span class="'+(ci<0?'':i<ci?'p':i===ci?'c':'')+'"></span>').join('')+(ci<0?'<span class="c"></span>':'')+'</div><div class="plab"><span>受付</span><span>'+(ci<0?E(SF.statusOf(r.status).l):'')+'</span><span>完了</span></div></div>'+
      '<div class="dtabs">'+[['sum','概要'],['yaml','注文書'],['log','コメント・履歴（'+((r.comments||[]).length)+'）']].map(t=>'<button type="button" data-dt="'+t[0]+'" class="'+(S.dtab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+
      '<div class="db">'+body+'</div>';
    $('#dx').addEventListener('click', closeDrawer);
    $$('[data-dt]').forEach(b=>b.addEventListener('click',()=>{ S.dtab=b.dataset.dt; renderDrawer(); }));
    if ($('#dnext')) $('#dnext').addEventListener('click',()=>openStatus(r, nx));
    $('#dst').addEventListener('click',()=>openStatus(r));
    $('#ded').addEventListener('click',()=>startEdit(r.id));
    $('#ddl').addEventListener('click',()=>confirmBox('削除', r.id+'「'+r.title+'」を削除します。元に戻せません。','削除する',()=>{ S.data.items=S.data.items.filter(x=>x.id!==r.id); persist(); closeDrawer(); toast(r.id+' を削除しました'); render(); }));
    if ($('#ycp')) $('#ycp').addEventListener('click',()=>{ try{ navigator.clipboard.writeText(SF.toYAML(r)).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした',true)); }catch(_){ toast('コピーできませんでした',true); } });
    if ($('#ydl')) $('#ydl').addEventListener('click',()=>SF.download(r.id+'_注文書.yaml', SF.toYAML(r), 'text/yaml') ? toast('ダウンロードしました') : toast('ダウンロードできませんでした', true));
    if ($('#cad')) $('#cad').addEventListener('click',()=>{ const t=$('#ctx').value.trim(); if(!t) return toast('コメントを入力してください',true); const now=SF.nowISO(); r.comments=r.comments||[]; r.comments.push({at:now,by:me().name,text:t}); r.updatedAt=now; persist(); toast('コメントしました'); renderDrawer(); });
  }
  document.addEventListener('keydown', e => { if (e.key==='Escape'){ if ($('#mmask').classList.contains('show')) closeModal(); else if (S.open) closeDrawer(); } });

  /* ---- status modal ---- */
  function openStatus(r, preset){
    const j = SF.judge(r);
    modal(ico('i-flag')+'状態を変更　<span class="muted" style="font-size:12.5px">'+E(r.id)+'</span>',
      '<p style="margin:0 0 10px">いま：'+st(r.status)+'　操作する人：<b>'+E(me().name)+'</b>（'+E(me().l)+'）</p>'+
      '<div class="stopts">'+SF.STATUSES.map(s=>{ const ok=SF.canMove(S.role, r.status, s.k); const sel = ok && s.k===(preset||SF.NEXT[r.status]); return '<label class="'+(ok?'':'dis')+'"><input type="radio" name="ns" value="'+s.k+'"'+(ok?'':' disabled')+(sel?' checked':'')+'>'+st(s.k)+'</label>'; }).join('')+'</div>'+
      '<p class="hint">「承認済み」「完了」にできるのは承認者だけです。</p>'+
      '<div id="apv" style="display:none;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px"><b>信号の色を決める</b> <span class="muted" style="font-size:12.5px">（候補：'+sig(j.c)+'。迷ったら1つ上の色）</span>'+
        '<div class="chips" style="margin-top:8px">'+['g','y','r'].map(c=>'<label class="chip" style="cursor:pointer"><input type="radio" name="fc" value="'+c+'"'+((r.signalFinal||j.c)===c?' checked':'')+' style="margin:0 4px 0 0">'+sig(c)+'</label>').join('')+'</div>'+
        '<div class="redw" id="redw"><label><input type="checkbox" id="redok"> 赤信号の仕事は<b>AIに決めさせません</b>。道具の範囲が「材料集め・表示」までで、決定は人が行うことを確認しました。</label></div></div>'+
      '<label class="fl">メモ<span class="muted" style="font-weight:400;font-size:12px">（差戻し・見送りは必須）</span></label><textarea id="nnote" style="min-height:70px" placeholder="例：合格の条件を数字で書き直してください"></textarea>',
      '<button class="btn" data-x type="button">キャンセル</button><button class="btn pri" id="sok" type="button">'+ico('i-check')+'変更する</button>');
    const upd = () => { const v=($('#modal input[name=ns]:checked')||{}).value, fc=($('#modal input[name=fc]:checked')||{}).value; $('#apv').style.display = v==='approved'?'block':'none'; $('#redw').classList.toggle('show', v==='approved' && fc==='r'); };
    $$('#modal input[name=ns], #modal input[name=fc]').forEach(x=>x.addEventListener('change',upd)); upd();
    $('#sok').addEventListener('click', () => {
      const v=($('#modal input[name=ns]:checked')||{}).value, note=$('#nnote').value.trim();
      if (!v) return toast('変更先を選んでください', true);
      if (['back','hold'].includes(v) && !note) return toast('理由をメモに書いてください', true);
      let extra='';
      if (v==='approved'){ const fc=($('#modal input[name=fc]:checked')||{}).value; if(!fc) return toast('信号の色を選んでください',true); if(fc==='r' && !$('#redok').checked) return toast('赤信号の確認にチェックしてください',true); r.signalFinal=fc; extra='信号の色を「'+SF.COLORS[fc].l+'」に決定'; }
      const now=SF.nowISO(); r.history.push({at:now, by:me().name, role:me().l, action:'状態を「'+SF.statusOf(v).l+'」に変更', note:[extra,note].filter(Boolean).join('／')});
      if (note){ r.comments=r.comments||[]; r.comments.push({at:now,by:me().name,text:note}); }
      r.status=v; r.updatedAt=now; persist(); closeModal(); toast(r.id+' を「'+SF.statusOf(v).l+'」にしました'); S.fresh=r.id; render(); if (S.open) renderDrawer();
    });
  }

  /* ---- modal ---- */
  function modal(t, b, f){ $('#modal').innerHTML='<h3>'+t+'</h3><div class="mbd">'+b+'</div><div class="mft">'+f+'</div>'; $('#mmask').classList.add('show'); $$('#modal [data-x]').forEach(x=>x.addEventListener('click',closeModal)); }
  function closeModal(){ $('#mmask').classList.remove('show'); }
  $('#mmask').addEventListener('click', e => { if (e.target.id==='mmask') closeModal(); });
  function confirmBox(t, msg, ok, fn){ modal(ico('i-alert')+E(t), '<p style="margin:0">'+E(msg)+'</p>', '<button class="btn" data-x type="button">キャンセル</button><button class="btn pri" id="cfok" type="button">'+E(ok)+'</button>'); $('#cfok').addEventListener('click',()=>{ closeModal(); fn(); }); }

  notice(); render();
})();
</script>
</body>
</html>
