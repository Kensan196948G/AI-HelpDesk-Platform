<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIヘルプデスク</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f8fafc;--ink:#18212c;--mute:#5d6977;--line:#dce2e9;--accent:#1d5fc4;--accent-soft:#e6eefb;--ai:#6941c6;--ai-soft:#f1ecfc;--ok:#18794e;--ok-soft:#e3f4ea;--warn:#a1640c;--warn-soft:#fbf0dc;--bad:#c2292e;--bad-soft:#fbe5e5;--chip:#eef1f5;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131a;--panel:#161d26;--panel2:#1b2430;--ink:#e5ebf2;--mute:#93a0af;--line:#2a3441;--accent:#5c9bff;--accent-soft:#1c2c45;--ai:#a88bf0;--ai-soft:#262040;--ok:#4cc38a;--ok-soft:#173326;--warn:#e0a43c;--warn-soft:#352a15;--bad:#f07178;--bad-soft:#3a1d20;--chip:#222b37;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131a;--panel:#161d26;--panel2:#1b2430;--ink:#e5ebf2;--mute:#93a0af;--line:#2a3441;--accent:#5c9bff;--accent-soft:#1c2c45;--ai:#a88bf0;--ai-soft:#262040;--ok:#4cc38a;--ok-soft:#173326;--warn:#e0a43c;--warn-soft:#352a15;--bad:#f07178;--bad-soft:#3a1d20;--chip:#222b37;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif}
h1{font-size:20px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.mt0{margin-top:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.brand small{display:block;color:var(--mute);font-size:11px;line-height:1.3}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--ai));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.topctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.topctl select{width:auto;padding:5px 8px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px;font-size:13.5px}
nav a:hover{background:var(--chip)}nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav .cnt{font-size:11px;min-width:22px;padding:0 6px;border-radius:10px;background:var(--chip);color:var(--mute);text-align:center;font-weight:600}
nav .cnt.hot{background:var(--bad);color:#fff}
nav .sep{height:1px;background:var(--line);margin:8px 6px}
nav .navnote{font-size:11px;color:var(--mute);padding:10px;line-height:1.5}
main{padding:20px 22px 40px;min-width:0}
.sub{color:var(--mute);margin:0 0 16px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g-main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}.g-side{grid-template-columns:minmax(250px,330px) minmax(0,1fr)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;font-size:13px;line-height:1.4}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--chip)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.ai{background:var(--ai);border-color:var(--ai)}
.btn.sm{padding:3px 10px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label.f{flex:1 1 150px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--mute);white-space:nowrap;font-weight:700;line-height:1.7}
.b-ai{background:var(--ai-soft);color:var(--ai)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-acc{background:var(--accent-soft);color:var(--accent)}
.p1{background:var(--bad);color:#fff}.p2{background:var(--warn-soft);color:var(--warn)}.p3{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--panel2);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hint{font-size:12px;color:var(--mute)}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px}
.fs{font-size:11.5px;padding:2px 9px;border-radius:12px;background:var(--chip);color:var(--mute)}
.fs.on{background:var(--accent);color:#fff;font-weight:700}.fs.on.a{background:var(--ai)}.fs.on.h{background:var(--warn);color:#fff}.fs.on.s{background:var(--ok);color:#fff}
.fa{color:var(--mute);font-size:11px}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-top-width:4px;border-radius:10px;padding:10px 10px 8px;cursor:pointer;box-shadow:var(--shadow)}
.stage:hover{border-color:var(--accent)}
.stage .no{font-size:11px;font-weight:700;color:var(--mute)}
.stage .l{font-size:12.5px;font-weight:700;line-height:1.35;min-height:2.7em}
.stage .n{font-size:26px;font-weight:700;line-height:1.2}
.stage .s{font-size:11px;color:var(--mute)}
.stage.c-u{border-top-color:var(--accent)}.stage.c-a{border-top-color:var(--ai)}.stage.c-h{border-top-color:var(--warn)}.stage.c-s{border-top-color:var(--ok)}
.stage:not(:last-child)::after{content:"›";position:absolute;right:-9px;top:42%;color:var(--mute);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:-4px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px;max-height:72vh;overflow:auto;padding:2px}
.li{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:var(--panel)}
.li:hover{border-color:var(--accent)}
.li.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.li .t{font-weight:600;font-size:13px;line-height:1.45}
.li .m{font-size:11px;color:var(--mute);display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:320px;max-height:58vh;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px}
.msg .tx{white-space:pre-wrap;word-break:break-word}
.msg.ai{background:var(--ai-soft);align-self:flex-start;border-top-left-radius:4px}
.msg.user{background:var(--accent-soft);align-self:flex-end;border-top-right-radius:4px}
.msg.sys{align-self:center;color:var(--mute);font-size:12px;padding:0}
.msg .who{font-size:11px;font-weight:700;color:var(--ai);margin-bottom:2px}
.kbcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.kbcard ol{margin:6px 0 4px;padding-left:20px}
.kbcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ai);margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.actions{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.inrow{display:flex;gap:8px;margin-top:10px}.inrow input{flex:1}
pre.box{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12px/1.65 ui-monospace,Menlo,Consolas,monospace;margin:0;max-height:60vh;overflow:auto}
.note{border-radius:8px;padding:8px 11px;font-size:12.5px;margin:8px 0}
.n-warn{background:var(--warn-soft);color:var(--warn)}.n-bad{background:var(--bad-soft);color:var(--bad)}.n-ok{background:var(--ok-soft);color:var(--ok)}.n-ai{background:var(--ai-soft);color:var(--ai)}.n-acc{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--mute);font-size:12px}.kv dd{margin:0}
.tl{list-style:none;padding:0 0 0 2px;margin:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 14px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl small{color:var(--mute)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;z-index:40;overflow:auto;padding:18px 20px}
.drawer.open{transform:none;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal>.card{width:min(720px,100%);max-height:90vh;overflow:auto}
.x{float:right}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.runlist{list-style:none;padding:0;margin:8px 0 14px}
.runlist li{padding:7px 0;border-bottom:1px dashed var(--line);color:var(--mute);display:flex;gap:10px}
.runlist li.done{color:var(--ink)}.runlist li .ic{width:20px;flex:none;text-align:center}
.runlist li.done .ic{color:var(--ok);font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;cursor:pointer}
.chk input{width:auto;margin-top:4px;flex:none}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--accent)}
.barrow{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.empty{color:var(--mute);text-align:center;padding:36px 10px;font-size:13px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-h{font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 4px;letter-spacing:.02em}
.art p{margin:2px 0 8px}.art ol{margin:2px 0 8px;padding-left:20px}
.kwl{display:flex;gap:4px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);font-weight:600;font-size:13px;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ln{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--ink);max-width:100%;line-height:1.7;vertical-align:middle}
.ln:hover{border-color:var(--accent)}
.ln .ty{font:700 11px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);white-space:nowrap}
.ln .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15em}
.ln.t-INC .ty{color:var(--accent)}.ln.t-KB .ty{color:var(--ok)}.ln.t-CI .ty{color:var(--warn)}.ln.t-DR .ty{color:var(--ai)}
.ln .au{font-size:10px;color:var(--mute)}
.ln .rm{border:0;background:none;color:var(--mute);cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.ln .rm:hover{color:var(--bad)}
a.idl{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
.relgrp{margin:6px 0}.relgrp .lab{font-size:11.5px;color:var(--mute);font-weight:700;margin-bottom:3px}
.relgrp .items{display:flex;gap:5px;flex-wrap:wrap}
.linkadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) minmax(0,1fr) auto;gap:6px;margin-top:10px}
.sug{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.relmap{width:100%;height:auto;display:block;margin:4px 0;max-height:280px}
.relmap g.nd{cursor:pointer}.relmap g.nd:hover rect{fill:var(--accent-soft)}
.relmap text{font:11px ui-monospace,Menlo,Consolas,monospace;fill:var(--ink)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12.5px}
.bulk select{width:auto;max-width:230px;padding:4px 8px}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}
input.cb{width:auto}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr)) minmax(0,1.7fr);gap:8px;margin-bottom:10px}
.filters label.f{margin:0}
.statrow{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);align-items:baseline}.statrow b{color:var(--ink);font-size:15px;margin-left:4px}
@media (max-width:1100px){.pipe{grid-template-columns:repeat(4,minmax(0,1fr))}.stage::after{display:none}}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 nav{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:2px}
 nav a{white-space:nowrap;margin:0;flex:none}nav .sep,nav .navnote{display:none}
 .g2,.g-main,.g-side,.cols2{grid-template-columns:1fr}
 .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
 main{padding:14px 16px 40px}.top{position:static}
 .barrow{grid-template-columns:110px 1fr 30px}
 .filters{grid-template-columns:1fr 1fr}.filters label.f:first-child{grid-column:1/-1}
 .linkadd{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">AI</span><div><b>AIヘルプデスク</b><small>インシデント対応・ナレッジ循環 サンプル（オフライン動作）</small></div></div>
  <div class="topctl">
    操作者 <select id="actor" onchange="App.setActor(this.value)"></select>
    <button class="btn ghost sm" onclick="App.exportJSON()">エクスポート</button>
    <button class="btn ghost sm" onclick="document.getElementById('imp').click()">インポート</button>
    <button class="btn ghost sm" onclick="App.reset()">初期化</button>
    <input type="file" id="imp" accept=".json,application/json" hidden onchange="App.importJSON(this)">
  </div>
</header>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="drawer" class="drawer" aria-hidden="true"></div>
<div id="modal" class="modal" onclick="if(event.target===this)App.closeModal()"></div>
<div id="toast"></div>
<datalist id="entlist"></datalist>

<script>
(function(){
'use strict';
/* ===================== 基本ユーティリティ ===================== */
const LS='aihd-sample-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>{if(!t)return '-';const d=new Date(t);return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtFull=t=>{if(!t)return '-';const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const pct=s=>Math.floor(s*100+1e-9)+'%';
const dur=ms=>{const m=Math.max(0,Math.round(ms/60e3));if(m>=1440)return `${Math.floor(m/1440)}日${Math.floor(m%1440/60)}h`;if(m>=60)return `${Math.floor(m/60)}h${pad(m%60)}m`;return `${m}m`};

/* ===================== マスタ ===================== */
const CATS=[
 {k:'account',label:'アカウント・認証',skill:'helpdesk-account',team:'高橋'},
 {k:'mail',label:'メール・Teams',skill:'helpdesk-mail-collab',team:'高橋'},
 {k:'network',label:'ネットワーク・VPN',skill:'helpdesk-network',team:'鈴木'},
 {k:'device',label:'PC・周辺機器',skill:'helpdesk-device',team:'田中'},
 {k:'file',label:'ファイル共有・業務アプリ',skill:'helpdesk-file-apps',team:'田中'},
 {k:'security',label:'セキュリティ',skill:'helpdesk-security-triage',team:'伊藤'},
 {k:'other',label:'その他',skill:'helpdesk-general',team:'佐藤'}
];
const cat=k=>CATS.find(c=>c.k===k)||CATS[6];
const STAFF=[
 {name:'佐藤',role:'L1窓口'},{name:'鈴木',role:'ネットワーク'},{name:'高橋',role:'M365・ID管理'},
 {name:'田中',role:'端末・業務アプリ'},{name:'伊藤',role:'セキュリティ'},
 {name:'渡辺',role:'課長・ナレッジ承認者',approver:true},{name:'山本',role:'ナレッジ管理者・承認者',approver:true}
];
const staff=n=>STAFF.find(s=>s.name===n)||{name:n,role:''};
const isApprover=n=>!!staff(n).approver;
const SLA={P1:60,P2:240,P3:480,P4:4320};
const TST={new:'受付済',ai:'AI対応中',ai_resolved:'AI解決',escalated:'引継ぎ待ち',in_progress:'対応中',resolved:'解決済'};
const TCLS={ai:'b-ai',ai_resolved:'b-ok',escalated:'b-warn',in_progress:'b-acc',resolved:'b-ok'};
const DST={draft:'下書き',review:'承認待ち',returned:'差戻し',approved:'承認・反映済'};

/* ===================== AI検索エンジン（オフライン・疑似AI） =====================
   文字バイグラムのコサイン類似度 ＋ キーワード一致加点 ＋ 有効率による補正。
   実運用では、この search() を Claude / OpenAI API 呼び出し（RAG）に置き換える想定。 */
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s、。，．,.!?！？「」『』（）()\[\]【】・:：;；\/\-_"'“”]/g,'')}
function grams(s){const t=norm(s),g=new Set();for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));if(t.length===1)g.add(t);return g}
function buildIndex(){
 INDEX=state.kb.filter(k=>k.status==='active').map(k=>({id:k.id,g:grams([k.title,k.title,k.symptom,k.keywords.join(' ')].join(' ')),kw:k.keywords.map(norm).filter(w=>w.length>=2)}));
 return INDEX.length;
}
function search(text,limit){
 if(!INDEX)buildIndex();
 const q=grams(text),nt=norm(text);
 return INDEX.map(e=>{
  let inter=0;q.forEach(x=>{if(e.g.has(x))inter++});
  let s=(q.size&&e.g.size)?inter/Math.sqrt(q.size*e.g.size):0;
  const hits=e.kw.filter(w=>nt.includes(w));
  s=s*0.9+Math.min(hits.length*0.12,0.45);
  const k=kbById(e.id);const r=effRate(k);
  if(k.use>=3&&r!=null)s+=(r-0.5)*0.08;
  return {id:e.id,score:Math.max(0,Math.min(s,0.96)),hits};
 }).filter(r=>r.score>0.05).sort((a,b)=>b.score-a.score).slice(0,limit||5);
}
function secCheck(text){
 if(!SEC_WORDS.some(w=>text.includes(w)))return null;
 return SEC_CRIT.some(w=>text.includes(w))?'critical':'suspect';
}
function calcPriority(u,i,sec){
 if(sec==='critical')return 'P1';
 const s=({高:3,中:2,低:1}[u]||2)+({個人:1,部署:2,全社:3}[i]||1);
 let p=s>=6?'P1':s===5?'P2':s===4?'P3':'P4';
 if(sec&&p>'P2')p='P2';
 return p;
}

function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function personTokens(req){return String(req||'').split(/[\s　]+/).filter(w=>w.length>=2&&!/部|課|室|事務所|工区|（|\(|センター|支店/.test(w))}
function maskPII(text,names){
 let s=String(text||'');const f={};
 const rep=(re,label,fn)=>{s=s.replace(re,function(){f[label]=(f[label]||0)+1;return fn?fn.apply(null,arguments):`[${label}]`})};
 rep(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g,'メールアドレス');
 rep(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g,'IPアドレス');
 rep(/0\d{1,4}-\d{1,4}-\d{3,4}/g,'電話番号');
 rep(/(パスワード|password|PW)\s*[:：=]\s*\S+/gi,'秘匿情報',(m,p)=>`${p}：[秘匿情報]`);
 rep(/社員番号\s*[:：]?\s*\d{4,}/g,'社員番号',()=>'社員番号[番号]');
 rep(/\b(?:PC|NB|DT)-?\d{4,}\b/g,'資産番号');
 (names||[]).forEach(n=>{if(n.length>=2)rep(new RegExp(reEsc(n)+'(さん|様|氏)?','g'),'氏名')});
 return {text:s,found:f};
}
function mergeFound(list){const f={};list.forEach(m=>Object.keys(m.found).forEach(k=>{f[k]=(f[k]||0)+m.found[k]}));return Object.keys(f).map(k=>({type:k,count:f[k]}))}
const TERMS=['MFA','Authenticator','多要素認証','Entra ID','Microsoft 365','Outlook','Teams','OneDrive','SharePoint','HENNGE','FortiClient','FortiGate','VPN','Wi-Fi','DirectCloud','SKYSEA','desknet','AppSuite','Active Directory','CAD','BIM','図面','プリンター','複合機','両面印刷','印刷','パスワード','ロック','サインイン','ログイン','証明書','同期エラー','同期','共有リンク','USB','フィッシング','ネットワーク','強制終了','パス','ファイル名'];
const ASTOP=['the','and','web','for','www','http','https','com'];
function extractKw(text){
 const n=String(text||'').normalize('NFKC'),low=n.toLowerCase(),out=[];
 const add=w=>{w=String(w).trim();if(w&&!out.some(o=>o.toLowerCase()===w.toLowerCase()))out.push(w)};
 TERMS.forEach(w=>{if(low.includes(w.toLowerCase()))add(w)});
 (n.match(/[一-龠ァ-ヶー]{1,6}(?:できない|されない|開けない|使えない)/g)||[]).forEach(add);
 (n.match(/[A-Za-z][A-Za-z0-9.\-]{2,}/g)||[]).forEach(w=>{if(!ASTOP.includes(w.toLowerCase()))add(w)});
 (n.match(/[ァ-ヶー]{3,}/g)||[]).forEach(add);
 return out.slice(0,8);
}

function buildHandover(t){
 const L=[];
 L.push(`■ 概要：${t.subject}`);
 L.push(`■ 依頼者：${t.requester}（受付：${t.channel}）`);
 L.push(`■ 優先度：${t.priority}　SLA期限：${fmt(due(t))}`);
 L.push(`■ 引継ぎ理由：${t.handover?t.handover.reason:''}`);
 L.push('■ AI一次対応の経過：');
 const shown=t.aiLog.filter(m=>m.kind==='kb');
 if(shown.length)shown.forEach(m=>{const k=kbById(m.kbId);L.push(`　- ${m.kbId}「${k?k.title:''}」を提示（一致度 ${pct(m.score)}）`)});
 else L.push('　- 承認済みナレッジに該当なし');
 if(t.failedKb&&t.failedKb.length)L.push(`　- 利用者回答：${t.failedKb.join('、')} の手順では解決せず`);
 if(t.extra&&t.extra.length)t.extra.forEach(x=>L.push(`　- 追加情報：${x}`));
 L.push(`■ 推定カテゴリ：${cat(t.cat).label}　推奨担当：${t.suggest}（${staff(t.suggest).role}）`);
 const cis=cisOf(t.id).map(ciById).filter(Boolean);
 if(cis.length)L.push(`■ 対象構成アイテム：${cis.map(c=>`${c.id} ${c.name}（管理：${c.owner}）`).join('、')}`);
 const simOpen=similarTickets(t,0.3).filter(r=>{const x=tk(r.id);return x&&isOpen(x)&&!childrenOf(t.id).includes(r.id)&&parentOf(t.id)!==r.id}).slice(0,2);
 if(simOpen.length)L.push(`■ 類似の未解決インシデント：${simOpen.map(r=>`${r.id}（類似度 ${pct(r.score)}）`).join('、')} → 同一障害の可能性。親子の関連付けを検討`);
 if(parentOf(t.id))L.push(`■ 親インシデント：${parentOf(t.id)}（親の対応状況を確認）`);
 let act='提示済み手順の実施状況をヒアリングし、差分から切り分けを開始';
 if(t.sec)act='端末のネットワーク隔離を確認 → 認証情報の入力有無を確認 → 該当アカウントのパスワードリセット・セッション無効化を検討 → 同報範囲の調査';
 else if(!shown.length)act='新規事象のため、影響範囲（人数・拠点）と発生時刻の確認から切り分けを開始';
 L.push(`■ 推奨アクション：${act}`);
 return L.join('\n');
}
function createDraft(t){
 const names=personTokens(t.requester).concat(STAFF.map(s=>s.name));
 const body=t.body+((t.extra&&t.extra.length)?'\n'+t.extra.join('\n'):'');
 const m1=maskPII(body,names),m2=maskPII(t.subject,names),m3=maskPII(t.resolution.cause,names),m4=maskPII(t.resolution.steps.join('\n'),names);
 const subj=m2.text.replace(/[。．.]$/,'');
 const id='DR-'+String(state.seq.draft++).padStart(3,'0');
 const kwSrc=[m2.text,m1.text,m3.text,m4.text].join(' ');
 return {id,ticketId:t.id,title:subj+'ときの対処',cat:t.cat,symptom:m1.text.replace(/\s+/g,' ').slice(0,180),cause:m3.text,steps:m4.text.split('\n').map(s=>s.trim()).filter(Boolean),keywords:extractKw(kwSrc),target:'',failedKb:(t.failedKb||[]).slice(),applicant:t.resolution.by,createdAt:now(),status:'draft',masked:mergeFound([m1,m2,m3,m4]),reviews:[]};
}
function suggestAssignee(t){return t.sec?'伊藤':cat(t.cat).team}

function kbMsg(t,r){t.activeKb=r.id;if(!t.shown.includes(r.id))t.shown.push(r.id);addLink(t.id,r.id,'kb_presented',{auto:1,by:'AI',note:'一致度 '+pct(r.score)});return {role:'ai',kind:'kb',kbId:r.id,score:r.score,hits:r.hits,text:r.score>=TH_HIGH?'次のナレッジで解決できる可能性が高いです。手順をお試しください。':'近いナレッジが見つかりました。この手順をお試しください。'}}

function runTriage(t){
 const msgs=[];
 msgs.push({role:'sys',text:`チケット ${t.id} を受け付けました（優先度 ${t.priority}）`});
 const text=t.subject+' '+t.body;
 let after=null;
 if(t.sec){
  t.cat='security';
  msgs.push({role:'ai',kind:'sec',text:'セキュリティインシデントの可能性を検知しました。Skill「helpdesk-security-triage」のルールにより、AIでの自己解決は行わず、セキュリティ担当へ即時に引き継ぎます。'});
  msgs.push({role:'ai',kind:'steps',title:'今すぐ行ってください（初動対応）',steps:SEC_STEPS});
  after=()=>escalate(t,t.sec==='critical'?'セキュリティ事象を検知（被害の可能性あり・自動エスカレーション）':'セキュリティ事象の疑いを検知（自動エスカレーション）',true);
 }else{
  const r=search(text,4);
  if(r[0]&&r[0].score>=TH_LOW&&t.cat==='other'){t.cat=kbById(r[0].id).cat;msgs.push({role:'ai',text:`内容からカテゴリを「${cat(t.cat).label}」と推定しました。`})}
  if(r[0]&&r[0].score>=TH_HIGH){
   msgs.push(kbMsg(t,r[0]));
   t.candidates=r.slice(1).filter(x=>x.score>=TH_LOW).map(x=>x.id);
   relatedKbs(r[0].id).forEach(k=>{const kk=kbById(k);if(kk&&kk.status==='active'&&!t.candidates.includes(k))t.candidates.push(k)});
  }else if(r[0]&&r[0].score>=TH_LOW){
   const c=r.filter(x=>x.score>=TH_LOW).slice(0,3);
   msgs.push({role:'ai',kind:'cands',text:'確度の高い回答は見つかりませんでしたが、近いナレッジ候補があります。症状に近いものを選んでください。',cands:c.map(x=>({id:x.id,score:x.score}))});
   t.candidates=[];
  }else{
   msgs.push({role:'ai',text:'承認済みナレッジに該当する事例が見つかりませんでした。新しい事象の可能性があるため、担当者へ引き継ぎます。'});
   after=()=>escalate(t,'ナレッジ該当なし',true);
  }
 }
 play(t,msgs,after);
}
function play(t,msgs,after){
 busy.add(t.id);refreshFor(t);
 let i=0;
 const step=()=>{
  if(i<msgs.length){const m=Object.assign({},msgs[i],{t:now()});t.aiLog.push(m);i++;refreshFor(t);setTimeout(step,650)}
  else{busy.delete(t.id);save();if(after)after();else render()}
 };
 setTimeout(step,450);
}
function refreshFor(t){if(ui.view==='ai'&&ui.sel.ai===t.id)render();else renderNav()}

function escalate(t,reason,byAi){
 t.status='escalated';t.escalatedAt=now();t.suggest=suggestAssignee(t);
 t.handover={reason,at:now()};t.handover.summary=buildHandover(t);
 t.aiLog.push({role:'ai',text:`担当者へ引き継ぎます。ここまでの経過はAIが要約して担当者に渡すので、同じ説明を繰り返す必要はありません。\n推奨担当：${t.suggest}（${staff(t.suggest).role}）　SLA期限：${fmt(due(t))}`,t:now()});
 t.aiLog.push({role:'sys',text:'人間の担当者へ引継ぎ（③ 引継ぎキュー）',t:now()});
 hist(t,'人間へ引継ぎ：'+reason,byAi?'AI':state.actor);
 audit('人間へ引継ぎ',t.id,reason);save();render();
 toast(`${t.id} を人間の担当者へ引き継ぎました`);
}

function publish(d,approver,comment,checks){
 const T=now();let kb,action,from=null;
 if(d.target&&kbById(d.target)){
  kb=kbById(d.target);from=kb.version;action='改訂';
  const p=kb.version.split('.');const nv=p[0]+'.'+(Number(p[1]||0)+1);
  const oldCat=kb.cat;
  Object.assign(kb,{title:d.title,cat:d.cat,symptom:d.symptom,cause:d.cause,steps:d.steps.slice(),keywords:d.keywords.slice(),version:nv,updatedAt:T,approvedBy:approver,approvedAt:T,status:'active'});
  kb.history.push({ver:nv,at:T,by:approver,note:`${d.id}（${d.ticketId}）により改訂`});
  if(oldCat!==d.cat){state.skills[oldCat].minor++;state.skills[oldCat].updatedAt=T}
 }else{
  action='新規';
  kb={id:'KB-'+state.seq.kb++,cat:d.cat,title:d.title,symptom:d.symptom,cause:d.cause,steps:d.steps.slice(),keywords:d.keywords.slice(),version:'1.0',status:'active',author:d.applicant,approvedBy:approver,approvedAt:T,updatedAt:T,use:0,helpful:0,notHelpful:0,sources:[],history:[{ver:'1.0',at:T,by:approver,note:`${d.id}（${d.ticketId}）から新規作成`}]};
  state.kb.push(kb);
 }
 if(!kb.sources.includes(d.ticketId))kb.sources.push(d.ticketId);
 addLink(d.ticketId,kb.id,'kb_source',{auto:1,by:approver});
 cisOf(d.ticketId).forEach(c=>addLink(kb.id,c,'ci_kb',{auto:1,by:approver,note:'元チケットから継承'}));
 d.status='approved';d.kbId=kb.id;d.approvedAt=T;d.reviews.push({by:approver,at:T,result:'承認',comment,checks});
 const t=tk(d.ticketId);if(t){t.kbId=kb.id;hist(t,`ナレッジ ${kb.id} v${kb.version} として承認・反映`,approver)}
 const sk=state.skills[kb.cat];const sFrom='1.'+sk.minor;sk.minor++;sk.updatedAt=T;
 const n=buildIndex();
 const rec={t:T,kbId:kb.id,ver:kb.version,skill:sk.name,skillVer:'1.'+sk.minor,indexSize:n,by:approver,action};
 state.reflect.unshift(rec);
 audit('承認',d.id,`${kb.id} v${kb.version}（${action}）`);
 audit('DB保存・AI/Skills反映',kb.id,`${sk.name} v${sFrom}→v1.${sk.minor}／検索インデックス ${n}件`);
 save();
 return {kb,action,from,sFrom,sTo:'1.'+sk.minor,skill:sk.name,n};
}

function aiPanel(t){
 const canAct=t.status==='ai'&&!busy.has(t.id);
 const msgs=t.aiLog.map(m=>{
  if(m.role==='sys')return `<div class="msg sys">— ${esc(m.text)} —</div>`;
  if(m.role==='user')return `<div class="msg user"><span class="tx">${linkify(esc(m.text))}</span></div>`;
  let inner=m.text?`<span class="tx">${linkify(esc(m.text))}</span>`:'';
  if(m.kind==='kb'){const k=kbById(m.kbId);if(k)inner+=kbCard(k,m.score)}
  if(m.kind==='steps')inner+=`<div class="kbcard"><b>${esc(m.title)}</b><ol>${m.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="hint">Skill helpdesk-security-triage の初動ルール</div></div>`;
  if(m.kind==='cands')inner+=m.cands.map(c=>{const k=kbById(c.id);if(!k)return '';return `<div class="kbcard"><div class="hd"><b>${linkify(k.id)}　${esc(k.title)}</b><span class="badge b-ai">一致度 ${pct(c.score)}</span></div><div class="hint" style="margin:4px 0 6px">${esc(k.symptom)}</div>${canAct?`<button class="btn ai sm" onclick="App.pickCand('${t.id}','${k.id}')">この手順を試す</button>`:''}</div>`}).join('');
  return `<div class="msg ai"><div class="who">AIアシスタント</div>${inner}</div>`;
 }).join('');
 const typing=busy.has(t.id)?'<div class="msg ai"><div class="who">AIアシスタント</div><div class="typing"><span></span><span></span><span></span></div></div>':'';
 let foot='';
 if(canAct){
  foot=`<div class="actions"><div class="btns">${t.activeKb?`<button class="btn ok" onclick="App.aiYes('${t.id}')">✔ この手順で解決した</button><button class="btn bad" onclick="App.aiNo('${t.id}')">✖ 解決しない → 担当者へ引継ぎ</button>`:`<button class="btn" onclick="App.escalateManual('${t.id}')">担当者へ引き継ぐ</button>`}${t.candidates&&t.candidates.length?`<button class="btn ghost" onclick="App.nextCand('${t.id}')">他の候補を見る（${t.candidates.length}）</button>`:''}</div>
  <div class="inrow"><input id="addinfo" placeholder="追加情報を入力（例：表示されたエラーメッセージ）" onkeydown="if(event.key==='Enter'&&!event.isComposing)App.addInfo('${t.id}')"><button class="btn ghost" onclick="App.addInfo('${t.id}')">送信</button></div></div>`;
 }else if(t.status==='ai_resolved'){
  foot=`<div class="note n-ok">AI一次対応で解決しました。${t.aiResolvedKb} の有効回数に加算され、今後の回答順位に反映されます。</div>`;
 }else if(t.status==='escalated'||t.status==='in_progress'){
  foot=`<div class="note n-warn">人間の担当者へ引き継ぎ済みです（${TST[t.status]}${t.assignee?'：'+esc(t.assignee):''}）。<button class="btn sm" style="margin-left:6px" onclick="App.go('queue','${t.id}')">③ 引継ぎキューで開く</button></div>`;
 }else if(t.status==='resolved'){
  foot=`<div class="note n-ok">担当者が解決済みです。${t.draftId?`<button class="btn sm" style="margin-left:6px" onclick="App.go('draft','${t.draftId}')">ナレッジ下書きを見る</button>`:''}</div>`;
 }
 return `<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 class="mt0" style="margin-bottom:4px">${esc(t.subject)}</h2><div class="btns"><span class="mono hint">${t.id}</span>${pb(t.priority)}${sb(t.status)}<span class="badge">${esc(cat(t.cat).label)}</span>${slaBadge(t)}</div></div><button class="btn ghost sm" onclick="App.open('${t.id}')">詳細</button></div>
 <div class="hint" style="margin:8px 0 10px;white-space:pre-wrap">${esc(t.requester)}：${esc(t.body)}</div>
 <div class="chat" id="chat">${msgs}${typing}</div>${foot}`;
}

 return head+ret+fail+maskNote(d)+`

 </div>
 <div class="card" style="margin-top:14px"><h2>反映ログ</h2><div class="tbl"><table><thead><tr><th>日時</th><th>ナレッジ</th><th>種別</th><th>Skill</th><th>インデックス</th><th>承認者</th></tr></thead><tbody>
 ${state.reflect.map(r=>`<tr><td>${fmtFull(r.t)}</td><td class="mono">${linkify(r.kbId)} v${r.ver}</td><td>${esc(r.action)}</td><td class="mono">${esc(r.skill)} v${r.skillVer}</td><td>${r.indexSize}件</td><td>${esc(r.by)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">まだありません</td></tr>'}

function relMd(k){
 const ci=cisOf(k.id).map(ciById).filter(Boolean).map(c=>c.name);
 const rk=relatedKbs(k.id).filter(x=>{const kk=kbById(x);return kk&&kk.status==='active'});
 return (ci.length?`- 対象構成アイテム: ${ci.join(', ')}\n`:'')+(rk.length?`- 関連ナレッジ: ${rk.join(', ')}（この手順で解決しない場合の次の候補）\n`:'');
}
function skillMd(c){
 const s=state.skills[c.k];const items=state.kb.filter(k=>k.cat===c.k&&k.status==='active');
 const rules=['承認済みナレッジ（本ファイル）だけを根拠に回答する。記載のない手順を推測で案内しない','一致度 '+pct(TH_HIGH)+' 以上で手順を提示、'+pct(TH_LOW)+'〜'+pct(TH_HIGH)+' は候補提示、'+pct(TH_LOW)+' 未満は人間へ引き継ぐ','利用者が「解決しない」と回答したら、経過を要約して人間へ引き継ぐ','パスワード・個人情報をチャットに入力させない','関連ナレッジが登録されている場合は、提示した手順で解決しないときの次の候補として提示する'];
 if(c.k==='account')rules.push('本人確認が必要な操作（MFA再登録・ロック解除・パスワードリセット）はAIが実行せず、手順案内と引継ぎのみ行う');
 if(c.k==='security'){rules.length=0;rules.push('セキュリティ事象はAIで自己解決しない。必ず初動手順を案内し、即時にセキュリティ担当へ引き継ぐ','被害の可能性（開封・入力・感染・紛失）がある場合は優先度P1とする','初動手順：'+SEC_STEPS.join('／'))}
 let md=`---\nname: ${c.skill}\ndescription: 「${c.label}」の問い合わせに対するAI一次対応。承認済みナレッジ${items.length}件に基づき手順を提示し、解決しない場合は人間へ引き継ぐ。\nversion: 1.${s.minor}\nupdated: ${fmtFull(s.updatedAt)}\n---\n\n# ${c.label} 一次対応スキル\n\n## ルール\n${rules.map(r=>'- '+r).join('\n')}\n\n## 承認済みナレッジ（${items.length}件）\n`;
 if(!items.length)md+='\n（まだありません）\n';
 items.forEach(k=>{md+=`\n### ${k.id} ${k.title}（v${k.version}）\n- 症状: ${k.symptom}\n- 原因: ${k.cause}\n- キーワード: ${k.keywords.join(', ')}\n- 手順:\n${k.steps.map((x,i)=>`  ${i+1}. ${x}`).join('\n')}\n${relMd(k)}- 承認: ${k.approvedBy}（${fmtFull(k.approvedAt)}）\n`});
 return md;
}

/* ===================== 関連付けUI部品 ===================== */
function chip(id,o){
 o=o||{};const ty=typeOf(id),l=o.link,nm=entTitle(id);
 const tip=nm+(l?`\n${l.auto?'自動':'手動'}／${l.by}／${fmtFull(l.at)}${l.note?'／'+l.note:''}`:'');
 return `<span class="ln t-${ty}" title="${esc(tip)}" onclick="event.stopPropagation();App.ent('${id}')"><span class="ty">${id}</span>${o.short?'':`<span class="nm">${esc(nm)}</span>`}${l&&l.auto?'<span class="au">·自動</span>':''}${o.edit&&l&&!l.auto?`<button class="rm" title="関連付けを解除" onclick="event.stopPropagation();App.unlink('${l.id}')">×</button>`:''}</span>`;
}
function relList(id,edit){
 const ls=linksOf(id).filter(x=>entExists(x.other));
 if(!ls.length)return '<div class="hint">関連付けはまだありません</div>';
 const g={};ls.forEach(x=>{(g[x.label]=g[x.label]||[]).push(x)});
 return Object.keys(g).map(k=>`<div class="relgrp"><div class="lab">${esc(k)}（${g[k].length}）</div><div class="items">${g[k].map(x=>chip(x.other,{link:x.l,edit})).join('')}</div></div>`).join('');
}
function relMap(id){
 const ls=linksOf(id).filter(x=>entExists(x.other));if(!ls.length)return '';
 const g={};ls.forEach(x=>{(g[x.other]=g[x.other]||[]).push(x.label)});
 const all=Object.keys(g),ids=all.slice(0,14),n=ids.length,W=460,H=n>8?270:n>3?230:170,cx=W/2,cy=H/2,rx=W/2-52,ry=H/2-22;
 const col=t=>({INC:'var(--accent)',KB:'var(--ok)',CI:'var(--warn)',DR:'var(--ai)'}[t]||'var(--mute)');
 const pos=ids.map((o,i)=>{const a=-Math.PI/2+(i+(n%2?0:0.5))*2*Math.PI/n;return {o,x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}});
 const node=(o,x,y,c)=>{const w=o.length*7+18;return `<g class="nd" onclick="App.ent('${o}')"><title>${esc(o+' '+entTitle(o))}${g[o]?'\n'+esc(g[o].join('／')):''}</title><rect x="${(x-w/2).toFixed(1)}" y="${(y-11).toFixed(1)}" width="${w}" height="22" rx="11" fill="var(--panel)" stroke="${col(typeOf(o))}" stroke-width="${c?2.6:1.5}"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-weight="${c?700:400}">${o}</text></g>`};
 return `<svg class="relmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(id)} の関連マップ">${pos.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="${col(typeOf(p.o))}" stroke-opacity=".45" stroke-width="1.5"><title>${esc(g[p.o].join('／'))}</title></line>`).join('')}${pos.map(p=>node(p.o,p.x,p.y)).join('')}${node(id,cx,cy,true)}</svg>
 <div class="legend" style="margin:0 0 4px"><span><i style="background:var(--accent)"></i>インシデント</span><span><i style="background:var(--ok)"></i>ナレッジ</span><span><i style="background:var(--warn)"></i>構成アイテム</span><span><i style="background:var(--ai)"></i>下書き</span>${all.length>n?`<span>ほか ${all.length-n}件は下の一覧</span>`:''}</div>`;
}
function aiSuggest(id){
 const t=tk(id);const have=new Set(linksOf(id).map(x=>x.other));const out=[];
 similarTickets(t,0.25).filter(r=>!have.has(r.id)).slice(0,3).forEach(r=>{const x=tk(r.id);out.push(`<div class="sug">${chip(r.id)}<span class="badge b-ai">類似 ${pct(r.score)}</span><button class="btn ghost sm" onclick="App.linkQuick('${id}','${r.id}','related')">関連</button>${isOpen(x)&&isOpen(t)&&x.createdAt<t.createdAt?`<button class="btn ghost sm" onclick="App.linkQuick('${r.id}','${id}','parent')">相手を親にする</button>`:''}<button class="btn ghost sm" onclick="App.linkQuick('${id}','${r.id}','duplicate')">これは重複</button></div>`)});
 search(t.subject+' '+t.body,3).filter(r=>r.score>=TH_LOW&&!have.has(r.id)).slice(0,2).forEach(r=>out.push(`<div class="sug">${chip(r.id)}<span class="badge b-ai">一致 ${pct(r.score)}</span><button class="btn ghost sm" onclick="App.linkQuick('${id}','${r.id}','kb_used')">参照ナレッジにする</button></div>`));
 detectCIs(t.subject+' '+t.body+' '+((t.resolution||{}).cause||'')).filter(c=>!have.has(c)).forEach(c=>out.push(`<div class="sug">${chip(c)}<button class="btn ghost sm" onclick="App.linkQuick('${id}','${c}','ci_affects')">構成アイテムに紐付け</button></div>`));
 return out.length?`<div class="sec-h">AIによる関連候補（確定は人間）</div>${out.join('')}`:'';
}

/* ===================== 構成管理（CMDB） ===================== */
function dependents(id,seen){seen=seen||new Set();inIds(id,'ci_dep').forEach(x=>{if(!seen.has(x)&&x!==id){seen.add(x);dependents(x,seen)}});return seen}
function dependsOn(id,seen){seen=seen||new Set();outIds(id,'ci_dep').forEach(x=>{if(!seen.has(x)&&x!==id){seen.add(x);dependsOn(x,seen)}});return seen}
V.cmdb=function(){
 const C=ui.cmdb,tabs=[['list',`構成アイテム一覧（${state.cis.length}）`],['impact','依存関係・影響範囲']];
 const openCis=state.cis.filter(c=>inIds(c.id,'ci_affects').some(id=>{const x=tk(id);return x&&isOpen(x)}));
 return `<h1>構成管理（CMDB）</h1><p class="sub">サービス・システム・機器などの構成アイテムと、その依存関係を管理します。インシデントとナレッジは構成アイテムに紐付き、影響範囲の把握と引継ぎメモに使われます。</p>
 <div class="kpis"><div class="card kpi"><div class="l">構成アイテム</div><div class="v">${state.cis.length}</div></div><div class="card kpi"><div class="l">未解決インシデントを抱える構成アイテム</div><div class="v" style="color:${openCis.length?'var(--warn)':'inherit'}">${openCis.length}</div><div class="hint">${openCis.map(c=>c.id).join('、')||'なし'}</div></div><div class="card kpi"><div class="l">依存関係</div><div class="v">${state.links.filter(l=>l.rel==='ci_dep').length}</div></div><div class="card kpi"><div class="l">構成アイテムに紐付いたナレッジ</div><div class="v">${new Set(state.links.filter(l=>l.rel==='ci_kb').map(l=>l.a)).size}</div></div></div>
 <div class="tabs">${tabs.map(t=>`<div class="tab ${C.tab===t[0]?'on':''}" onclick="App.cmdbTab('${t[0]}')">${t[1]}</div>`).join('')}</div>`+(C.tab==='impact'?cmdbImpact():dbCi());
};
function cmdbImpact(){
 const C=ui.cmdb,c=ciById(C.sel)||state.cis[0];C.sel=c.id;
 const down=[...dependents(c.id)],up=[...dependsOn(c.id)];
 const row=(id,role)=>{const x=ciById(id);if(!x)return '';const inc=inIds(id,'ci_affects').map(tk).filter(Boolean),op=inc.filter(isOpen);return `<tr><td>${chip(id)}</td><td>${role}</td><td>${esc(x.type)}</td><td>${esc(x.owner)}</td><td>${op.length?op.map(t=>chip(t.id,{short:1})).join(' '):'<span class="hint">なし</span>'}</td><td>${inIds(id,'ci_kb').map(k=>chip(k,{short:1})).join(' ')||'<span class="hint">なし</span>'}</td></tr>`};
 const allOpen=[c.id,...down].reduce((a,id)=>a+inIds(id,'ci_affects').map(tk).filter(t=>t&&isOpen(t)).length,0);
 const deps=state.links.filter(l=>l.rel==='ci_dep');
 return `<div class="grid g-main">
 <div class="card">
  <div class="row" style="align-items:flex-end"><label class="f" style="flex:1 1 260px">影響を調べる構成アイテム<select onchange="App.cmdbSel(this.value)">${state.cis.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.id} ${esc(x.name)}</option>`).join('')}</select></label></div>
  <div class="note ${down.length?'n-warn':'n-ok'}"><b>${esc(c.name)}</b> が停止・障害になった場合、依存している構成アイテム <b>${down.length}件</b> に影響が及ぶ可能性があります（関連する未解決インシデント ${allOpen}件）。</div>
  <div class="tbl"><table><thead><tr><th>構成アイテム</th><th>関係</th><th>種別</th><th>管理担当</th><th>未解決インシデント</th><th>関連ナレッジ</th></tr></thead><tbody>
  ${row(c.id,'<b>対象</b>')}${down.map(id=>row(id,outIds(id,'ci_dep').includes(c.id)?'直接依存':'間接依存')).join('')}
  </tbody></table></div>
  ${up.length?`<h3>この構成アイテムが依存しているもの（原因側の候補）</h3><div class="items" style="display:flex;gap:5px;flex-wrap:wrap">${up.map(id=>chip(id)).join('')}</div><div class="hint" style="margin-top:4px">障害の原因が依存先にある場合もあります。依存先の未解決インシデントも確認してください。</div>`:''}
 </div>
 <div class="card"><h2>関連マップ</h2>${relMap(c.id)||'<div class="hint">関連付けはまだありません</div>'}<div class="btns" style="margin-top:8px"><button class="btn ghost sm" onclick="App.ent('${c.id}')">詳細・関連付けを編集</button><button class="btn ghost sm" onclick="App.dbFilterCi('${c.id}')">インシデントDBで表示</button></div></div>
 </div>
 <div class="card" style="margin-top:14px"><h2>依存関係の一覧（${deps.length}）</h2><div class="hint" style="margin-bottom:8px">依存関係は、構成アイテムの詳細画面の「関連付け」で追加・解除できます。</div>
 <div class="tbl"><table><thead><tr><th>依存元</th><th></th><th>依存先</th><th>登録者</th><th>日時</th><th>メモ</th><th></th></tr></thead><tbody>
 ${deps.map(l=>`<tr><td>${chip(l.a)}</td><td class="hint">→ 依存</td><td>${chip(l.b)}</td><td>${esc(l.by)}</td><td style="white-space:nowrap">${fmt(l.at)}</td><td>${esc(l.note)}</td><td>${l.auto?'':`<button class="btn ghost sm" onclick="App.unlink('${l.id}')">解除</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">依存関係はまだありません</td></tr>'}
 </tbody></table></div></div>`;
}
function dbRows(){
 const D=ui.db,q=norm(D.q);
 const r=state.tickets.filter(t=>{
  if(D.st&&(D.st==='open'?!isOpen(t):t.status!==D.st))return false;
  if(D.cat&&t.cat!==D.cat)return false;
  if(D.pr&&t.priority!==D.pr)return false;
  if(D.as&&(t.assignee||'')!==D.as)return false;
  if(D.ci&&!cisOf(t.id).includes(D.ci))return false;
  if(D.from&&t.createdAt<new Date(D.from+'T00:00:00').getTime())return false;
  if(D.to&&t.createdAt>new Date(D.to+'T23:59:59').getTime())return false;
  if(D.rel&&!linksOf(t.id).some(x=>typeOf(x.other)==='INC'))return false;
  if(q&&!norm([t.id,t.subject,t.body,t.requester,(t.resolution||{}).cause||''].join(' ')).includes(q))return false;
  return true;
 });
 const PR={P1:1,P2:2,P3:3,P4:4},key={id:t=>t.id,createdAt:t=>t.createdAt,priority:t=>PR[t.priority],status:t=>t.status,resolvedAt:t=>t.resolvedAt||t.closedAt||0};
 const f=key[D.sort]||key.createdAt;
 return r.sort((a,b)=>{const x=f(a),y=f(b);return (x>y?1:x<y?-1:0)*D.dir||b.createdAt-a.createdAt});
}
function dbInc(){
 const D=ui.db,rows=dbRows();D.sel=D.sel.filter(id=>tk(id));const sel=D.sel;
 const done=rows.filter(t=>t.resolvedAt||t.closedAt),avg=done.length?done.reduce((a,t)=>a+((t.resolvedAt||t.closedAt)-t.createdAt),0)/done.length:0;
 const opt=(v,l,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${esc(l)}</option>`;
 const th=(k,l)=>`<th class="sort" onclick="App.dbSort('${k}')">${l}${D.sort===k?(D.dir>0?' ▲':' ▼'):''}</th>`;
 const allOn=rows.length&&rows.every(t=>sel.includes(t.id));
 const kbOf=id=>[...new Set(outIds(id,'kb_source').concat(outIds(id,'kb_resolved'),outIds(id,'kb_used')))];
 return `<div class="card">
 <div class="filters">
  <label class="f">キーワード<input id="db_q" value="${esc(D.q)}" placeholder="ID・件名・内容・依頼者・原因" oninput="App.dbF('q',this.value,true)"></label>
  <label class="f">状態<select onchange="App.dbF('st',this.value)">${opt('','すべて',D.st)}${opt('open','未解決（すべて）',D.st)}${Object.keys(TST).filter(k=>k!=='new').map(k=>opt(k,TST[k],D.st)).join('')}</select></label>
  <label class="f">カテゴリ<select onchange="App.dbF('cat',this.value)">${opt('','すべて',D.cat)}${CATS.map(c=>opt(c.k,c.label,D.cat)).join('')}</select></label>
  <label class="f">優先度<select onchange="App.dbF('pr',this.value)">${opt('','すべて',D.pr)}${['P1','P2','P3','P4'].map(p=>opt(p,p,D.pr)).join('')}</select></label>
  <label class="f">担当<select onchange="App.dbF('as',this.value)">${opt('','すべて',D.as)}${STAFF.filter(s=>!s.approver).map(s=>opt(s.name,s.name,D.as)).join('')}</select></label>
  <label class="f">構成アイテム<select onchange="App.dbF('ci',this.value)">${opt('','すべて',D.ci)}${state.cis.map(c=>opt(c.id,c.id+' '+c.name,D.ci)).join('')}</select></label>
  <label class="f">受付日（から〜まで）<span style="display:flex;gap:4px;margin-top:3px"><input type="date" value="${D.from}" onchange="App.dbF('from',this.value)" aria-label="受付日から"><input type="date" value="${D.to}" onchange="App.dbF('to',this.value)" aria-label="受付日まで"></span></label>
 </div>
 <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
  <div class="statrow"><span>該当<b>${rows.length}</b>件</span><span>未解決<b>${rows.filter(isOpen).length}</b></span><span>AI解決<b>${rows.filter(t=>t.status==='ai_resolved').length}</b></span><span>平均解決時間<b>${done.length?dur(avg):'-'}</b></span></div>
  <div class="btns"><label class="chk" style="padding:0"><input type="checkbox" ${D.rel?'checked':''} onchange="App.dbF('rel',this.checked)">インシデント間の関連があるものだけ</label><button class="btn ghost sm" onclick="App.dbReset()">条件クリア</button><button class="btn ghost sm" onclick="App.dbCsv()">CSVエクスポート</button></div>
 </div>
 ${sel.length?bulkBar(sel):'<div class="hint" style="margin-bottom:8px">行頭のチェックで複数選択すると、まとめて親子・関連・構成アイテムを紐付けできます。</div>'}
 <div class="tbl"><table><thead><tr><th><input type="checkbox" class="cb" aria-label="すべて選択" ${allOn?'checked':''} onchange="App.dbSelAll(this.checked)"></th>${th('id','ID')}<th>件名</th><th>カテゴリ</th><th>構成アイテム</th>${th('priority','優先度')}${th('status','状態')}<th>担当</th>${th('createdAt','受付')}${th('resolvedAt','解決')}<th>ナレッジ</th><th>関連</th></tr></thead><tbody>
 ${rows.length?rows.map(t=>{const par=parentOf(t.id),kids=childrenOf(t.id),rel=linksOf(t.id).filter(x=>typeOf(x.other)==='INC'&&x.l.rel!=='parent').length;return `<tr class="click" onclick="App.open('${t.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" class="cb" aria-label="${t.id}を選択" ${sel.includes(t.id)?'checked':''} onchange="App.dbSel('${t.id}',this.checked)"></td><td class="mono">${t.id}</td><td>${esc(t.subject)}${par?`<div class="hint">↳ 親 ${chip(par,{short:1})}</div>`:''}${kids.length?`<div class="hint">親インシデント（子 ${kids.length}件）</div>`:''}</td><td>${esc(cat(t.cat).label)}</td><td>${cisOf(t.id).map(c=>chip(c,{short:1})).join(' ')}</td><td>${pb(t.priority)}</td><td>${sb(t.status)}</td><td>${esc(t.assignee||(t.status==='ai_resolved'?'AI':'-'))}</td><td style="white-space:nowrap">${fmt(t.createdAt)}</td><td style="white-space:nowrap">${fmt(t.resolvedAt||t.closedAt)}</td><td>${kbOf(t.id).map(k=>chip(k,{short:1})).join(' ')}</td><td>${rel?`<span class="badge b-acc">${rel}</span>`:''}</td></tr>`}).join(''):'<tr><td colspan="12" class="empty">条件に一致するインシデントはありません</td></tr>'}
 </tbody></table></div></div>`;
}
function bulkBar(sel){
 const first=sel.map(tk).filter(Boolean).sort((a,b)=>a.createdAt-b.createdAt)[0];
 return `<div class="bulk"><b>${sel.length}件を選択中</b>
 <button class="btn sm" ${sel.length<2?'disabled':''} onclick="App.bulk('related')">相互に関連付け</button>
 <span>親：<select id="bk_par" aria-label="親インシデント">${state.tickets.map(t=>`<option value="${t.id}" ${first&&t.id===first.id?'selected':''}>${t.id} ${esc(t.subject.slice(0,16))}</option>`).join('')}</select></span><button class="btn sm" onclick="App.bulk('parent')">選択を子として紐付け</button>
 <span>構成アイテム：<select id="bk_ci" aria-label="構成アイテム">${state.cis.map(c=>`<option value="${c.id}">${c.id} ${esc(c.name.slice(0,16))}</option>`).join('')}</select></span><button class="btn sm" onclick="App.bulk('ci')">紐付け</button>
 <button class="btn ghost sm" onclick="App.dbSelAll(false)">選択解除</button></div>`;
}
function dbCi(){
 return `<div class="card"><div class="tbl"><table><thead><tr><th>ID</th><th>名称</th><th>種別</th><th>管理担当</th><th>未解決</th><th>累計インシデント</th><th>関連ナレッジ</th><th>依存先</th><th></th></tr></thead><tbody>
 ${state.cis.map(c=>{const inc=inIds(c.id,'ci_affects').map(tk).filter(Boolean),op=inc.filter(isOpen).length;return `<tr class="click" onclick="App.ent('${c.id}')"><td class="mono">${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${esc(c.owner)}</td><td>${op?`<span class="badge b-warn">${op}</span>`:'0'}</td><td>${inc.length}</td><td>${inIds(c.id,'ci_kb').length}</td><td>${outIds(c.id,'ci_dep').map(d=>chip(d)).join(' ')}</td><td onclick="event.stopPropagation()"><button class="btn ghost sm" onclick="App.cmdbSel('${c.id}')">影響範囲</button></td></tr>`}).join('')}
 </tbody></table></div>
 <h3>構成アイテムを追加</h3>
 <div class="row"><label class="f">名称<input id="ci_n" placeholder="例：勤怠管理システム"></label><label class="f">種別<select id="ci_t">${CI_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label><label class="f">管理担当<select id="ci_o">${STAFF.filter(s=>!s.approver).map(s=>`<option>${s.name}</option>`).join('')}</select></label><label class="f" style="flex:2 1 240px">判定キーワード（カンマ区切り）<input id="ci_k" placeholder="例：勤怠, 打刻"></label></div>
 <div class="btns"><button class="btn" onclick="App.addCi()">追加</button><span class="hint">追加すると、既存の記録と今後の問い合わせをキーワードでAIが自動的に紐付けます。</span></div></div>`;
}
function dbLinks(){
 const D=ui.db,ls=state.links.filter(l=>!D.lrel||l.rel===D.lrel).slice().sort((a,b)=>b.at-a.at);
 return `<div class="card"><div class="row" style="align-items:flex-end;justify-content:space-between;margin-bottom:8px"><label class="f" style="flex:0 1 300px;margin:0">関連の種類<select onchange="App.dbF('lrel',this.value)"><option value="">すべて（${state.links.length}件）</option>${Object.keys(REL).map(k=>`<option value="${k}" ${D.lrel===k?'selected':''}>${esc(REL[k].f)}（${state.links.filter(l=>l.rel===k).length}）</option>`).join('')}</select></label><div class="statrow"><span>手動<b>${state.links.filter(l=>!l.auto).length}</b></span><span>自動<b>${state.links.filter(l=>l.auto).length}</b></span></div></div>
 <div class="tbl"><table><thead><tr><th>ID</th><th>元</th><th>関連</th><th>先</th><th>記録</th><th>登録者</th><th>日時</th><th>メモ</th><th></th></tr></thead><tbody>
 ${ls.map(l=>`<tr><td class="mono">${l.id}</td><td>${chip(l.a)}</td><td>${esc(REL[l.rel].f)}</td><td>${chip(l.b)}</td><td>${l.auto?'<span class="badge">自動</span>':'<span class="badge b-acc">手動</span>'}</td><td>${esc(l.by)}</td><td style="white-space:nowrap">${fmt(l.at)}</td><td>${esc(l.note)}</td><td>${l.auto?'':`<button class="btn ghost sm" onclick="App.unlink('${l.id}')">解除</button>`}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">関連付けはありません</td></tr>'}
 </tbody></table></div></div>`;
}

V.audit=function(){
 return `<h1>監査ログ</h1><p class="sub">受付・引継ぎ・解決・承認・反映の操作をすべて記録します（新しい順）。</p>
 <div class="card"><div class="btns" style="margin-bottom:10px"><button class="btn ghost sm" onclick="App.exportAudit()">CSVエクスポート</button><span class="hint">${state.audit.length}件</span></div>
 <div class="tbl"><table><thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>内容</th></tr></thead><tbody>
 ${state.audit.map(a=>`<tr><td style="white-space:nowrap">${fmtFull(a.t)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td class="mono">${linkify(esc(a.target))}</td><td>${linkify(esc(a.detail))}</td></tr>`).join('')}
 </tbody></table></div></div>`;

/* ===================== 描画 ===================== */
function render(){
 renderNav();
 $('#main').innerHTML=(V[ui.view]||V.dash)();
 const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;
 $('#actor').value=state.actor;
 const dl=$('#entlist');if(dl)dl.innerHTML=state.tickets.map(t=>`<option value="${t.id}">${esc(t.subject)}</option>`).join('')+state.kb.map(k=>`<option value="${k.id}">${esc(k.title)}</option>`).join('')+state.cis.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
}
function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;$('#toast').appendChild(el);setTimeout(()=>el.remove(),3200)}
function download(name,text,type){const b=new Blob([text],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function openTicket(id){
 const t=tk(id);if(!t)return;ui.dw=id;
 const d=t.draftId?drById(t.draftId):null;
 const ai=t.aiLog.filter(m=>m.role!=='sys').map(m=>{const who=m.role==='user'?'利用者':'AI';let tx=m.text||'';if(m.kind==='kb')tx+=`（${m.kbId} 一致度 ${pct(m.score)}）`;if(m.kind==='cands')tx+=`（候補 ${m.cands.map(c=>c.id).join('、')}）`;return `<li><b>${who}</b>：${esc(tx)}<br><small>${fmt(m.t)}</small></li>`}).join('');
 $('#drawer').innerHTML=`<button class="btn ghost sm x" onclick="App.closeDrawer()">閉じる</button><div class="hint mono">${t.id}</div><h2>${esc(t.subject)}</h2>
 <div class="btns" style="margin-bottom:12px">${pb(t.priority)}${sb(t.status)}<span class="badge">${esc(cat(t.cat).label)}</span>${slaBadge(t)}</div>
 ${parentOf(t.id)?`<div class="note n-acc">親インシデント ${chip(parentOf(t.id))} の子として管理中です。</div>`:''}${childrenOf(t.id).length?`<div class="note n-acc">子インシデント ${childrenOf(t.id).length}件を束ねる親インシデントです。解決時に子もまとめて解決できます。</div>`:''}
 <dl class="kv"><dt>依頼者</dt><dd>${esc(t.requester)}</dd><dt>受付</dt><dd>${fmtFull(t.createdAt)}（${esc(t.channel)}）</dd><dt>緊急度／影響</dt><dd>${esc(t.urgency)}／${esc(t.impact)}</dd><dt>SLA期限</dt><dd>${fmtFull(due(t))}</dd><dt>担当</dt><dd>${esc(t.assignee||'-')}</dd>${t.kbId?`<dt>ナレッジ</dt><dd><a href="#" onclick="App.openKb('${t.kbId}');return false">${t.kbId}</a></dd>`:''}${d?`<dt>下書き</dt><dd><a href="#" onclick="App.closeDrawer();App.go('draft','${d.id}');return false">${d.id}</a> ${dbg(d.status)}</dd>`:''}</dl>
 <h3>内容</h3><div style="white-space:pre-wrap;font-size:13px">${esc(t.body)}</div>
 ${ai?`<h3>AI一次対応ログ</h3><ul class="tl">${ai}</ul>`:''}
 ${t.handover?`<h3>引継ぎメモ</h3><pre class="box">${linkify(esc(t.handover.summary))}</pre>`:''}
 ${t.resolution?`<h3>解決記録</h3><dl class="kv"><dt>原因</dt><dd>${esc(t.resolution.cause)}</dd><dt>手順</dt><dd><ol style="margin:0;padding-left:18px">${t.resolution.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></dd><dt>担当・所要</dt><dd>${esc(t.resolution.by)}／${t.resolution.minutes}分</dd></dl>`:''}
 <h3>関連付け</h3>${relSection('dw',t.id)}
 <h3>タイムライン</h3><ul class="tl">${t.history.map(h=>`<li>${linkify(esc(h.a))}<br><small>${fmtFull(h.t)}　${esc(h.actor)}</small></li>`).join('')}</ul>`;
 $('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');
}
function openKb(id){

function reflectModal(info){
 ui.md=null;
 const steps=[`承認記録を保存（承認者・チェック結果・コメント）`,`ナレッジDBへ保存：${info.kb.id} v${info.kb.version}（${info.action}${info.from?'：v'+info.from+'から':''}）`,`AI検索インデックスを再構築（有効ナレッジ ${info.n}件）`,`Skill「${info.skill}」を v${info.sFrom} → v${info.sTo} に更新`,`AIエージェントへ配信（次の問い合わせから自動適用）`];
 $('#modal').innerHTML=`<div class="card"><h2>承認完了 — DB保存・AI/Skills反映</h2><ul class="runlist">${steps.map((s,i)=>`<li id="rs${i}"><span class="ic">○</span><span>${esc(s)}</span></li>`).join('')}</ul>
 <div id="rsdone" style="display:none"><div class="note n-ok">反映が完了しました。同じような問い合わせには、次回からAIがこのナレッジで回答します。</div><div class="btns"><button class="btn ai" onclick="App.tryKb('${info.kb.id}')">受付で反映を試す</button><button class="btn ghost" onclick="App.closeModal();App.go('skills');App.selSkill('${info.kb.cat}')">Skillを見る</button><button class="btn ghost" onclick="App.closeModal()">閉じる</button></div></div></div>`;
 $('#modal').classList.add('open');
 let i=0;const tick=()=>{const el=$('#rs'+i);if(!el)return;el.classList.add('done');el.querySelector('.ic').textContent='✔';i++;if(i<steps.length)setTimeout(tick,420);else $('#rsdone').style.display='block'};

}

 },
 selSkill(k){ui.skill=k;render()},
 copySkill(){const t=skillMd(cat(ui.skill));const done=()=>toast('SKILL.md をコピーしました');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done)},
 dlSkill(){const c=cat(ui.skill);download(c.skill+'-SKILL.md',skillMd(c),'text/markdown')},
 testSearch(){
  const q=$('#q_test').value.trim();if(!q)return;
  const sec=secCheck(q);const r=search(q,4);
  let verdict;
  if(sec)verdict='<div class="note n-bad">判定：セキュリティ事象 → AIは自己解決せず、初動手順を案内して即時に人間へ引継ぎ</div>';
  else if(r[0]&&r[0].score>=TH_HIGH)verdict=`<div class="note n-ok">判定：AIが ${r[0].id} の手順で回答</div>`;
  else if(r[0]&&r[0].score>=TH_LOW)verdict='<div class="note n-warn">判定：候補を提示し、利用者に選んでもらう</div>';
  else verdict='<div class="note n-acc">判定：該当ナレッジなし → 人間へ引継ぎ</div>';
  $('#q_res').innerHTML=verdict+(r.length?r.map(x=>{const k=kbById(x.id);return `<div class="barrow" style="grid-template-columns:minmax(0,1fr) 120px 40px"><span><a href="#" onclick="App.openKb('${k.id}');return false">${k.id}</a> ${esc(k.title)} <span class="hint">v${k.version}</span></span><div class="bar"><i style="width:${x.score*100}%;background:${x.score>=TH_HIGH?'var(--ok)':x.score>=TH_LOW?'var(--warn)':'var(--mute)'}"></i></div><b>${pct(x.score)}</b></div>`}).join(''):'');
 },
 tryKb(id){
  const k=kbById(id);App.closeModal();App.go('intake');
  const s=SAMPLES.find(x=>norm(x.subject+x.body).includes('directcloud')&&norm(k.title).includes('directcloud'));
  if(s){$('#i_req').value=s.req;$('#i_sub').value=s.subject;$('#i_body').value=s.body}
  else{$('#i_req').value='工事部 テスト';$('#i_sub').value=k.title.replace(/ときの対処$/,'');$('#i_body').value=k.symptom}
  toast('別の利用者からの類似の問い合わせを入力しました。「受付」を押してください');
 },
 exportJSON(){const d=new Date();download(`aihelpdesk-data-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,JSON.stringify(state,null,2),'application/json');audit('データをエクスポート','','');save()},
 importJSON(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.tickets||!o.kb||!o.drafts||!o.skills)throw new Error();state=o;migrate();buildIndex();audit('データをインポート',f.name,'');save();render();toast('インポートしました','ok')}catch(e){toast('読み込めないファイルです','bad')}inp.value=''};
  rd.readAsText(f);
 },
 reset(){if(!confirm('すべてのデータを初期状態に戻します。よろしいですか？'))return;try{localStorage.removeItem(LS)}catch(e){}state=seed();buildIndex();ui.sel={};ui.view='dash';save();render();toast('初期化しました')},
 exportAudit(){const rows=[['日時','操作者','操作','対象','内容']].concat(state.audit.map(a=>[fmtFull(a.t),a.actor,a.action,a.target,a.detail]));download('audit-log.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
};
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('コピーできませんでした','bad')}ta.remove()}
window.App=App;

/* ===================== 起動 ===================== */
load();buildIndex();
$('#actor').innerHTML=STAFF.map(s=>`<option value="${s.name}">${s.name}（${s.role}）</option>`).join('');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){App.closeDrawer();App.closeModal()}});
render();save();
setInterval(()=>{if(ui.view==='dash'&&!document.querySelector('.modal.open'))render();else renderNav()},60000);
})();
</script>
</body>
</html>
