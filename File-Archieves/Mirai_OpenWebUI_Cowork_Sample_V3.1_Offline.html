<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>みらいAI窓口 サンプル V3.1</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--panel2:#f8fafc;--line:#e2e8f0;--text:#1e293b;--muted:#64748b;--acc:#2563eb;--acc2:#1d4ed8;--accsoft:#e8efff;--ok:#047857;--oksoft:#e3f6ee;--warn:#a16207;--warnsoft:#fff5d9;--ng:#be123c;--ngsoft:#ffedf0;--info:#0369a1;--infosoft:#e0f2fe;--side:#0f1d33;--sidetext:#c3cfdf;--sideact:#1f3a60;--userbub:#e6eeff;--code:#eef2f7;--shadow:0 6px 22px rgba(15,29,51,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--panel:#111a2b;--panel2:#16213a;--line:#25344f;--text:#e2e8f0;--muted:#94a3b8;--acc:#4f8cff;--acc2:#3b7bf5;--accsoft:#1a2b52;--ok:#34d399;--oksoft:#0f2e25;--warn:#fbbf24;--warnsoft:#33280c;--ng:#fb7185;--ngsoft:#3a1520;--info:#38bdf8;--infosoft:#0c2a3d;--side:#070d18;--sidetext:#b6c3d6;--sideact:#1a2d4a;--userbub:#1a2b52;--code:#0d1526;--shadow:0 6px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b1220;--panel:#111a2b;--panel2:#16213a;--line:#25344f;--text:#e2e8f0;--muted:#94a3b8;--acc:#4f8cff;--acc2:#3b7bf5;--accsoft:#1a2b52;--ok:#34d399;--oksoft:#0f2e25;--warn:#fbbf24;--warnsoft:#33280c;--ng:#fb7185;--ngsoft:#3a1520;--info:#38bdf8;--infosoft:#0c2a3d;--side:#070d18;--sidetext:#b6c3d6;--sideact:#1a2d4a;--userbub:#1a2b52;--code:#0d1526;--shadow:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:14px;line-height:1.7;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
code{background:var(--code);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:262px 1fr;height:100vh;height:100dvh}
/* sidebar */
.side{background:var(--side);color:var(--sidetext);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px;border-bottom:1px solid #ffffff14}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{font-size:11px;color:#8fa3bf}
.newbtn{margin:12px 14px 6px;padding:9px 12px;border-radius:10px;border:1px solid #ffffff2a;background:#ffffff10;color:#fff;font-weight:700;text-align:left}
.newbtn:hover{background:#ffffff1c}
.nav{padding:6px 8px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--sidetext);padding:7px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.nav button:hover{background:#ffffff0f}
.nav button.on{background:var(--sideact);color:#fff;font-weight:700}
.nav .cnt{margin-left:auto;background:#f59e0b;color:#1b1300;border-radius:99px;font-size:11px;font-weight:800;padding:0 7px}
.histh{padding:10px 18px 4px;font-size:11px;color:#8193ad;letter-spacing:.06em}
.hist{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.hist .hi{display:flex;align-items:center;gap:4px;border-radius:8px}
.hist .hi button.t{flex:1;border:0;background:transparent;color:var(--sidetext);text-align:left;padding:6px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .hi.on{background:#ffffff14}.hist .hi.on button.t{color:#fff}
.hist .hi button.x{border:0;background:transparent;color:#7d8ea8;padding:2px 8px;visibility:hidden}
.hist .hi:hover button.x{visibility:visible}
.sidefoot{padding:10px 16px;border-top:1px solid #ffffff14;font-size:11px;color:#8496b0}
.sidefoot .off{display:inline-block;background:#064e3b;color:#a7f3d0;border-radius:99px;padding:1px 8px;margin-bottom:4px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:800}
.top .sp{flex:1}
.ham{display:none;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px}
.persona{display:flex;align-items:center;gap:6px;font-size:12.5px}
.persona select{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 8px;max-width:300px}
.rolebadge{font-size:11px;border-radius:99px;padding:1px 8px;font-weight:700;background:var(--accsoft);color:var(--acc)}
.estop{border:1px solid var(--ng);color:var(--ng);background:var(--ngsoft);border-radius:8px;padding:5px 10px;font-weight:800}
.estop.on{background:var(--ng);color:#fff}
.banner{padding:6px 16px;font-size:12.5px;background:var(--warnsoft);color:var(--warn);border-bottom:1px solid var(--line)}
.banner.ng{background:var(--ng);color:#fff;font-weight:700}
.view{flex:1;overflow:auto;padding:22px;min-height:0}
.view.chatv{padding:0;overflow:hidden;display:flex}
/* chat */
.chatwrap{display:grid;grid-template-columns:1fr 310px;flex:1;min-height:0;width:100%}
.chatcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.msgs{flex:1;overflow:auto;padding:22px 26px 10px;min-height:0}
.msg{display:flex;gap:10px;margin:0 auto 16px;max-width:860px}
.msg .av{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accsoft);font-size:16px}
.msg .body{flex:1;min-width:0}
.msg.user{flex-direction:row-reverse}
.msg.user .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .bub{background:var(--userbub);border-radius:16px 16px 4px 16px;padding:9px 14px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aitext p{margin:4px 0 8px}.aitext ul,.aitext ol{margin:4px 0 8px;padding-left:22px}
.attchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 9px;font-size:12px;margin:4px 0 0 4px}
.attchip.ng{border-color:var(--ng);color:var(--ng)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin:2px 0}
.card .ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800;margin-bottom:8px}
.card .ch .r{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
.card.ng{border-color:var(--ng);background:var(--ngsoft)}
.card.warn{border-color:#e9b949;background:var(--warnsoft)}
.card.ok{border-color:#6fcfa8;background:var(--oksoft)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;margin:6px 0;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.steps{list-style:none;margin:6px 0;padding:0}
.steps li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.steps li:last-child{border-bottom:0}
.steps .k{color:var(--muted);min-width:170px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.ok{background:#10b981}.dot.warn{background:#f59e0b}.dot.ng{background:#ef4444}.dot.info{background:#38bdf8}.dot.mute{background:#94a3b8}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.y{background:#047857;border-color:#047857;color:#fff}
.btn.n{background:var(--ngsoft);border-color:var(--ng);color:var(--ng)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 9px;border:1px solid transparent}
.badge.ok{background:var(--oksoft);color:var(--ok);border-color:#6fcfa855}
.badge.warn{background:var(--warnsoft);color:var(--warn);border-color:#e9b94955}
.badge.ng{background:var(--ngsoft);color:var(--ng);border-color:#fb718555}
.badge.info{background:var(--infosoft);color:var(--info)}
.badge.mute{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.lv{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;color:#fff}
.lv0{background:#64748b}.lv1{background:#0e7490}.lv2{background:#2563eb}.lv3{background:#047857}.lv4{background:#b45309}.lv5{background:#be123c}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted)}
.typing{display:flex;gap:5px;padding:12px 4px}.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.src{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:0 7px;font-size:11.5px;margin:2px 3px 0 0;cursor:pointer}
.src:hover{border-color:var(--acc)}
.kbhit{border-top:1px solid var(--line);padding:8px 0}.kbhit:first-of-type{border-top:0}
.kbhit b{color:var(--acc)}
.muted{color:var(--muted)}.small{font-size:12px}
/* composer */
.composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 18px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 11px;font-size:12px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.pend{display:flex;flex-wrap:wrap;gap:6px}
.pend .pa{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12px;background:var(--panel2);margin-bottom:6px}
.pend select{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:12px;padding:1px 4px}
.inrow{display:flex;gap:8px;align-items:flex-end;max-width:900px;margin:0 auto}
.inrow textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;max-height:160px;min-height:42px;outline:none}
.inrow textarea:focus{border-color:var(--acc)}
.ibtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;height:42px;width:42px;font-size:17px}
.send{height:42px;border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 18px;font-weight:800}
.attwrap{position:relative}
.attmenu{position:absolute;bottom:48px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:290px;z-index:20}
.attmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13px}
.attmenu button:hover{background:var(--panel2)}
.cfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);max-width:900px;margin:7px auto 0}
.cfoot select{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:2px 6px;font-size:12px}
/* device panel */
.devpanel{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;min-height:0}
.devpanel h4{margin:0 0 6px;font-size:13.5px}
.devrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.devrow span:first-child{color:var(--muted)}
.devrow span:last-child{text-align:right}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;margin:12px 0}
.tips li{margin:3px 0}
/* generic view */
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vh h2{margin:0;font-size:20px}
.vh p{margin:2px 0 0;color:var(--muted)}
.vh .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:24px;color:var(--acc)}
.kpi small{color:var(--muted)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{background:var(--panel2);text-align:left;font-weight:800;color:var(--muted);font-size:12px}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.sec{margin:22px 0 10px;font-size:15px;font-weight:800}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#10b981)}
.barrow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:12.5px;margin:5px 0}
.search{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;width:min(420px,100%)}
textarea.cm{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 10px;min-height:56px}
.grp{margin:18px 0 8px;font-weight:800;color:var(--acc)}
.orgc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.orgc h3{margin:0 0 6px;font-size:14px}
.orgc .q{background:var(--accsoft);border-radius:8px;padding:6px 9px;font-size:13px}
.orgc .a{font-size:12.5px;color:var(--muted);margin:6px 0}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--ng);font-weight:800}
/* modal & toast */
.modal{position:fixed;inset:0;background:#0b122099;display:grid;place-items:center;z-index:100;padding:16px}
.modal .mbox{background:var(--panel);border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px #0006}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1d33;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:120;box-shadow:0 8px 24px #0005;transition:opacity .3s}
.hide{display:none!important}
.overlay{display:none}
@media(max-width:1180px){.chatwrap{grid-template-columns:1fr}.devpanel{display:none}.devpanel.show{display:block;position:fixed;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:60;box-shadow:-10px 0 30px #0004}.devtgl{display:inline-block!important}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:70;transform:translateX(-100%);transition:transform .25s}.app.sideopen .side{transform:none}.app.sideopen .overlay{display:block;position:fixed;inset:0;background:#0007;z-index:65}.ham{display:inline-block}.msgs{padding:16px 14px 8px}.composer{padding:8px 12px}.view{padding:16px}.kv{grid-template-columns:96px 1fr}.steps .k{min-width:120px}.persona select{max-width:190px}.persona>.muted{display:none}.top{gap:6px;padding:8px 12px}.estop{padding:4px 8px;font-size:12px}.top h1{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{overflow:visible}.side,.composer,.top,.banner,.devpanel{display:none!important}.app{display:block;height:auto}.view,.msgs{overflow:visible}}
</style>
</head>
<body>
<noscript><p style="padding:20px">このサンプルはJavaScriptを使用します。ブラウザでJavaScriptを有効にしてください。</p></noscript>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><b>🏗️ みらいAI窓口</b><small>Open WebUI × Cowork型｜全社AI業務支援 V3.1 サンプル</small></div>
    <button class="newbtn" data-act="newChat">＋ 新しい相談</button>
    <nav class="nav" id="nav"></nav>
    <div class="histh">相談履歴（この利用者）</div>
    <div class="hist" id="hist"></div>
    <div class="sidefoot"><span class="off">● 完全オフライン</span><br>外部通信なし（CSPで遮断）／データはこのブラウザ内のみ</div>
  </aside>
  <div class="overlay" data-act="toggleSide"></div>
  <div class="main">
    <div class="top">
      <button class="ham" data-act="toggleSide" aria-label="メニュー">☰</button>
      <h1 id="vtitle">AI相談</h1>
      <span class="sp"></span>
      <button class="btn sm devtgl hide" data-act="toggleDev" style="display:none">🖥️ 端末</button>
      <div class="persona"><span class="muted">利用者（デモ切替）</span><select id="persona" aria-label="利用者切替"></select><span class="rolebadge" id="rolebadge"></span></div>
      <button class="estop" id="estop" data-act="estop">🛑 緊急停止</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="modal" class="modal hide" data-act="closeModalBg"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast hide"></div>
<input type="file" id="file" multiple hidden>
<script>
'use strict';
/* ============ ユーティリティ ============ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l=2)=>String(n).padStart(l,'0');
function nowISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
let _u=0;const uid=()=>Date.now().toString(36)+(++_u).toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
/* SHA-256（外部ライブラリなし） */
const sha256=(()=>{const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};const fr=x=>((x-Math.floor(x))*4294967296)|0;while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c]=fr(Math.pow(n,1/3));c++}n++}
const ror=(x,r)=>(x>>>r)|(x<<(32-r));
return s=>{const b=Array.from(new TextEncoder().encode(s));const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);b.push(0,0,0,0,(l>>>24)&255,(l>>>16)&255,(l>>>8)&255,l&255);const h=H.slice(),w=new Array(64);
for(let j=0;j<b.length;j+=64){for(let i=0;i<16;i++)w[i]=(b[j+4*i]<<24)|(b[j+4*i+1]<<16)|(b[j+4*i+2]<<8)|b[j+4*i+3];
for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(ror(x,7)^ror(x,18)^(x>>>3))+w[i-7]+(ror(y,17)^ror(y,19)^(y>>>10)))|0}
let a=h[0],bb=h[1],cc=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
for(let i=0;i<64;i++){const t1=(hh+(ror(e,6)^ror(e,11)^ror(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;const t2=((ror(a,2)^ror(a,13)^ror(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}

function auditAdd(st,actor,event,detail){const prev=st.audit.length?st.audit[st.audit.length-1].hash:'GENESIS';const e={seq:st.audit.length+1,ts:nowISO(),actor,event,detail:detail||{}};e.prev=prev;e.hash=sha256(prev+'|'+JSON.stringify([e.seq,e.ts,e.actor,e.event,e.detail]));st.audit.push(e);return e}
function verifyChain(list){let prev='GENESIS';for(const e of list){const h=sha256(prev+'|'+JSON.stringify([e.seq,e.ts,e.actor,e.event,e.detail]));if(e.prev!==prev||e.hash!==h)return {ok:false,at:e.seq};prev=e.hash}return {ok:true,n:list.length}}
function toks(q){return (q.match(/[\u30A0-\u30FFー]{2,}|[\u4E00-\u9FFF々]{2,}|[A-Za-z0-9]{2,}/g)||[]).map(x=>x.toLowerCase())}
function kbScore(k,q){const ql=q.toLowerCase();let s=0;k.tags.forEach(t=>{if(ql.includes(t.toLowerCase()))s+=3});toks(q).forEach(t=>{if(k.title.toLowerCase().includes(t))s+=2;else if(k.body.toLowerCase().includes(t))s+=1});return s}

function kbSearch(st,userId,q){const scored=allDocs(st).map(k=>({k,s:kbScore(k,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);return {hits:scored.filter(x=>canSee(userId,x.k)).slice(0,3),hidden:scored.filter(x=>!canSee(userId,x.k)).length}}

 return {text:s,found:[...new Set(found)]}}

function createProposal(st,userId,opId,params,meta){
 const op=OPS[opId];if(!op)throw new Error('許可リストに存在しない操作：'+opId);
 if(op.level>=5){auditAdd(st,userId,'blocked_prohibited',{opId});return {blocked:true,opId}}
 const id='OP-'+pad(++st.counters.prop,4);
 const p={id,opId,userId,deviceId:USERS[userId].device,params:params||{},meta:meta||{},status:'proposed',created:nowISO(),userDecision:null,adminDecision:null,approvedHash:null,chatId:null};
 p.hash=propHash(p);st.proposals[id]=p;
 auditAdd(st,userId,'proposal_created',{prop:id,opId,level:op.level,hash:p.hash.slice(0,12)});
 return p}
function userDecision(st,id,dec){const p=st.proposals[id];if(!p||p.status!=='proposed')return p;
 if(dec==='Y'){const h=propHash(p);p.userDecision={by:p.userId,at:nowISO(),hash:h};p.approvedHash=h;p.status=OPS[p.opId].level>=4?'pending_admin':'ready';auditAdd(st,p.userId,'user_approved',{prop:id,hash:h.slice(0,12)});if(p.status==='pending_admin')auditAdd(st,'system','admin_approval_requested',{prop:id})}

 if(propHash(p)!==p.approvedHash){p.status='invalidated';auditAdd(st,'system','hash_mismatch',{prop:id});return {ok:false,msg:'本人承認後に内容が変わったため、承認を取り直してください'}}
 if(dec==='approve'){p.adminDecision={by:adminId,at:nowISO(),comment:comment||'',hash:p.approvedHash};p.status='ready';auditAdd(st,adminId,'admin_approved',{prop:id,comment:comment||''})}
 else{p.adminDecision={by:adminId,at:nowISO(),dec:'reject',comment:comment||''};p.status='admin_rejected';auditAdd(st,adminId,'admin_rejected',{prop:id,comment:comment||''})}
 return {ok:true}}
function serverVerify(st,p){const op=OPS[p.opId];const c=[];
 c.push(['操作IDが許可リストに登録済み',!!op&&op.level<5]);
 c.push(['緊急停止が解除されている',!st.estop]);
 c.push(['本人承認（Y）が記録済み',!!(p.userDecision&&p.userDecision.hash)]);
 c.push(['承認時から操作内容が変わっていない',!!p.approvedHash&&p.approvedHash===propHash(p)]);
 c.push(['対象端末＝依頼者に割り当てられた端末',!!USERS[p.userId]&&USERS[p.userId].device===p.deviceId]);
 if(op&&op.level>=4)c.push(['IT管理者の承認済み（自己承認でない）',!!(p.adminDecision&&p.adminDecision.hash===p.approvedHash&&p.adminDecision.by!==p.userId)]);
 c.push(['申請の状態が実行可能',p.status==='ready'||p.status==='executing']);
 return {ok:c.every(x=>x[1]),checks:c}}
function applyOp(st,p){const v=serverVerify(st,p);
 if(!v.ok){auditAdd(st,'system','exec_denied',{prop:p.id,failed:v.checks.filter(c=>!c[1]).map(c=>c[0])});return {ok:false,msg:'サーバ側の実行前検証で不合格のため、実行しませんでした。端末は変更していません。',checks:v.checks}}
 const op=OPS[p.opId],d=st.devices[p.deviceId];
 if(st.failNext){st.failNext=false;p.status='failed';auditAdd(st,'agent','exec_failed',{prop:p.id,reason:'模擬障害'});return {ok:false,msg:'PCエージェントが想定外の応答を返したため中断しました（模擬障害）。端末には変更を加えていません。',checks:v.checks}}
 if(op.key)p.snapshot=clone(d[op.key]);
 let verify=[],file=null;
 switch(p.opId){
  case 'PRINT_JOB_CANCEL_OWN':d.printer.jobs=d.printer.jobs.filter(j=>!(j.owner===p.userId&&j.status==='エラー'));verify=[['本人のエラージョブ',d.printer.jobs.some(j=>j.owner===p.userId&&j.status==='エラー')?'残存':'0件'],['他の利用者のジョブ','変更なし（'+d.printer.jobs.filter(j=>j.owner!==p.userId).length+'件保持）']];break;
  case 'SPOOLER_RESTART':d.printer.spooler='running';verify=[['スプーラサービス','実行中'],['待機中のジョブ',d.printer.jobs.length+'件（保持）']];break;
  case 'AUDIO_DEVICE_SET':d.audio.default=p.params.device;verify=[['既定の出力デバイス',d.audio.default],['テスト音','選択したデバイスで再生（模擬）']];break;
  case 'TEMP_CLEAN_USER':{const mv=Math.max(0,+(d.disk.tempGB-0.2).toFixed(1));d.disk.quarantineGB=+(d.disk.quarantineGB+mv).toFixed(1);d.disk.freeGB=+(d.disk.freeGB+mv).toFixed(1);d.disk.tempGB=0.2;verify=[['隔離した容量',mv+' GB（7日保持）'],['空き容量',d.disk.freeGB+' GB'],['ドキュメント・共有フォルダ','変更なし']];break}
  case 'VPN_ADAPTER_ENABLE':d.vpn.adapter='enabled';d.vpn.connected=true;verify=[['VPN仮想アダプタ','有効'],['接続テスト','社内ポータルへ到達（模擬）']];break;

 }

 auditAdd(st,'agent','executed',{prop:p.id,opId:p.opId,device:p.deviceId});

const me=()=>USERS[S.ui.user];

function ensureChat(){let c=activeChat();if(!c){c=S.chats.find(x=>x.userId===S.ui.user);if(c)S.ui.chat=c.id;else c=newChat()}return c}

function ai(chat,html,opt){return addMsg(chat,Object.assign({kind:'ai',html,model:MODELS[S.ui.model]},opt||{}))}
function findMsg(id){for(const c of S.chats){const m=c.messages.find(x=>x.id===id);if(m)return [c,m]}return [null,null]}

function parseCSV(t,dl){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===dl){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function csvStats(text,dl){const rows=parseCSV(text,dl);if(rows.length<2)return null;const head=rows[0].map(h=>h.trim());const body=rows.slice(1);
 const isNum=v=>v!==''&&!isNaN(Number(String(v).replace(/,/g,'')));const isDate=v=>/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(v);const num=v=>Number(String(v||'0').replace(/,/g,''))||0;
 const numCols=head.map((h,i)=>i).filter(i=>{const vs=body.map(r=>(r[i]||'').trim()).filter(Boolean);return vs.length&&vs.every(isNum)});
 let grpCol=head.map((h,i)=>i).find(i=>!numCols.includes(i)&&!body.every(r=>isDate((r[i]||'').trim())));
 const totals={},G={};numCols.forEach(i=>totals[i]=0);
 body.forEach(r=>{const g=grpCol!=null?(r[grpCol]||'（空欄）').trim():'全体';G[g]=G[g]||{count:0,sums:{}};G[g].count++;numCols.forEach(i=>{const v=num(r[i]);totals[i]+=v;G[g].sums[i]=(G[g].sums[i]||0)+v})});
 const groups=Object.entries(G).sort((a,b)=>(b[1].sums[numCols[0]]||0)-(a[1].sums[numCols[0]]||0)).slice(0,12);
 return {head,rows:body.length,numCols,grpCol:grpCol==null?null:grpCol,totals,groups}}
const fmtN=n=>(Math.round((n||0)*100)/100).toLocaleString('ja-JP');
const csvCell=v=>{const s=String(v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

  if(dl.found.length)ai(chat,`<p>🔏 入力に <b>${esc(dl.found.join('、'))}</b> と思われる情報があったため、保存・AI送信の前に伏せ字にしました。パスワード等はチャットに入力しないでください。</p>`,{conf:'—'});

function runExec(chat,propId){const p=S.proposals[propId];const v=serverVerify(S,p);
 const m=addMsg(chat,{kind:'exec',propId,checks:v.checks,steps:[],total:(OPS[p.opId].steps||[]).length,state:v.ok?'running':'denied'});
 if(!v.ok){auditAdd(S,'system','exec_denied',{prop:propId,failed:v.checks.filter(c=>!c[1]).map(c=>c[0])});save();refresh();return}
 p.status='executing';auditAdd(S,'agent','exec_started',{prop:propId,device:p.deviceId});save();refresh();
 const steps=OPS[p.opId].steps||[];let i=0;
 const tick=()=>{if(S.estop){m.state='aborted';p.status='aborted';auditAdd(S,'agent','exec_aborted',{prop:propId,reason:'緊急停止'});save();refresh();return}
  if(i<steps.length-1){m.steps.push(steps[i]);i++;save();refresh();setTimeout(tick,650);return}

  save();refresh()};
 setTimeout(tick,450)}

 adminReject(d){const cm=($('#cm-'+d.id)||{}).value||'';const r=adminDecision(S,d.id,S.ui.user,'reject',cm);if(!r.ok){toast(r.msg);return}const p=S.proposals[d.id];const c=S.chats.find(x=>x.id===p.chatId);if(c)ai(c,`<p>⛔ IT管理者が ${esc(p.id)} を却下しました${cm?'（'+esc(cm)+'）':''}。端末は変更していません。</p>`,{conf:'—'});save();refresh()},
 estop(){const u=me();if(!S.estop){S.estop=true;auditAdd(S,u.id,'estop_on',{});toast('緊急停止しました。PC操作の実行をすべて止めています')}else{if(u.role!=='itadmin'){toast('緊急停止の解除はIT端末管理者のみ行えます');return}if(!confirm('緊急停止を解除しますか？'))return;S.estop=false;auditAdd(S,u.id,'estop_off',{});toast('緊急停止を解除しました')}save();refresh()},
 verifyChain(){const r=verifyChain(S.audit);auditAdd(S,me().id,'chain_verified',{ok:r.ok,n:S.audit.length-1});save();renderView();$('#aures').innerHTML=r.ok?`<div class="card ok" style="margin-bottom:12px">🔗 ${r.n}件すべてのハッシュチェーンが正常です（改ざんなし）。</div>`:`<div class="card ng" style="margin-bottom:12px">⚠️ #${r.at} で不整合を検出しました。</div>`},
 tamper(){const c=clone(S.audit);const i=Math.min(2,c.length-1);c[i].detail={note:'書き換えた内容'};const r=verifyChain(c);$('#aures').innerHTML=`<div class="card warn" style="margin-bottom:12px">🧪 ログのコピーで #${c[i].seq} の内容を書き換えて検証 → <b>#${r.at} で改ざんを検知</b>しました。（実際のログは変更していません）</div>`},
 exportAudit(d){const L=visibleAudit();if(d.f==='json')download('audit_log_'+nowISO().slice(0,10)+'.json',JSON.stringify(L,null,2),'application/json');else download('audit_log_'+nowISO().slice(0,10)+'.csv','\uFEFF'+[['seq','日時','実施者','イベント','詳細','prev','hash']].concat(L.map(e=>[e.seq,e.ts,uname(e.actor),EV[e.event]||e.event,JSON.stringify(e.detail),e.prev,e.hash])).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')},
 runTests(){UI.lastTests=testEngine();UI.testsAt=nowISO().slice(11);auditAdd(S,me().id,'tests_run',{pass:UI.lastTests.filter(r=>r.ok).length,total:UI.lastTests.length});save();renderView()},
 kbOpen(d){const k=kbById(S,d.id);if(!k)return;if(!canSee(S.ui.user,k)){toast('この資料を閲覧する権限がありません');return}modal(`<div class="mh"><h3>📚 ${esc(k.title)}</h3><button class="btn sm" data-act="closeModal">閉じる</button></div><div class="small muted">${esc(k.id)}｜所管：${esc(k.owner)}｜更新：${esc(k.updated)}｜公開範囲：${esc(SCOPE_LABEL[k.scope])}</div><p>${esc(k.body)}</p><div class="small muted">タグ：${k.tags.map(esc).join('、')}</div>`)},
 ticketOpen(d){openTicket(d.id)},
 ticketSave(d){const t=S.tickets.find(x=>x.id===d.id);const st=$('#tst').value,res=$('#tres').value.trim(),fq=$('#tfaq').checked;const ch=[];if(st!==t.status){ch.push('状態：'+t.status+'→'+st);t.status=st}if(res!==t.resolution){ch.push('回答を更新');t.resolution=res}
  if(ch.length){t.history.push({at:nowISO(),by:S.ui.user,text:ch.join('／')});auditAdd(S,S.ui.user,'ticket_updated',{ticket:t.id,status:t.status})}
  if(fq&&res){S.faqCandidates.push({id:'FC-'+pad(++S.counters.fc,4),ticket:t.id,title:t.summary,body:res,tags:toks(t.summary).slice(0,6),by:S.ui.user,at:nowISO(),status:'review'});auditAdd(S,S.ui.user,'faq_candidate',{ticket:t.id});toast('FAQ候補として提出しました（ナレッジでレビュー）')}
  save();closeModal();refresh()},
 faqPublish(d){const f=S.faqCandidates.find(x=>x.id===d.id);f.status='published';const id='FAQ-'+pad(++S.counters.faq,3);S.faqs.push({id,title:f.title,body:f.body,tags:f.tags.length?f.tags:toks(f.title),scope:'all',owner:'DX推進部（FAQ）',updated:nowISO().slice(0,10),from:f.ticket});auditAdd(S,S.ui.user,'faq_published',{id,from:f.ticket});toast(id+' を公開しました。以後のAI回答の出典になります');save();refresh()},
 faqReturn(d){const f=S.faqCandidates.find(x=>x.id===d.id);f.status='returned';auditAdd(S,S.ui.user,'faq_returned',{id:f.id});save();refresh()},
 injectFaults(){const id=me().device;S.devices[id]=seedDevices()[id];toast('この端末をサンプル障害のある状態に戻しました');save();refresh()},
 theme(d){S.ui.theme=d.t;applyTheme();save()},
 exportState(){download('mirai_ai_sample_state.json',JSON.stringify(S,null,2),'application/json')},
 resetAll(){if(!confirm('すべてのサンプルデータ（相談・チケット・監査ログ）を初期化しますか？'))return;try{localStorage.removeItem(KEY)}catch(e){}const th=S.ui.theme;S=freshState();S.ui.theme=th;UI.pending=[];UI.lastTests=null;save();applyTheme();renderView();refresh();toast('初期化しました')},
 toggleSide(){$('#app').classList.toggle('sideopen')},
 toggleDev(){const p=$('#devpanel');if(p)p.classList.toggle('show')},
 closeModal(){closeModal()},
 closeModalBg(d,el,e){if(e.target===el)closeModal()}
};
function addSample(k){const map={csv:{name:'工事日報_2026-10.csv',ext:'csv',kind:'csv',text:SAMPLE_CSV},log:{name:'VPN接続ログ_20261018.log',ext:'log',kind:'text',text:SAMPLE_LOG},hr:{name:'人事評価一覧_2026.xlsx',ext:'xlsx',kind:'doc',text:''},mitsu:{name:'見積書_有明橋梁.pdf',ext:'pdf',kind:'doc',text:''}};const s=map[k];if(!s)return;
 UI.pending.push({id:uid(),name:s.name,size:s.text?new TextEncoder().encode(s.text).length:48213,ext:s.ext,kind:s.kind,cls:suggestClass(s.name),text:s.text});renderPend()}
async function readFileObj(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
 const kind=['csv','tsv'].includes(ext)?'csv':['txt','log','md','json'].includes(ext)?'text':['png','jpg','jpeg','gif','bmp','webp'].includes(ext)?'image':['pdf','docx','xlsx','pptx','doc','xls','ppt'].includes(ext)?'doc':'binary';
 const a={id:uid(),name:f.name,size:f.size,ext,kind,cls:suggestClass(f.name),text:''};
 if((kind==='csv'||kind==='text')&&f.size<=1048576){const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{t=new TextDecoder('shift_jis').decode(buf)}catch(e2){t=new TextDecoder().decode(buf)}}a.text=t.replace(/^\uFEFF/,'').slice(0,200000)}
 else if(kind==='csv'||kind==='text'){a.note='1MB超のため本文は読み込みません';a.kind='binary'}
 return a}

/* ============ 初期化 ============ */
function init(){load();applyTheme();
 document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el){const m=$('#attmenu');if(m&&!e.target.closest('.attwrap'))m.classList.add('hide');return}const f=ACT[el.dataset.act];if(f){if(el.dataset.act!=='closeModalBg')e.preventDefault();f(el.dataset,el,e)}});
 document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='persona'){S.ui.user=t.value;auditAdd(S,t.value,'persona_switch',{});S.ui.chat=null;ensureChat();UI.pending=[];UI.stick=true;save();renderSide();renderTop();renderView();toast(me().name+'（'+ROLES[me().role]+'）に切り替えました')}
  else if(t.id==='model'){S.ui.model=t.value;save();toast(t.value==='external'?'外部AI（模擬）：機密区分は送信できません':'社内ローカルLLM（模擬）を使用します')}
  else if(t.dataset.chg==='cls'){const a=UI.pending.find(x=>x.id===t.dataset.id);if(a)a.cls=t.value}
  else if(t.dataset.chg==='failNext'){S.failNext=t.checked;save();toast(t.checked?'次の実行は失敗します（異常系テスト）':'異常系テストを解除')}
  else if(t.dataset.ck){const [c,m]=findMsg(t.dataset.mid);if(m){m.sel[t.dataset.ck]=t.checked;save()}}
  else if(t.id==='file'){const fs=[...t.files];t.value='';Promise.all(fs.map(readFileObj)).then(as=>{UI.pending.push(...as);renderPend();if(as.length)toast('ファイルはこのブラウザ内で読み込みました（外部送信なし）')})}
  else if(t.id==='auf'){UI.auditFilter=t.value;renderView()}});
 document.addEventListener('input',e=>{const t=e.target;if(t.id==='inp')autosize(t);else if(t.id==='orgq')filterOrg();else if(t.id==='kbq')filterKb()});
 document.addEventListener('keydown',e=>{if(e.target.id==='inp'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}if(e.key==='Escape')closeModal()});
 document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='msgs'){const b=e.target;UI.stick=b.scrollHeight-b.scrollTop-b.clientHeight<80}},true);
 window.addEventListener('resize',()=>renderTop());
 ensureChat();save();renderSide();renderTop();renderView()}
if(typeof document!=='undefined'&&document.getElementById('app'))init();
</script>
