<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>引継ぎワークスペース（3ペイン）— サンプルプロトタイプ v0.1</title>
<!--
  引継ぎ用 3ペイン UI のサンプルプロトタイプ（Standalone HTML / 完全オフライン）
  作成: 2026-10-26
  位置づけ:
    - 製品 UI（Mirai_AIHelpdesk_Cowork_StepWizard_V3.1_PCinfo_Offline.html）の正本は変更しない。
      これは「引継ぎ後に担当者が使う画面」の検討用サンプルであり、製品には未接続。
    - 判断17=1（Hermes を入れない。Skill/KB 拡充＋3ペイン UI＋自前コパイロット）に対応。
    - 判断18=1（risk 2 以上の変更のみ「解決」と扱う）を画面に反映。
  事実に基づく制約:
    - Y/N は本人のみ（代理承認なし）。担当者は提案の作成・状況確認までで、代行実行はできない。
    - AI は Skill と型付きパラメータだけを返す。コマンド文字列は生成しない。
    - 承認ハッシュは 5 分で失効。実行はハッシュ一致が条件（サーバ側で再計算）。
    - ハッシュ・監査チェーンの表示はデモ用の擬似値。実装はサーバ側の SHA-256。
  データはすべてデモ。外部とは通信しない（CSP で遮断）。
-->
<style>
:root{
  --u-bg:#f4f3ee; --u-surface:#ffffff; --u-surface2:#efede6; --u-warm:#fbfaf6;
  --u-ink:#1b222b; --u-muted:#5f6874; --u-line:#e1ddd2; --u-line2:rgba(27,34,43,.08);
  --u-navy:#16314f; --u-navy2:#0f2440; --u-safety:#f5b800; --u-safety-soft:#fff5d3;
  --u-accent:#ee7d1c; --u-teal:#0f9d9a; --u-teal-soft:#dcf3f1;
  --u-g:#1f9d55; --u-g-soft:#e1f4e8; --u-y:#e0a800; --u-y-soft:#fdf2d2;
  --u-r:#c9302c; --u-r-soft:#fbe2e1;
  --u-proposal:#fffdf5; --u-proposal-line:#e7d9ae;
  --u-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 28px rgba(20,30,40,.08);
  --u-shadow-sm:0 1px 2px rgba(20,30,40,.06);
  --u-radius:14px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --u-font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme:dark){
  :root{
    --u-bg:#0f141a; --u-surface:#18202a; --u-surface2:#212a35; --u-warm:#141b23;
    --u-ink:#e7ecf1; --u-muted:#9fabb8; --u-line:#2c3846; --u-line2:rgba(255,255,255,.08);
    --u-safety-soft:#35290b; --u-teal-soft:#0f2f2d; --u-g-soft:#11301f;
    --u-y-soft:#352a0b; --u-r-soft:#3a1616;
    --u-proposal:#241f10; --u-proposal-line:#4a3d18;
    --u-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
    --u-shadow-sm:0 1px 2px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--u-bg);color:var(--u-ink);font-family:var(--u-font);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
code,.mono{font-family:var(--mono)}
code{background:var(--u-line2);padding:1px 4px;border-radius:4px;font-size:10.8px}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ===== 上部バー ===== */
.topbar{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,#173352,#122a45);color:#fff;border-bottom:3px solid var(--u-safety)}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--u-safety);color:var(--u-navy);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.04em}
.brand{font-weight:700;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.screen-name{font-size:12px;color:#c7d4e2;white-space:nowrap}
.top-sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 4px}
.top-space{flex:1}
.role-switch{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px}
.role-switch button{border:0;background:transparent;color:#d6e2ee;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.role-switch button.on{background:#fff;color:var(--u-navy)}
.top-btn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer}
.top-btn:hover{background:rgba(255,255,255,.1)}
.audit-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:#d9e5f1;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:999px;white-space:nowrap}
.audit-chip .dot{width:7px;height:7px;border-radius:50%;background:#5fdc95;box-shadow:0 0 0 3px rgba(95,220,149,.18)}
.audit-chip b{color:#fff}
.user-chip{display:flex;align-items:center;gap:7px;padding-left:4px}
.user-chip .avatar{width:27px;height:27px;border-radius:50%;background:var(--u-teal);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.user-chip b{display:block;font-size:11.5px;line-height:1.2}
.user-chip small{display:block;font-size:10px;color:#b9c9d9;line-height:1.3}

.demo-strip{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:27px;background:var(--u-safety-soft);color:#6b4e00;font-size:11px;border-bottom:1px solid var(--u-proposal-line)}
.demo-strip b{font-weight:700}

/* ===== 3ペイン ===== */
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:296px minmax(0,1fr) 368px;gap:10px;padding:10px;overflow:hidden}
.pane{min-height:0;background:var(--u-surface);border:1px solid var(--u-line);border-radius:var(--u-radius);box-shadow:var(--u-shadow-sm);display:flex;flex-direction:column;overflow:hidden}
.pane-queue{background:var(--u-surface)}
.pane-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px 8px}
.pane-head h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.02em}
.pane-sub{margin:2px 0 0;font-size:11px;color:var(--u-muted)}
.pane-kpi{margin:3px 0 0;font-size:10.8px;color:var(--u-muted)}
.pane-kpi b{color:var(--u-ink)}
.icon-btn{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--u-line);background:var(--u-surface);color:var(--u-muted);cursor:pointer;font-size:13px;line-height:1}
.icon-btn:hover{color:var(--u-ink);border-color:var(--u-muted)}
.queue-tools{flex:none;padding:0 12px 8px;display:flex;flex-direction:column;gap:7px}
.seg{display:flex;gap:2px;background:var(--u-surface2);padding:3px;border-radius:9px}
.seg button{flex:1;border:0;background:transparent;color:var(--u-muted);font-size:11px;font-weight:600;padding:5px 2px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button b{font-weight:700;font-size:10.5px;opacity:.8;margin-left:1px}
.seg button.on{background:var(--u-surface);color:var(--u-ink);box-shadow:var(--u-shadow-sm)}
.search{width:100%;height:30px;border:1px solid var(--u-line);background:var(--u-surface);border-radius:8px;padding:0 9px;font-size:11.5px;color:var(--u-ink);font-family:inherit}
.search::placeholder{color:var(--u-muted)}
.case-list{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:7px;scrollbar-gutter:stable}
.case-card{position:relative;text-align:left;border:1px solid var(--u-line);background:var(--u-surface);border-radius:11px;padding:9px 10px 9px 14px;cursor:pointer;transition:border-color .12s,background .12s;overflow:hidden}
.case-card:hover{border-color:#c9c3b4;background:var(--u-warm)}
.case-card[aria-selected="true"]{border-color:var(--u-navy);box-shadow:0 0 0 1px var(--u-navy) inset}
.case-card .signal{position:absolute;left:0;top:0;bottom:0;width:4px}
.s-red{background:var(--u-r)}.s-amber{background:var(--u-y)}.s-blue{background:var(--u-teal)}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:10px;color:var(--u-muted)}
.cc-top .done-flag{color:var(--u-g);font-weight:700}
.case-card h3{margin:2px 0 3px;font-size:12.3px;font-weight:650;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-meta{font-size:10.8px;color:var(--u-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.cc-foot{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10.6px;color:var(--u-muted)}
.avatar-sm{width:17px;height:17px;border-radius:50%;background:var(--u-surface2);color:var(--u-ink);display:inline-grid;place-items:center;font-size:9px;font-weight:700;border:1px solid var(--u-line)}
.pane-foot{flex:none;padding:8px 12px;border-top:1px solid var(--u-line);font-size:10px;color:var(--u-muted);line-height:1.5;background:var(--u-warm)}

.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:650;padding:1.5px 6px;border-radius:999px;background:var(--u-surface2);color:var(--u-muted);border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--u-g-soft);color:#15713d}
.chip.warn{background:var(--u-y-soft);color:#7a5b00}
.chip.bad{background:var(--u-r-soft);color:#8f2320}
.chip.info{background:var(--u-teal-soft);color:#0a6b69}
.chip.navy{background:#e4ebf4;color:var(--u-navy)}
.chip.muted{background:transparent;border-color:var(--u-line);color:var(--u-muted)}
.chip.lv{background:#e4ebf4;color:var(--u-navy)}
.chip.lv3,.chip.lv4{background:var(--u-r-soft);color:#8f2320}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--u-surface2);color:var(--u-muted)}
.badge.ok{background:var(--u-g-soft);color:#15713d}
.badge.warn{background:var(--u-y-soft);color:#7a5b00}
.badge.danger{background:var(--u-r-soft);color:#8f2320}
.badge.info{background:var(--u-teal-soft);color:#0a6b69}

/* ===== 中央ペイン ===== */
.pane-case{background:var(--u-warm)}
.case-head{flex:none;padding:11px 16px 10px;background:var(--u-surface);border-bottom:1px solid var(--u-line)}
.case-head .top-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.signal-dot{width:10px;height:10px;border-radius:50%;flex:none}
.case-head h1{margin:0;font-size:16.5px;font-weight:700;line-height:1.35;letter-spacing:.01em;flex:1;min-width:200px}
.state-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--u-line);color:var(--u-muted);white-space:nowrap}
.state-pill.open{border-color:#e3b1af;color:#8f2320;background:var(--u-r-soft)}
.state-pill.active{border-color:#e5c76a;color:#7a5b00;background:var(--u-y-soft)}
.state-pill.done{border-color:#a9d9bd;color:#15713d;background:var(--u-g-soft)}
.case-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:5px;font-size:11.2px;color:var(--u-muted)}
.case-meta b{color:var(--u-ink);font-weight:650}
.case-meta .mi{font-size:10px;color:var(--u-muted);margin-right:4px}
.meters{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
.meter{min-width:104px}
.meter span{display:flex;justify-content:space-between;font-size:10px;color:var(--u-muted);margin-bottom:3px}
.meter .bar{height:4px;border-radius:999px;background:var(--u-surface2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--u-teal);border-radius:999px}
.meter.warn .bar i{background:var(--u-y)}
.meter.danger .bar i{background:var(--u-r)}
.timeline-wrap{flex:1;min-height:0;overflow:auto;padding:14px 16px 6px;scrollbar-gutter:stable}
.timeline{position:relative;margin:0;padding:0 0 2px 22px;list-style:none}
.timeline::before{content:"";position:absolute;left:6px;top:5px;bottom:6px;width:2px;background:var(--u-line)}
.tl-item{position:relative;margin:0 0 12px}
.tl-dot{position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--u-muted);box-shadow:0 0 0 3px var(--u-warm)}
.k-request .tl-dot,.k-memo .tl-dot{background:#98a2ad}
.k-ai .tl-dot{background:var(--u-teal)}
.k-exec .tl-dot{background:var(--u-navy)}
.k-proposal .tl-dot{background:var(--u-y)}
.k-verify .tl-dot{background:var(--u-g)}
.k-verify.fail .tl-dot{background:var(--u-r)}
.k-handoff .tl-dot{background:var(--u-accent)}
.k-resolve .tl-dot{background:var(--u-g)}
.tl-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--u-muted);margin-bottom:3px}
.tl-head .time{font-family:var(--mono);font-size:10px;opacity:.85}
.tl-head .actor{font-weight:700;color:var(--u-ink);font-size:10.8px}
.tl-card{border:1px solid var(--u-line);border-radius:10px;padding:8px 10px;background:var(--u-surface);font-size:12px;line-height:1.65}
.tl-card p{margin:0}
.tl-card .tt{font-weight:700;font-size:12.3px;line-height:1.5}
.tl-card .tb{margin-top:2px;color:var(--u-ink);opacity:.86}
.tl-card .refs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.k-ai .tl-card{border-left:3px solid var(--u-teal)}
.k-exec .tl-card{border-left:3px solid var(--u-navy)}
.k-handoff .tl-card{border-left:3px solid var(--u-accent);background:var(--u-safety-soft)}
.k-verify .tl-card{border-left:3px solid var(--u-g);background:var(--u-g-soft)}
.k-handoff .tl-card .tb,.k-verify .tl-card .tb{color:inherit}
.k-request .tl-card{background:var(--u-surface2);border-color:transparent}
.k-memo .tl-card{background:var(--u-surface);border-style:dashed}
.tl-card.proposal-wrap{padding:0;border:0;background:transparent}
.exec-rows{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.exec-rows .er{font-size:10.2px;background:var(--u-surface2);border-radius:5px;padding:1px 5px;font-family:var(--mono)}
.exec-rows .er b{font-family:var(--u-font);font-weight:700}
.verify-list{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:11.3px}
.verify-list .v{display:flex;gap:6px;align-items:baseline}
.verify-list .v .mark{font-weight:800;width:12px;flex:none}
.verify-list .v .mark.y{color:#15713d}
.verify-list .v .mark.n{color:#8f2320}
.verify-list .v small{color:var(--u-muted);font-size:10px}
.note-line{font-size:10.5px;color:var(--u-muted);margin-top:5px;line-height:1.55}

/* 提案カード */
.proposal{border:1px solid var(--u-proposal-line);background:var(--u-proposal);border-radius:11px;padding:9px 11px}
.proposal.pending{border-color:var(--u-y);box-shadow:0 0 0 2px rgba(245,184,0,.12)}
.p-head{display:flex;align-items:flex-start;gap:8px}
.p-head .risk{flex:none;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#e4ebf4;color:var(--u-navy);margin-top:1px}
.p-head .risk.lv3,.p-head .risk.lv4{background:var(--u-r-soft);color:#8f2320}
.p-title{flex:1;min-width:0}
.p-title b{display:block;font-size:12.2px;line-height:1.4}
.skill-id{display:block;font-size:10px;color:var(--u-muted);margin-top:1px}
.p-head .pill{flex:none;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--u-g-soft);color:#15713d;white-space:nowrap}
.p-head .pill.warn{background:var(--u-y-soft);color:#7a5b00}
.kv{display:grid;grid-template-columns:62px minmax(0,1fr);gap:3px 9px;margin:7px 0 0}
.kv dt{font-size:10.2px;color:var(--u-muted);font-weight:650;padding-top:1px}
.kv dd{margin:0;font-size:11.2px;line-height:1.6;word-break:break-word}
.kv dd .bad{color:#8f2320}
.exec-mini{margin-top:7px;padding-top:6px;border-top:1px dashed var(--u-line);font-size:10.4px;color:var(--u-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.exec-mini .ok{color:#15713d;font-weight:700}
.exec-mini code{font-size:9.8px}
.pending-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;padding-top:6px;border-top:1px dashed var(--u-line);font-size:10.4px;color:#7a5b00}
.countdown{font-family:var(--mono);font-weight:700;font-size:12px;color:#7a5b00;background:var(--u-safety-soft);padding:1px 7px;border-radius:6px;white-space:nowrap}
.countdown.expired{color:#8f2320;background:var(--u-r-soft)}

/* 操作ドック */
.dock{flex:none;border-top:1px solid var(--u-line);background:var(--u-surface);padding:9px 14px 11px}
.dock-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.dock-hint{font-size:10.3px;color:var(--u-muted)}
.dock-top .spacer{flex:1}
.dock-top .mini-stat{font-size:10.3px;color:var(--u-muted);font-family:var(--mono)}
.copilot{border:1px solid var(--u-teal-soft);background:var(--u-teal-soft);border-radius:10px;padding:8px 10px;margin:7px 0 2px}
.copilot .cp-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.copilot .cp-head b{font-size:11.5px}
.copilot .cp-head .tag{font-size:9.3px;background:rgba(15,157,154,.14);color:#0a6b69;padding:0 5px;border-radius:4px;font-weight:700}
.copilot .cp-head .tools{margin-left:auto;font-size:9.6px;color:#0a6b69}
.copilot .cp-head code{background:rgba(255,255,255,.5);font-size:9.3px;color:#0a6b69}
.copilot .cp-body{margin-top:6px;font-size:11.4px;line-height:1.65}
.copilot .cp-body p{margin:0}
.copilot .cp-ev{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:10px;color:#0a6b69}
.copilot .cp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.copilot .cp-note{margin-top:6px;font-size:9.8px;color:#2b6b69}
.copilot .thinking{color:#0a6b69;font-size:11.3px}
.copilot .thinking::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--u-teal);margin-left:6px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.composer{display:flex;gap:7px;margin-top:7px;align-items:flex-end}
.composer textarea{flex:1;min-height:38px;max-height:96px;resize:vertical;border:1px solid var(--u-line);background:var(--u-surface);border-radius:9px;padding:7px 9px;font-size:11.6px;font-family:inherit;color:var(--u-ink);line-height:1.5}
.composer textarea::placeholder{color:var(--u-muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.actions .spacer{flex:1}
.actions .hint{font-size:10px;color:var(--u-muted)}
.pending-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--u-safety-soft);border:1px solid #e5c76a;border-radius:9px;padding:6px 9px;font-size:10.8px;color:#6b4e00;margin-bottom:7px}
.pending-strip b{font-size:11px}
.pending-strip .countdown{font-size:11px}
.resolved-banner{display:flex;align-items:center;gap:8px;background:var(--u-g-soft);border:1px solid #a9d9bd;color:#15713d;border-radius:9px;padding:8px 10px;font-size:11.5px;font-weight:600;margin-bottom:8px}

function H(seed) {
  let out = '';
  for (let s = 0; s < 8; s++) {
    let h = 2166136261 ^ Math.imul(s + 1, 2654435761);
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }

/* ---- 初期化: 監査チェーン・承認ハッシュ・期限 ---- */
function chainAudit(caseId, seeds) {
  let prev = ZERO;
  return seeds.map(([t, actor, action]) => {
    const row = { t, actor, action, prev, hash: H(caseId + '|' + prev + '|' + action + '|' + actor) };
    prev = row.hash;
    return row;
  });
}
CASES.forEach((c) => {
  c.audit = chainAudit(c.id, c.auditSeed || []);
  delete c.auditSeed;
  c.resolved = null;
  c.kbDraft = false;
  c.escalated = false;
  c.memos = [];
  c.timeline.forEach((e) => {
    if (e.kind === 'proposal') {
      if (e.proposal) {
        e.proposal.hash = H(e.proposal.hashSeed);
        if (e.proposal.status === 'pending') e.proposal.expiresAt = Date.now() + e.proposal.ttlMs;
      }
    }
  });
  if (c.proposal) {
    c.proposal.hash = H(c.proposal.hashSeed);
    c.proposal.expiresAt = Date.now() + c.proposal.ttlMs;
    const pending = c.timeline.find((e) => e.kind === 'proposal');
    if (pending) pending.proposal = c.proposal;
  }
});

function renderFilters() {
  const counts = {
    all: CASES.length,
    open: CASES.filter((c) => statusOf(c) === 'open').length,
    active: CASES.filter((c) => statusOf(c) === 'active').length,
    done: CASES.filter((c) => statusOf(c) === 'done').length
  };
  document.querySelectorAll('[data-act="filter"]').forEach((b) => {

  });

    '本日 解決 <b>' + state.solvedToday + '</b> ／ 確認完了 <b>' + state.readonlyToday + '</b>（集計外）';
}

function visibleCases() {
  let list = CASES.slice();
  if (state.filter === 'open') list = list.filter((c) => statusOf(c) === 'open');
  if (state.filter === 'active') list = list.filter((c) => statusOf(c) === 'active');
  if (state.filter === 'done') list = list.filter((c) => statusOf(c) === 'done');
  const q = state.query.trim().toLowerCase();
  if (q) {
    list = list.filter((c) =>
      (c.id + ' ' + c.inc + ' ' + c.title + ' ' + c.requester.name + ' ' + c.requester.dept + ' ' + c.device.name).toLowerCase().includes(q)
    );
  }
  const rank = { red: 0, amber: 1, blue: 2 };
  list.sort((a, b) => (rank[a.signal] - rank[b.signal]) || CASES.indexOf(a) - CASES.indexOf(b));
  return list;
}

function caseCardHTML(c) {
  const si = c.signal === 'red' ? 's-red' : c.signal === 'amber' ? 's-amber' : 's-blue';
  const chips = [];
  if (c.resolved) chips.push('<span class="chip ' + (c.resolved.counted ? 'ok' : 'info') + '">' + (c.resolved.counted ? '解決済み' : '確認完了・集計外') + '</span>');
  if (!c.resolved && c.outcome.kind === 'readonly-done') chips.push('<span class="chip info">読み取りのみ</span>');
  if (!c.resolved && c.outcome.kind === 'awaiting-approval') chips.push('<span class="chip warn">本人 承認待ち</span>');
  if (!c.resolved && c.outcome.kind === 'no-skill') chips.push('<span class="chip bad">Skill なし</span>');
  if (!c.resolved && c.outcome.kind === 'out-of-kb') chips.push('<span class="chip bad">KB 外</span>');
  if (!c.resolved && c.outcome.kind === 'resolvable-change') chips.push('<span class="chip ok">verify ' + c.verify.items.filter((i) => i.ok).length + '/' + c.verify.items.length + '</span>');
  if (c.kbDraft) chips.push('<span class="chip navy">KB 下書き</span>');
  if (c.escalated) chips.push('<span class="chip">引継ぎ済み</span>');
  const foot = c.assignee
    ? '<span class="avatar-sm">' + esc(c.assignee.slice(0, 1)) + '</span>' + esc(c.assignee)
    : '<span class="avatar-sm">?</span>未割当';
  return '<button type="button" class="case-card" data-act="select" data-id="' + esc(c.id) + '" aria-selected="' + (c.id === state.selected) + '">' +
    '<span class="signal ' + si + '" aria-hidden="true"></span>' +
    '<span class="cc-top"><span>' + esc(c.id) + '</span><span>' + esc(c.elapsed) + '</span></span>' +
    '<h3>' + esc(c.title) + '</h3>' +
    '<div class="cc-meta">' + esc(c.requester.name) + '・' + esc(c.requester.dept) + ' / ' + esc(c.device.name) + '</div>' +
    '<div class="cc-chips">' + chips.join('') + '</div>' +
    '<div class="cc-foot">' + foot + '</div>' +
    '</button>';
}

  const p = Math.min(100, Math.round((used / max) * 100));
  return '<div class="meter ' + (cls || '') + '"><span><em style="font-style:normal">' + label + '</em><em style="font-style:normal">' + used + '/' + max + '</em></span><div class="bar"><i style="width:' + p + '%"></i></div></div>';
}

function proposalHTML(p) {
  if (!p) return '';
  const statusPill = p.status === 'pending'
    ? '<span class="pill warn">本人 承認待ち</span>'
    : p.status === 'expired'
      ? '<span class="pill warn">期限切れ</span>'
      : '<span class="pill">本人が承認</span>';
  const approval = p.status === 'approved'
    ? esc(p.approvedBy) + ' ' + esc(p.approvedAt) + ' ・ <code class="hash" title="' + esc(p.hash) + '">' + esc(p.hash.slice(0, 16)) + '…</code>'
    : p.status === 'expired'

      : '本人の Y 待ち ・ 期限 <span class="countdown" data-exp="' + p.expiresAt + '">' + fmtLeft(p.expiresAt - Date.now()) + '</span>';
  const exec = p.exec
    ? '<div class="exec-mini"><span class="ok">実行 ✓</span>' + p.exec.rows.map(([k, v]) => '<code>' + esc(k) + '</code>=<b>' + esc(v) + '</b>').join(' ') + '</div>'
    : '';
  return '<article class="proposal ' + (p.status === 'pending' ? 'pending' : '') + '">' +
    '<div class="p-head">' +
      '<span class="risk lv' + p.risk + '">Lv' + p.risk + '</span>' +
      '<div class="p-title"><b>' + esc(p.title) + '</b><span class="skill-id mono">' + esc(p.skillId) + ' v' + esc(p.version) + '</span></div>' +
      statusPill +
    '</div>' +
    '<dl class="kv">' +
      '<dt>パラメータ</dt><dd><code>' + esc(JSON.stringify(p.params)) + '</code></dd>' +
      (p.impact ? '<dt>影響</dt><dd>' + esc(p.impact) + '</dd>' : '') +

      '<dt>戻し方</dt><dd>' + (p.reversible ? '可逆' : '<b class="bad">取消不可</b>') + ' — ' + esc(p.rollbackText) + '</dd>' +
      '<dt>承認</dt><dd>' + approval + '</dd>' +
    '</dl>' + exec + '</article>';
}

  const actor = e.actor ? '<span class="actor">' + esc(e.actor) + '</span>' : '';
  const chips = e.chips && e.chips.length ? '<div class="refs">' + e.chips.map((x) => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>' : '';
  const refs = e.refs && e.refs.length ? '<div class="refs">根拠: ' + e.refs.map((x) => '<span class="chip info">' + esc(x) + '</span>').join(' ') + '</div>' : '';
  let inner = '';
  if (kind === 'proposal') {
    inner = '<div class="tl-card proposal-wrap">' + proposalHTML(e.proposal) + '</div>';
  } else if (kind === 'exec') {
    const rows = (e.rows || []).map(([k, v]) => '<span class="er">' + esc(k) + '=<b>' + esc(v) + '</b></span>').join('');
    inner = '<div class="tl-card"><div class="tt">' + esc(e.title) + '</div><div class="exec-rows">' + rows + '</div></div>';
  } else if (kind === 'verify') {
    const items = (e.items || []).map(([label, mark]) => '<div class="v"><span class="mark ' + (mark === '✓' ? 'y' : 'n') + '">' + esc(mark) + '</span><span>' + esc(label) + '</span></div>').join('');
    inner = '<div class="tl-card"><div class="tt">' + esc(e.title) + '</div><div class="verify-list">' + items + '</div>' +
      (e.note ? '<div class="note-line">' + esc(e.note) + '</div>' : '') + '</div>';
  } else if (kind === 'handoff') {
    inner = '<div class="tl-card"><div class="tt">' + esc(e.title) + (e.to ? ' → ' + esc(e.to) : '') + '</div><div class="tb">' + esc(e.body) + '</div>' + chips + '</div>';
  } else {
    inner = '<div class="tl-card"><div class="tt">' + esc(e.title) + '</div>' +
      (e.body ? '<div class="tb">' + esc(e.body) + '</div>' : '') + refs + chips + '</div>';
  }
  return '<li class="' + cls + '"><span class="tl-dot" aria-hidden="true"></span>' +
    '<div class="tl-head">' + time + actor + '</div>' + inner + '</li>';
}

function proposalFor(c) {
  if (c.proposal) return c.proposal;
  const p = c.timeline.find((e) => e.kind === 'proposal' && e.proposal && e.proposal.status === 'pending');
  return p ? p.proposal : null;
}

function dockHTML(c) {
  if (c.resolved) {
    const counted = c.resolved.counted;
    const canDraft = state.role !== 'approver';
    return '<div class="dock">' +
      '<div class="resolved-banner">✓ ' + (counted ? '解決として記録済み' : '確認完了として記録済み（解決には計上しません）') +
      ' <span class="badge ' + (counted ? 'ok' : 'info') + '">' + esc(c.resolved.at) + ' / ' + esc(c.resolved.by) + '</span></div>' +
      '<div class="actions">' +
        '<button type="button" class="btn btn-primary" data-act="report">最終報告書を出力</button>' +
        (canDraft ? '<button type="button" class="btn" data-act="kb">ナレッジを起案</button>' : '') +
        '<button type="button" class="btn btn-ghost" data-act="audit">監査を開く</button>' +
        '<span class="spacer"></span><span class="hint">' + (counted ? '解決率に計上' : '解決率には計上しない（判断18=1）') + '</span>' +
      '</div></div>';
  }
  const p = proposalFor(c);
  const pending = p && p.status === 'pending';
  const isApprover = state.role === 'approver';
  const shown = state.copilot[c.id];
  const memoVal = state.memo[c.id] || '';
  return '<div class="dock">' +
    (pending ? '<div class="pending-strip"><b>本人の承認待ち</b><span class="mono">' + esc(p.skillId) + '</span>' +
      '<span class="countdown" data-exp="' + p.expiresAt + '">' + fmtLeft(p.expiresAt - Date.now()) + '</span>' +
      '<span>承認後に端末で実行されます（代行不可）</span></div>' : '') +
    '<div class="dock-top">' +
      (isApprover
        ? '<span class="dock-hint">承認者ロール: AI アシスト・実行・解決登録は使えません</span>'
        : '<button type="button" class="btn btn-ghost btn-sm" data-act="copilot" aria-expanded="' + (shown ? 'true' : 'false') + '">' +
            '<span>' + (shown ? 'AI の提案を閉じる' : 'AI に次の一手を相談') + '</span></button>' +
          '<span class="dock-hint">読み取り 4 種のみ ・ 実行しません</span>') +
      '<span class="spacer"></span>' +
      '<span class="mini-stat">ステップ ' + c.steps[0] + '/' + c.steps[1] + ' ・ AI ' + c.aiCalls[0] + '/' + c.aiCalls[1] + ' ・ 経過 ' + c.elapsed + '</span>' +
    '</div>' +
    (!isApprover && shown ? copilotHTML(c, shown) : '') +
    (isApprover ? '' : '<div class="composer">' +
      '<textarea id="memo" rows="2" placeholder="メモを残す（相談者には表示されません）">' + esc(memoVal) + '</textarea>' +
      '<button type="button" class="btn" data-act="memo">記録</button>' +
    '</div>') +
    '<div class="actions">' + actionButtons(c, isApprover) + '</div>' +
    '</div>';
}

function copilotHTML(c, st) {
  const head = '<div class="cp-head"><b>AI アシスト</b><span class="tag">デモ・固定応答</span>' +
    '<span class="tools">読み取り: ' + READONLY_TOOLS.map((t) => '<code>' + esc(t) + '</code>').join(' ') + '</span></div>';
  if (st === 'thinking') return '<div class="copilot">' + head + '<div class="cp-body thinking">この案件の記録と読み取り結果を確認しています</div></div>';
  const cp = c.copilot;
  return '<div class="copilot">' + head +
    '<div class="cp-body"><p>' + esc(cp.lead) + '</p>' +
    '<div class="cp-ev">根拠: ' + cp.evidence.map((x) => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>' +
    '<div class="cp-actions">' + cp.actions.map((a) => '<button type="button" class="btn ' + (a.primary ? 'btn-primary ' : '') + 'btn-sm" data-act="' + esc(a.act) + '">' + esc(a.label) + '</button>').join('') + '</div>' +
    '<p class="cp-note">' + esc(cp.note) + '</p></div></div>';
}

function actionButtons(c, isApprover) {
  const b = [];
  if (isApprover) {
    b.push('<button type="button" class="btn" data-act="approvals">ナレッジ承認キュー（2）</button>');
    b.push('<button type="button" class="btn" data-act="audit">監査を開く</button>');
    b.push('<span class="hint">承認者ロール: 解決の登録・端末の実行はできません（権限分離）</span>');
    return b.join('');
  }
  if (!c.assignee) b.push('<button type="button" class="btn btn-primary" data-act="claim">引き受ける</button>');
  switch (c.outcome.kind) {
    case 'resolvable-change':
      b.push('<button type="button" class="btn btn-ok" data-act="resolve">解決を記録（変更あり・Lv' + c.outcome.risk + '）</button>');
      break;
    case 'readonly-done':
      b.push('<button type="button" class="btn" data-act="readonly">確認完了を記録（解決に計上しない）</button>');
      break;
    case 'awaiting-approval': {
      const p = proposalFor(c);
      if (p && p.status === 'pending') {
        b.push('<button type="button" class="btn" data-act="preview">本人の承認画面</button>');
        b.push('<button type="button" class="btn btn-danger" data-act="withdraw">提案を取り下げ</button>');
        b.push('<button type="button" class="btn" data-act="exec-disabled" disabled title="本人の承認が必要です（担当者は代行できません）">実行（本人承認が必要）</button>');
      } else {
        b.push('<button type="button" class="btn" data-act="preview">提案の記録</button>');
        b.push('<span class="hint">提案は期限切れです。再提案には本人の承認を取り直します。</span>');
      }
      break;
    }
    case 'no-skill':
    case 'out-of-kb':
      b.push('<button type="button" class="btn" data-act="handoff">引継ぎメモを作成</button>');
      break;
  }
  if (c.outcome.kind !== 'awaiting-approval') {
    b.push('<button type="button" class="btn" data-act="kb">ナレッジを起案</button>');
  }
  if (c.outcome.kind === 'resolvable-change' || c.outcome.kind === 'readonly-done') {
    b.push('<button type="button" class="btn btn-ghost" data-act="handoff">引継ぎ</button>');
  }
  b.push('<button type="button" class="btn btn-ghost" data-act="audit">監査</button>');
  return b.join('');
}

function renderCase() {
  const c = current();
  const old = document.querySelector('.timeline-wrap');
  if (old && !state.resetScroll) state.scrollTop = old.scrollTop;
  const scrollTop = state.scrollTop;
  state.resetScroll = false;
  const roleBanner = state.role === 'approver'
    ? '<div class="role-banner">承認者ロールで表示中：案件の閲覧・ナレッジ承認・監査のみ。解決の登録・端末の実行はできません。</div>' : '';
  const head = '<div class="case-head">' +
    '<div class="top-line">' +
      '<span class="signal-dot ' + (c.signal === 'red' ? 's-red' : c.signal === 'amber' ? 's-amber' : 's-blue') + '" aria-hidden="true"></span>' +
      '<h1>' + esc(c.title) + '</h1>' +
      '<span class="state-pill ' + statusOf(c) + '">' + statusLabel(c) + '</span>' +
    '</div>' +
    '<div class="case-meta">' +
      '<span><span class="mono">' + esc(c.id) + '</span> / ' + esc(c.inc) + '</span>' +
      '<span><span class="mi">相談者</span>' + esc(c.requester.name) + '（' + esc(c.requester.dept) + '）</span>' +
      '<span><span class="mi">端末</span>' + esc(c.device.name) + '</span>' +
      '<span><span class="mi">経過</span>' + esc(c.elapsed) + '</span>' +
      '<span><span class="mi">担当</span>' + (c.assignee ? esc(c.assignee) : '未割当') + '</span>' +
    '</div>' +
    '<div class="meters">' +
      meter('ステップ', c.steps[0], c.steps[1], c.steps[0] >= c.steps[1] ? 'danger' : '') +
      meter('経過（分）', c.session[0], c.session[1], c.session[0] >= 26 ? 'warn' : '') +
      meter('AI 呼び出し', c.aiCalls[0], c.aiCalls[1], '') +
    '</div></div>';
  const timeline = '<div class="timeline-wrap"><ol class="timeline">' +
    c.timeline.map(timelineItemHTML).join('') +
    (c.memos.length ? c.memos.map((m) => '<li class="tl-item k-memo"><span class="tl-dot" aria-hidden="true"></span><div class="tl-head"><span class="time">' + esc(m.t) + '</span><span class="actor">' + esc(m.actor) + '</span></div><div class="tl-card"><div class="tb">' + esc(m.body) + '</div></div></li>').join('') : '') +
    '</ol></div>';
  const el = document.getElementById('casePane');
  el.innerHTML = roleBanner + head + timeline + dockHTML(c);
  const tw = el.querySelector('.timeline-wrap');
  if (tw) tw.scrollTop = state.scrollBottom ? tw.scrollHeight : scrollTop;
  state.scrollBottom = false;
  state.scrollTop = tw ? tw.scrollTop : 0;
}

/* =========================================================================
   描画: 右ペイン（端末・verify・監査）
   ========================================================================= */
function deviceCard(c) {
  const d = c.device;
  const row = (k, v) => '<div class="dev-row"><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>';
  return '<div class="ev-card"><div class="ev-head">端末（本人が共有した範囲）<span class="badge info">読み取り</span></div><div class="ev-body">' +
    '<dl style="margin:0">' +
      row('端末名', d.name) + row('型番', d.model) + row('OS', d.os) + row('CPU', d.cpu) + row('メモリ', d.mem) + row('空き容量', d.disk) + row('最終同期', d.sync) +
    '</dl>' +
    '<div class="share-chips"><span class="chip">基本情報</span><span class="chip">サービス状態</span><span class="chip muted">画面・キー入力は取得しない</span></div>' +
    '<div class="ev-note">IP・シリアル・資産番号・メールは AI に渡す前に伏せています。</div>' +
    '</div></div>';
}

function verifyCard(c) {
  const v = c.verify;
  const badge = v.state === 'ok' ? '<span class="badge ok">成功</span>'
    : v.state === 'pending' ? '<span class="badge warn">実行前</span>'
      : v.state === 'na' ? '<span class="badge info">対象外</span>'
        : '<span class="badge">未実施</span>';
  const items = v.items.length
    ? '<div class="verify-list">' + v.items.map((i) => '<div class="v"><span class="mark ' + (i.ok ? 'y' : 'n') + '">' + (i.ok ? '✓' : '×') + '</span><span>' + esc(i.label) + '<small> ' + esc(i.at) + ' / ' + esc(i.by) + '</small></span></div>').join('') + '</div>'
    : '<div class="ev-note">' + (v.state === 'pending' ? '本人の承認後に実行・評価します。' : v.state === 'na' ? '読み取りのみのため verify の対象外です。' : '端末での実行はありません。') + '</div>';
  return '<div class="ev-card"><div class="ev-head">検証（verify）' + badge + '</div><div class="ev-body">' + items +
    '<div class="ev-note">判定はサーバが result と条件を突き合わせて行います（AI の自己申告ではありません）。</div>' +
    '</div></div>';
}

function auditCard(c) {
  const rows = c.audit.slice(-4).map((r) =>
    '<div class="audit-row"><span class="at">' + esc(r.t) + '</span><span class="aa"><b>' + esc(r.action) + '</b><code title="' + esc(r.hash) + '">' + esc(r.hash.slice(0, 10)) + '…</code></span></div>'
  ).join('');
  return '<div class="ev-card"><div class="ev-head">監査（ハッシュチェーン）<span class="badge ok">検証済み</span></div><div class="ev-body">' +
    rows +
    '<div class="ev-actions"><button type="button" class="btn btn-sm" data-act="audit">全 ' + c.audit.length + ' 件を開く</button>' +
    '<button type="button" class="btn btn-sm btn-ghost" data-act="verify-chain">鎖を検証</button></div>' +
    '<div class="ev-note">各イベントは直前のハッシュを含めて再計算します。承認ハッシュもここに紐づきます。</div>' +
    '</div></div>';
}

function supportCard(c) {
  const kb = c.kb
    ? '<div class="kb-line"><span><b>' + esc(c.kb.no) + '</b> ' + esc(c.kb.title) + '</span><span class="badge info">' + esc(c.kb.match) + '</span></div>'
    : '<div class="kb-line"><span>一致する KB なし</span><span class="badge">KB 外</span></div>';
  const p = proposalFor(c);
  const ttl = p && p.status === 'pending'
    ? '<div class="ttl-note">承認ハッシュの有効期限: 5 分（<span class="countdown" data-exp="' + p.expiresAt + '">' + fmtLeft(p.expiresAt - Date.now()) + '</span>）</div>'
    : '';
  return '<div class="ev-card"><div class="ev-head">支援・ナレッジ</div><div class="ev-body">' + kb + ttl +
    '<div class="ev-actions">' +
      '<button type="button" class="btn btn-sm" data-act="remote">遠隔支援</button>' +
      '<button type="button" class="btn btn-sm" data-act="kb">ナレッジを起案</button>' +
      '<button type="button" class="btn btn-sm btn-ghost" data-act="report">最終報告書</button>' +
    '</div>' +
    '<div class="ev-note">遠隔支援は本人の同意範囲のみ。画面共有と操作支援は別々に同意します。</div>' +
    '</div></div>';
}

function renderEvidence() {
  const c = current();
  document.getElementById('evidencePane').innerHTML = deviceCard(c) + verifyCard(c) + auditCard(c) + supportCard(c);
}

/* =========================================================================
   全体
   ========================================================================= */
function renderAll() {
  renderFilters();
  renderList();
  renderCase();
  renderEvidence();
  document.querySelectorAll('[data-act="role"]').forEach((b) => b.classList.toggle('on', b.dataset.role === state.role));
  const chip = document.querySelector('.user-chip small');
  if (chip) chip.textContent = USER.dept + ' ／ ' + ROLE_LABEL[state.role];
}

function fmtLeft(ms) {
  if (ms <= 0) return '期限切れ';
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function toast(msg, kind) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.remove(); }, 3600);
}

/* =========================================================================
   操作
   ========================================================================= */
function selectCase(id) {
  if (id === state.selected) return;
  state.selected = id;
  state.resetScroll = true;
  state.scrollTop = 0;
  state.scrollBottom = false;
  renderAll();
}

function claim(c) {
  if (state.role === 'approver') { toast('承認者は担当者になれません（権限分離）', 'warn'); return; }
  if (c.assignee) return;
  c.assignee = USER.name;
  c.timeline.push({ t: nowHHMM(), kind: 'memo', actor: USER.name, title: '引き受けました', body: '担当: ' + USER.name + '（' + USER.dept + '）。' });
  addAudit(c, USER.name, 'case.claimed');
  state.scrollBottom = true;
  renderAll();
  toast('引き受けました。担当: ' + USER.name, 'ok');
}

function addAudit(c, actor, action) {
  const prev = c.audit.length ? c.audit[c.audit.length - 1].hash : ZERO;
  c.audit.push({ t: nowHHMM(), actor, action, prev, hash: H(c.id + '|' + prev + '|' + action + '|' + actor) });
}

function saveMemo(c) {
  if (state.role === 'approver') { toast('承認者ロールではメモを記録できません（参照のみ）', 'warn'); return; }
  const ta = document.getElementById('memo');
  const text = ta ? ta.value.trim() : '';
  if (!text) { toast('メモが空です'); return; }
  state.memo[c.id] = '';
  c.timeline.push({ t: nowHHMM(), kind: 'memo', actor: USER.name, title: '担当者メモ', body: text });
  addAudit(c, USER.name, 'case.note');
  state.scrollBottom = true;
  renderAll();
  toast('メモを記録しました');
}

function askCopilot(c) {
  if (state.copilot[c.id] === 'done') {
    state.copilot[c.id] = '';
    renderCase();
    return;
  }
  state.copilot[c.id] = 'thinking';
  renderCase();
  setTimeout(() => {
    state.copilot[c.id] = 'done';
    renderCase();
  }, 750);
}

/* ---- モーダル ---- */
function openModal(opts) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-backdrop">' +
    '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
      '<div class="modal-head"><div><h3>' + esc(opts.title) + '</h3>' + (opts.sub ? '<p>' + esc(opts.sub) + '</p>' : '') + '</div>' +
      '<button type="button" class="x" data-act="close-modal" aria-label="閉じる">×</button></div>' +
      '<div class="modal-body">' + opts.body + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
    '</div></div>';
  document.body.classList.add('modal-open');
  const backdrop = root.querySelector('.modal-backdrop');
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  const first = root.querySelector('.modal button, .modal input, .modal textarea, .modal select');
  if (first) first.focus();
}

function closeModal() {
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
  document.body.classList.remove('modal-open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ---- 解決 / 確認完了 ---- */
function openResolve(c, readonly) {
  if (state.role === 'approver') { toast('承認者は解決の登録ができません（権限分離）', 'warn'); return; }
  if (!c.assignee) { toast('先に「引き受ける」を押してください', 'warn'); return; }
  const title = readonly ? '確認完了を記録（解決に計上しない）' : '解決を記録（変更あり・Lv' + c.outcome.risk + '）';
  const sub = c.id + ' ／ ' + c.title;
  const verified = c.verify.items.filter((i) => i.ok).map((i) => i.label).join(' / ') || '—';
  const body =
    (readonly
      ? '<div class="callout warn"><b>判断18=1（現状維持）</b><br>読み取りのみで完了した相談は「解決」に計上しません。この記録は「確認完了」として残り、解決率には入りません。</div>'
      : '<div class="callout"><b>解決の条件を満たしています</b><br>変更を伴う対応（Lv' + c.outcome.risk + '）と verify の成功が記録されています。</div>') +
    '<div class="form-row"><label>対応内容</label><textarea id="f-summary" rows="3">' +
      (readonly ? '読み取りで状態を確認し、案内を提示。変更操作は行っていない。' : 'verify 成功を確認。実印刷の最終確認も完了し、利用者の作業再開を確認した。') +
    '</textarea></div>' +
    '<div class="form-row"><label>実施者</label><input id="f-by" value="' + esc(USER.name + ' ／ ' + USER.dept) + '" readonly></div>' +
    (readonly ? '' : '<div class="form-row"><label>検証（サーバ評価）</label><div class="checkline">✓ ' + esc(verified) + '</div></div>') +
    '<label class="check"><input type="checkbox" id="f-kb" checked> ナレッジの下書きも作成する（承認は別の承認者が行います）</label>' +
    (readonly ? '<div class="callout info">解決として扱うには、変更を伴う対応（risk 2 以上）と verify の成功が必要です。必要なら所管へ引継ぎしてください。</div>' : '');
  openModal({
    title, sub, body,
    footer: '<button type="button" class="btn" data-act="close-modal">キャンセル</button>' +
      '<button type="button" class="btn ' + (readonly ? '' : 'btn-ok') + '" data-act="do-resolve" data-readonly="' + (readonly ? '1' : '0') + '">' +
      (readonly ? '確認完了を記録' : '解決として記録') + '</button>'
  });
}

function submitResolve(readonly) {
  const c = current();
  const summaryEl = document.getElementById('f-summary');
  const kbEl = document.getElementById('f-kb');
  const summary = summaryEl ? summaryEl.value.trim() : '';
  const withKb = kbEl ? kbEl.checked : false;
  if (!summary) { toast('対応内容を入力してください', 'warn'); return; }
  c.resolved = { at: nowHHMM(), by: USER.name, counted: !readonly, summary };
  if (readonly) state.readonlyToday++; else state.solvedToday++;
  c.timeline.push({
    t: nowHHMM(), kind: 'resolve', actor: USER.name,
    title: readonly ? '確認完了を記録（集計外）' : '解決を記録',
    body: summary,
    chips: readonly ? ['判断18=1', '解決率には計上しない'] : ['変更あり・Lv' + c.outcome.risk, '解決率に計上']
  });
  addAudit(c, USER.name, readonly ? 'case.confirmed not_counted' : 'case.resolved');
  if (withKb) {
    c.kbDraft = true;
    addAudit(c, 'サーバ', 'knowledge.draft');
    c.timeline.push({ t: nowHHMM(), kind: 'memo', actor: 'システム', title: 'ナレッジの下書きを作成', body: '承認待ち（申請者と承認者は別）。', chips: ['KB 下書き'] });
  }
  closeModal();
  state.scrollBottom = true;
  renderAll();
  toast(readonly ? '確認完了を記録しました（解決には計上しません）' : '解決として記録しました', 'ok');
}

function submitKb() {

function submitHandoff() {

/* ---- 承認待ちのプレビュー（本人の画面） ---- */

/* ---- 監査 ---- */
function openAudit(c) {
  const rows = c.audit.map((r) =>
    '<tr><td>' + esc(r.t) + '</td><td>' + esc(r.actor) + '</td><td>' + esc(r.action) + '</td>' +
    '<td><code>' + esc(r.prev.slice(0, 8)) + '…</code></td><td><code>' + esc(r.hash.slice(0, 12)) + '…</code></td></tr>'
  ).join('');
  const body =
    '<div class="callout info">監査ログはハッシュチェーンです。各行の <code>hash</code> は「前の hash + イベント内容」から再計算できます。<br>表示はデモ用の擬似値で、実装はサーバ側の SHA-256 です。</div>' +
    '<table class="audit-table"><thead><tr><th>時刻</th><th>実行者</th><th>イベント</th><th>prev</th><th>hash</th></tr></thead><tbody>' + rows + '</tbody></table>';
  openModal({
    title: '監査ログ', sub: c.id + ' ／ 全 ' + c.audit.length + ' 件', body, wide: true,
    footer: '<button type="button" class="btn" data-act="verify-chain">鎖を検証</button>' +
      '<button type="button" class="btn btn-primary" data-act="close-modal">閉じる</button>'
  });
}

function verifyChain() {
  const c = current();
  let prev = ZERO;
  let broken = 0;
  c.audit.forEach((r) => {
    const expect = H(c.id + '|' + prev + '|' + r.action + '|' + r.actor);
    if (r.prev !== prev || r.hash !== expect) broken++;
    prev = r.hash;
  });
  toast(broken === 0
    ? '監査チェーンを検証しました：' + c.audit.length + ' 件すべて一致（不一致 0）'
    : '不一致 ' + broken + ' 件を検出しました', broken === 0 ? 'ok' : 'warn');
}

/* ---- 読み方 ---- */
function openHelp() {
  const body =

      '<li><span class="n">2</span><span><b>中: 経過と次の一手</b> — 相談 → AI → 提案 → 本人 Y/N → 実行 → verify → 引継ぎ。担当者は<b>提案の作成と状況確認まで</b>で、実行は代行できない。</span></li>' +

/* =========================================================================
   イベント
   ========================================================================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const c = current();
  switch (act) {
    case 'select': selectCase(t.dataset.id); break;
    case 'filter': state.filter = t.dataset.filter; renderAll(); break;
    case 'role': state.role = t.dataset.role; renderAll(); toast(state.role === 'approver' ? '承認者ロールに切り替えました（参照・承認のみ）' : 'ヘルプデスクロールに切り替えました'); break;
    case 'refresh': renderAll(); toast('最新の状態に更新しました（デモ）'); break;
    case 'claim': claim(c); break;
    case 'resolve': openResolve(c, false); break;
    case 'readonly': openResolve(c, true); break;
    case 'kb': openKb(c); break;
    case 'handoff': openHandoff(c); break;
    case 'preview': openPreview(c); break;
    case 'withdraw': openWithdraw(c); break;
    case 'audit': openAudit(c); break;
    case 'verify-chain': verifyChain(); break;
    case 'remote': openRemote(c); break;
    case 'report': openReport(c); break;
    case 'report-demo': closeModal(); toast('最終報告書の出力はデモでは行いません'); break;
    case 'help': openHelp(); break;
    case 'copilot': askCopilot(c); break;
    case 'memo': saveMemo(c); break;
    case 'approvals': openApprovals(); break;
    case 'approve-kb': toast('デモのため、承認・差戻しは実行しません', 'warn'); break;
    case 'request-remote': closeModal(); toast('同意の依頼を送りました（デモ）', 'ok'); break;
    case 'close-modal': closeModal(); break;
    case 'do-resolve': submitResolve(t.dataset.readonly === '1'); break;
    case 'do-kb': submitKb(); break;
    case 'do-handoff': submitHandoff(); break;
    case 'do-withdraw': submitWithdraw(); break;
    default: break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'search') {
    state.query = e.target.value;
    renderList();
  }
  if (e.target.id === 'memo') {
    state.memo[state.selected] = e.target.value;
  }
});

/* 承認期限のカウントダウン */
setInterval(() => {
  document.querySelectorAll('[data-exp]').forEach((el) => {
    const left = Number(el.dataset.exp) - Date.now();
    el.textContent = fmtLeft(left);
    el.classList.toggle('expired', left <= 0);
  });
}, 1000);

/* 初期描画 */
renderAll();
</script>
